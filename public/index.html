<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamVault Pro - #1 Ultimate Cinema Hub</title>
    
    <!-- Silence Tailwind CDN console warning -->
    <script>
      const origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        origWarn.apply(console, args);
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              accent: '#E50914',
              accentHover: '#B80710',
              liquidDark: 'rgba(10, 10, 18, 0.82)',
              liquidCard: 'rgba(255, 255, 255, 0.04)',
              liquidBorder: 'rgba(255, 255, 255, 0.12)',
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
            },
            boxShadow: {
              liquidGlow: '0 8px 32px 0 rgba(0, 0, 0, 0.45)',
              accentGlow: '0 0 25px rgba(229, 9, 20, 0.55)',
              glassHighlight: 'inset 0 1.5px 0 0 rgba(255, 255, 255, 0.35)',
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #040407;
        color: #f3f4f6;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow-x: hidden;
      }

      /* iOS 18 Glassmorphism Utility */
      .glass-panel {
        background: rgba(14, 14, 24, 0.8);
        backdrop-filter: blur(28px) saturate(200%);
        -webkit-backdrop-filter: blur(28px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
      }

      .glass-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card:hover {
        transform: translateY(-8px) scale(1.025);
        border-color: rgba(229, 9, 20, 0.6);
        box-shadow: 0 16px 36px rgba(229, 9, 20, 0.3), inset 0 1.5px 0 0 rgba(255, 255, 255, 0.4);
      }

      .nav-link-btn {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.55rem 1.35rem;
        border-radius: 9999px;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        font-size: 0.8rem;
      }

      .nav-link-btn.active {
        background: linear-gradient(135deg, #e50914 0%, #b80710 100%);
        color: white;
        box-shadow: 0 0 22px rgba(229, 9, 20, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.35);
      }

      /* Skeleton shimmer animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.04) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #040407;
      }
      ::-webkit-scrollbar-thumb {
        background: #202030;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #e50914;
      }

      /* Horizontal Scroll Row Styling */
      .horizontal-carousel {
        display: flex;
        gap: 1.25rem;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-behavior: smooth;
        padding-bottom: 1rem;
        padding-top: 0.25rem;
        -webkit-overflow-scrolling: touch;
      }
      .horizontal-carousel > div {
        flex: 0 0 160px;
      }
      @media (min-width: 640px) {
        .horizontal-carousel > div {
          flex: 0 0 200px;
        }
      }
      @media (min-width: 1024px) {
        .horizontal-carousel > div {
          flex: 0 0 220px;
        }
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col antialiased">
    <!-- BACKGROUND AMBIENT LIQUID MESH GLOW -->
    <div class="fixed top-0 left-1/4 w-[500px] h-[500px] bg-red-600/12 rounded-full blur-[140px] pointer-events-none -z-10 animate-pulse"></div>
    <div class="fixed bottom-0 right-1/4 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[140px] pointer-events-none -z-10"></div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- HEADER NAVIGATION -->

        <!-- Logo -->
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('home')">

              <path d="M8 5v14l11-7z" />
            </svg>
          </div>

        <!-- Navigation Tabs -->
        <nav class="hidden lg:flex items-center gap-2">
          <button id="tab-home" onclick="switchTab('home')" class="nav-link-btn active">Home</button>
          <button id="tab-movies" onclick="switchTab('movies')" class="nav-link-btn text-gray-300 hover:text-white">Movies</button>
          <button id="tab-tv" onclick="switchTab('tv')" class="nav-link-btn text-gray-300 hover:text-white">TV Shows</button>

          <button id="tab-watchlist" onclick="switchTab('watchlist')" class="nav-link-btn text-gray-300 hover:text-white flex items-center gap-2">

        <!-- Search Bar -->

          </svg>
        </div>
      </div>

      <!-- Mobile Sub-navigation bar -->
      <div class="flex lg:hidden overflow-x-auto px-4 py-2.5 gap-2 border-t border-white/5 bg-black/50 backdrop-blur-xl">
        <button id="mob-tab-home" onclick="switchTab('home')" class="text-xs font-heading font-black uppercase px-4 py-1.5 rounded-full whitespace-nowrap bg-accent text-white">Home</button>
        <button id="mob-tab-movies" onclick="switchTab('movies')" class="text-xs font-heading font-black uppercase px-4 py-1.5 rounded-full whitespace-nowrap text-gray-300 hover:bg-white/10">Movies</button>
        <button id="mob-tab-tv" onclick="switchTab('tv')" class="text-xs font-heading font-black uppercase px-4 py-1.5 rounded-full whitespace-nowrap text-gray-300 hover:bg-white/10">TV Shows</button>
        <button id="mob-tab-anime" onclick="switchTab('anime')" class="text-xs font-heading font-black uppercase px-4 py-1.5 rounded-full whitespace-nowrap text-gray-300 hover:bg-white/10">Anime</button>
        <button id="mob-tab-watchlist" onclick="switchTab('watchlist')" class="text-xs font-heading font-black uppercase px-4 py-1.5 rounded-full whitespace-nowrap text-gray-300 hover:bg-white/10">Watchlist (<span id="mobWatchlistCount">0</span>)</button>
      </div>
    </header>

    <!-- MAIN CONTENT CONTAINERS -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-10">
      <!-- HERO BANNER SECTION -->
      <section id="heroSection" class="relative rounded-3xl overflow-hidden glass-card h-[400px] sm:h-[480px] flex items-end p-6 sm:p-10 border border-white/15 shadow-2xl">
        <div id="heroBg" class="absolute inset-0 bg-cover bg-center transition-all duration-1000 ease-out"></div>

        <div class="relative z-10 max-w-2xl space-y-4">

          <h1 id="heroTitle" class="text-3xl sm:text-5xl font-heading font-black text-white leading-tight drop-shadow-lg">

          <p id="heroOverview" class="text-gray-300 text-xs sm:text-sm line-clamp-3 leading-relaxed drop-shadow">

          <div class="flex items-center gap-4 pt-2">

      <!-- HOME TAB -->

              </div>

          </div>
          <div id="homeMoviesGrid" class="horizontal-carousel">
            <!-- Skeletons -->

            <div class="skeleton aspect-[2/3] rounded-2xl"></div>
            <div class="skeleton aspect-[2/3] rounded-2xl"></div>
            <div class="skeleton aspect-[2/3] rounded-2xl"></div>

        </section>

        <section class="space-y-4">

            <div class="flex items-center gap-3">
              <div class="hidden sm:flex gap-1.5">
                <button onclick="scrollCarousel('homeTvGrid', -500)" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 flex items-center justify-center text-white transition-all shadow-glassHighlight">‹</button>

    <!-- SCRIPT LOGIC -->
    <script>
      const TMDB_API_KEY = '6c9d63d13035995f6127e4b5c3689cb4';
      const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
      const POSTER_BASE_URL = 'https://image.tmdb.org/p/w780';
      const BACKDROP_BASE_URL = 'https://image.tmdb.org/p/original';

      let cache = {};
      let watchlist = JSON.parse(localStorage.getItem('streamvault_watchlist')) || [];
      let currentModalItem = null;
      let heroItem = null;
      let currentServerIndex = 0;

      let selectedMovieGenre = null;
      let selectedTvGenre = null;

      function showToast(message) {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'glass-panel px-5 py-3.5 rounded-2xl text-xs sm:text-sm text-white font-heading font-bold shadow-2xl border border-white/20 flex items-center gap-3 animate-bounce';
        toast.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-accent shadow-accentGlow"></span><span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      function updateWatchlistBadge() {
        const count = watchlist.length;
        const badge = document.getElementById('watchlistBadge');
        const mobCount = document.getElementById('mobWatchlistCount');
        if (badge) badge.innerText = count;
        if (mobCount) mobCount.innerText = count;
        localStorage.setItem('streamvault_watchlist', JSON.stringify(watchlist));
      }

      function isItemInWatchlist(id) {
        return watchlist.some(item => item.id === id);
      }

      window.scrollCarousel = function(containerId, distance) {
        const container = document.getElementById(containerId);
        if (container) {
          container.scrollBy({ left: distance, behavior: 'smooth' });
        }
      };

      async function fetchTMDB(endpoint, extraParams = '') {
        const key = endpoint + extraParams;
        if (cache[key]) return cache[key];
        try {
          const res = await fetch(`${TMDB_BASE_URL}${endpoint}?api_key=${TMDB_API_KEY}&language=en-US${extraParams}`);
          const data = await res.json();
          cache[key] = data;
          return data;
        } catch (err) {
          console.error("TMDB Fetch Error:", err);
          return null;
        }
      }

      function createCardHTML(item) {
        const title = (item.title || item.name || 'Untitled').replace(/'/g, "&apos;");
        const date = (item.release_date || item.first_air_date || '').substring(0, 4) || '2024';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
        const poster = item.poster_path ? POSTER_BASE_URL + item.poster_path : 'https://placehold.co/780x1170/10101a/ffffff?text=' + encodeURIComponent(title);
        const inList = isItemInWatchlist(item.id);
        const itemData = encodeURIComponent(JSON.stringify(item));

        return `
          <div class="glass-card rounded-2xl overflow-hidden cursor-pointer flex flex-col group relative shadow-xl" onclick="playMedia('${itemData}')">
            <div class="relative aspect-[2/3] w-full overflow-hidden bg-zinc-900">
              <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out" loading="lazy" />
              <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-3.5">
                <button class="w-full py-2.5 bg-accent hover:bg-accentHover text-white text-xs font-heading font-black rounded-xl shadow-accentGlow flex items-center justify-center gap-2 transition-all">
                  <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                  <span>Stream Now</span>
                </button>
              </div>
              <div class="absolute top-2.5 right-2.5 bg-black/80 backdrop-blur-md px-2.5 py-1 rounded-full text-[11px] font-black text-yellow-400 border border-yellow-500/30 shadow-lg">
                ★ ${rating}
              </div>
              <button onclick="event.stopPropagation(); toggleWatchlistFromCard('${itemData}')" class="absolute top-2.5 left-2.5 w-8 h-8 rounded-full bg-black/80 backdrop-blur-md flex items-center justify-center text-white hover:bg-accent transition-all border border-white/20 shadow-lg">
                ${inList ? '✓' : '+'}
              </button>
            </div>
            <div class="p-3.5 flex-1 flex flex-col justify-between space-y-1 bg-zinc-950/60">
              <h3 class="font-heading font-black text-xs sm:text-sm text-white line-clamp-1 group-hover:text-accent transition-colors">${title}</h3>
              <p class="text-[11px] text-gray-400 font-medium">${date} • ${item.title ? 'Movie' : 'TV Series'}</p>
            </div>
          </div>
        `;
      }

      window.toggleWatchlistFromCard = function(encodedItem) {
        const item = JSON.parse(decodeURIComponent(encodedItem));
        const index = watchlist.findIndex(i => i.id === item.id);
        if (index > -1) {
          watchlist.splice(index, 1);
          showToast(`Removed "${item.title || item.name}" from Watchlist`);
        } else {
          watchlist.push(item);
          showToast(`Added "${item.title || item.name}" to Watchlist`);
        }
        updateWatchlistBadge();
        renderWatchlist();
      };

      window.switchTab = function(tabName) {
        ['home', 'movies', 'tv', 'anime', 'watchlist'].forEach(t => {
          const btn = document.getElementById(`tab-${t}`);
          const mobBtn = document.getElementById(`mob-tab-${t}`);
          const view = document.getElementById(`view-${t}`);
          if (btn) btn.classList.remove('active', 'text-white');
          if (mobBtn) mobBtn.className = 'text-xs font-heading font-black uppercase px-4 py-1.5 rounded-full whitespace-nowrap text-gray-300 hover:bg-white/10';
          if (view) view.classList.add('hidden');
        });

        const activeBtn = document.getElementById(`tab-${tabName}`);
        const activeMobBtn = document.getElementById(`mob-tab-${tabName}`);
        const activeView = document.getElementById(`view-${tabName}`);
        
        if (activeBtn) activeBtn.classList.add('active');
        if (activeMobBtn) activeMobBtn.className = 'text-xs font-heading font-black uppercase px-4 py-1.5 rounded-full whitespace-nowrap bg-accent text-white';
        if (activeView) activeView.classList.remove('hidden');

        if (tabName === 'watchlist') {
          renderWatchlist();
        }
      };

      window.playMedia = async function(encodedItem, serverIndex = 0) {
        const item = JSON.parse(decodeURIComponent(encodedItem));
        currentModalItem = item;
        currentServerIndex = serverIndex;

        const modal = document.getElementById('playerModal');
        const iframe = document.getElementById('modalIframe');
        
        document.getElementById('modalTitle').innerText = item.title || item.name;
        document.getElementById('modalOverview').innerText = item.overview || 'No description available for this title.';
        document.getElementById('modalRating').innerText = `★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}`;
        document.getElementById('modalGenreBadge').innerText = item.title ? 'Movie' : 'TV Series';
        
        const wBtn = document.getElementById('modalWatchlistBtn');
        wBtn.innerText = isItemInWatchlist(item.id) ? '✓ In Watchlist' : '+ Add to Watchlist';

        const isMovie = !!item.title;
        const id = item.id;

        if (serverIndex === 0) {
          iframe.src = isMovie ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/1/1`;
        } else if (serverIndex === 1) {
          iframe.src = isMovie ? `https://multiembed.mov/?video_id=${id}&tmdb=1` : `https://multiembed.mov/?video_id=${id}&tmdb=1&s=1&e=1`;
        } else {
          const type = isMovie ? 'movie' : 'tv';
          const videos = await fetchTMDB(`/${type}/${id}/videos`);
          let trailerKey = 'dQw4w9WgXcQ';
          if (videos && videos.results && videos.results.length) {
            const trailer = videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube') || videos.results[0];
            trailerKey = trailer.key;
          }
          iframe.src = `https://www.youtube.com/embed/${trailerKey}?autoplay=1`;
        }

        let serverSelector = document.getElementById('serverSelector');
        if (!serverSelector) {
          const container = document.querySelector('#playerModal .p-6');
          serverSelector = document.createElement('div');
          serverSelector.id = 'serverSelector';
          serverSelector.className = 'flex flex-wrap items-center gap-2 pt-2 border-t border-white/10 mt-4';
          container.insertBefore(serverSelector, document.getElementById('modalOverview'));
        }

        const encodedStr = encodeURIComponent(JSON.stringify(item));
        serverSelector.innerHTML = `
          <span class="text-xs font-heading font-black text-gray-400 mr-2 uppercase">Stream Source:</span>
          <button onclick="playMedia('${encodedStr}', 0)" class="px-3.5 py-1.5 rounded-xl text-xs font-heading font-extrabold transition-all ${serverIndex === 0 ? 'bg-accent text-white shadow-accentGlow' : 'bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10'}">Server 1 (VidSrc 1080p)</button>
          <button onclick="playMedia('${encodedStr}', 1)" class="px-3.5 py-1.5 rounded-xl text-xs font-heading font-extrabold transition-all ${serverIndex === 1 ? 'bg-accent text-white shadow-accentGlow' : 'bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10'}">Server 2 (SuperEmbed HD)</button>
          <button onclick="playMedia('${encodedStr}', 2)" class="px-3.5 py-1.5 rounded-xl text-xs font-heading font-extrabold transition-all ${serverIndex === 2 ? 'bg-accent text-white shadow-accentGlow' : 'bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10'}">Official Trailer</button>
        `;

        modal.classList.remove('hidden');
      };

      window.closePlayer = function() {
        const modal = document.getElementById('playerModal');
        const iframe = document.getElementById('modalIframe');
        iframe.src = '';
        modal.classList.add('hidden');
      };

      window.toggleModalWatchlist = function() {
        if (!currentModalItem) return;
        const index = watchlist.findIndex(i => i.id === currentModalItem.id);
        const wBtn = document.getElementById('modalWatchlistBtn');
        if (index > -1) {
          watchlist.splice(index, 1);
          wBtn.innerText = '+ Add to Watchlist';
          showToast(`Removed from Watchlist`);
        } else {
          watchlist.push(currentModalItem);
          wBtn.innerText = '✓ In Watchlist';
          showToast(`Added to Watchlist`);
        }
        updateWatchlistBadge();
        renderWatchlist();
      };

      window.toggleHeroWatchlist = function() {
        if (!heroItem) return;
        const index = watchlist.findIndex(i => i.id === heroItem.id);
        const hText = document.getElementById('heroWatchlistText');
        if (index > -1) {
          watchlist.splice(index, 1);
          hText.innerText = '+ Add to Watchlist';
          showToast(`Removed from Watchlist`);
        } else {
          watchlist.push(heroItem);
          hText.innerText = '✓ In Watchlist';
          showToast(`Added to Watchlist`);
        }
        updateWatchlistBadge();
      };

      window.clearWatchlist = function() {
        watchlist = [];
        updateWatchlistBadge();
        renderWatchlist();
        showToast('Watchlist cleared');
      };

      function renderWatchlist() {
        const grid = document.getElementById('watchlistGrid');
        if (!watchlist.length) {
          grid.innerHTML = `<div class="col-span-full py-20 text-center text-gray-400 text-sm font-medium">Your watchlist is empty. Bookmark titles to save them here!</div>`;
          return;
        }
        grid.innerHTML = watchlist.map(createCardHTML).join('');
      }

      let searchDebounce = null;
      window.handleSearch = function(e) {
        const query = e.target.value.trim();
        clearTimeout(searchDebounce);
        if (!query) {
          loadAllData();
          return;
        }
        searchDebounce = setTimeout(async () => {
          const data = await fetchTMDB('/search/multi', `&query=${encodeURIComponent(query)}`);
          if (data && data.results) {
            const html = data.results.map(createCardHTML).join('');
            document.getElementById('homeMoviesGrid').className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6';
            document.getElementById('homeMoviesGrid').innerHTML = html;
            document.getElementById('homeTvGrid').innerHTML = '';
          }
        }, 350);
      };

      const movieGenresList = [
        { id: null, name: 'All' },
        { id: 28, name: 'Action' },
        { id: 12, name: 'Adventure' },
        { id: 16, name: 'Animation' },
        { id: 35, name: 'Comedy' },
        { id: 80, name: 'Crime' },
        { id: 18, name: 'Drama' },
        { id: 14, name: 'Fantasy' },
        { id: 27, name: 'Horror' },
        { id: 878, name: 'Sci-Fi' }
      ];

      const tvGenresList = [
        { id: null, name: 'All' },
        { id: 10759, name: 'Action & Adventure' },
        { id: 16, name: 'Animation' },
        { id: 35, name: 'Comedy' },
        { id: 18, name: 'Drama' },
        { id: 10765, name: 'Sci-Fi & Fantasy' }
      ];

      function renderGenrePills() {
        const mContainer = document.getElementById('movieGenres');
        mContainer.innerHTML = movieGenresList.map(g => `
          <button onclick="selectMovieGenre(${g.id})" class="px-4 py-1.5 rounded-full text-xs font-heading font-black border transition-all ${selectedMovieGenre === g.id ? 'bg-accent border-accent text-white shadow-accentGlow' : 'bg-white/5 border-white/10 text-gray-300 hover:bg-white/10'}">
            ${g.name}
          </button>
        `).join('');

        const tContainer = document.getElementById('tvGenres');
        tContainer.innerHTML = tvGenresList.map(g => `
          <button onclick="selectTvGenre(${g.id})" class="px-4 py-1.5 rounded-full text-xs font-heading font-black border transition-all ${selectedTvGenre === g.id ? 'bg-accent border-accent text-white shadow-accentGlow' : 'bg-white/5 border-white/10 text-gray-300 hover:bg-white/10'}">
            ${g.name}
          </button>
        `).join('');
      }

      window.selectMovieGenre = async function(genreId) {
        selectedMovieGenre = genreId;
        renderGenrePills();
        await filterAndRenderMovies();
      };

      window.selectTvGenre = async function(genreId) {
        selectedTvGenre = genreId;
        renderGenrePills();
        await filterAndRenderTv();
      };

      async function filterAndRenderMovies() {
        const sortBy = document.getElementById('movieSort').value;
        let endpoint = '/discover/movie';
        let params = `&sort_by=${sortBy}`;
        if (selectedMovieGenre) params += `&with_genres=${selectedMovieGenre}`;

        const data = await fetchTMDB(endpoint, params);
        if (data && data.results) {
          document.getElementById('moviesGrid').innerHTML = data.results.map(createCardHTML).join('');
        }
      }

      async function filterAndRenderTv() {
        const sortBy = document.getElementById('tvSort').value;
        let endpoint = '/discover/tv';
        let params = `&sort_by=${sortBy}`;
        if (selectedTvGenre) params += `&with_genres=${selectedTvGenre}`;

        const data = await fetchTMDB(endpoint, params);
        if (data && data.results) {
          document.getElementById('tvGrid').innerHTML = data.results.map(createCardHTML).join('');
        }
      }

      async function loadAllData() {
        renderGenrePills();
        const [movies, tvShows, anime, discoverMovies, discoverTv] = await Promise.all([
          fetchTMDB('/trending/movie/week'),
          fetchTMDB('/trending/tv/week'),
          fetchTMDB('/discover/tv', '&with_keywords=210024|287501'),
          fetchTMDB('/discover/movie', '&sort_by=popularity.desc'),
          fetchTMDB('/discover/tv', '&sort_by=popularity.desc')
        ]);

        if (movies && movies.results && movies.results.length) {
          heroItem = movies.results[0];
          document.getElementById('heroBg').style.backgroundImage = `url(${BACKDROP_BASE_URL}${heroItem.backdrop_path || heroItem.poster_path})`;
          document.getElementById('heroTitle').innerText = heroItem.title || heroItem.name;
          document.getElementById('heroOverview').innerText = heroItem.overview;
          document.getElementById('heroPlayBtn').onclick = () => playMedia(encodeURIComponent(JSON.stringify(heroItem)), 0);
          
          const hWBtn = document.getElementById('heroWatchlistText');
          hWBtn.innerText = isItemInWatchlist(heroItem.id) ? '✓ In Watchlist' : '+ Add to Watchlist';

          const moviesHTML = movies.results.map(createCardHTML).join('');
          document.getElementById('homeMoviesGrid').className = 'horizontal-carousel';
          document.getElementById('homeMoviesGrid').innerHTML = moviesHTML;
        }

        if (discoverMovies && discoverMovies.results) {
          document.getElementById('moviesGrid').innerHTML = discoverMovies.results.map(createCardHTML).join('');
        }

        if (tvShows && tvShows.results) {
          const tvHTML = tvShows.results.map(createCardHTML).join('');
          document.getElementById('homeTvGrid').className = 'horizontal-carousel';
          document.getElementById('homeTvGrid').innerHTML = tvHTML;
        }

        if (discoverTv && discoverTv.results) {
          document.getElementById('tvGrid').innerHTML = discoverTv.results.map(createCardHTML).join('');
        }

        if (anime && anime.results) {
          document.getElementById('animeGrid').innerHTML = anime.results.map(createCardHTML).join('');
        }

        updateWatchlistBadge();
      }

      loadAllData();
    </script>
  </body>
</html>
