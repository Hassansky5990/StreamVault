<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StreamVault Pro · Ultimate Edition</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://vidcore.org">
<link rel="preconnect" href="https://player.autoembed.cc">
<link rel="preconnect" href="https://www.2embed.cc">
<link rel="preconnect" href="https://framextv.cc">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050407;
  --surface: #0e0c14;
  --surface-hover: #171421;
  --surface-glass: rgba(14, 12, 20, 0.9);
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(229, 9, 20, 0.5);
  --text-main: #f9f8fc;
  --text-muted: #948d9f;
  --accent: #e50914;
  --accent-glow: rgba(229, 9, 20, 0.3);
  --ambient-color: rgba(229, 9, 20, 0.2);
  --font-display: 'Outfit', -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  background: var(--bg);
  color: var(--text-main);
  font: 400 14px/1.5 var(--font-body);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 90px;
}

button, input, select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1)}

/* HEADER */
header{
  position: fixed;
  inset: 0 0 auto;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 5vw;
  background: linear-gradient(180deg, rgba(5,4,7,0.95) 0%, rgba(5,4,7,0) 100%);
  backdrop-filter: blur(12px);
  transition: all .3s ease;
}
header.solid{
  background: var(--surface-glass);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
}
.logo{
  font: 800 20px/1 var(--font-display);
  color: #fff;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.logo-icon {
  width: 24px;
  height: 24px;
  background: var(--accent);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
  box-shadow: 0 0 16px var(--accent-glow);
}
.logo span{color:var(--accent)}

.search-box{
  position: relative;
  display: flex;
  align-items: center;
}
#q{
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  color: #fff;
  border-radius: 99px;
  padding: 9px 16px 9px 38px;
  width: 180px;
  font-size: 13px;
  transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
}
#q:focus{
  background: var(--surface);
  border-color: var(--border-focus);
  width: 230px;
  outline: none;
  box-shadow: 0 0 0 4px var(--accent-glow);
}
.search-icon{
  position: absolute;
  left: 14px;
  width: 15px;
  height: 15px;
  fill: var(--text-muted);
  pointer-events: none;
}

/* NAVIGATION */
.bottom-nav {
  position: fixed;
  bottom: 0;
  inset-inline: 0;
  height: 68px;
  background: var(--surface-glass);
  backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 45;
  padding-bottom: env(safe-area-inset-bottom);
}
.b-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
}
.b-nav-item svg { width: 21px; height: 21px; fill: currentColor; transition: transform .2s; }
.b-nav-item.active, .b-nav-item:hover { color: #fff; }
.b-nav-item.active svg { fill: var(--accent); transform: scale(1.08); }

/* HERO BANNER */
.hero{
  min-height: 75vh;
  display: flex;
  align-items: flex-end;
  padding: 120px 5vw 6vh;
  background-size: cover;
  background-position: center 20%;
  position: relative;
}
.hero::before{
  content: "";
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(90deg, var(--bg) 0%, rgba(5,4,7,0.5) 50%, transparent 100%),
    linear-gradient(0deg, var(--bg) 0%, rgba(5,4,7,0.2) 60%);
}
.hero-content{position:relative;max-width:600px;z-index:2}
.hero h1{
  font: 800 clamp(28px, 4.5vw, 54px)/1.05 var(--font-display);
  margin-bottom: 12px;
  letter-spacing: -1px;
  color: #fff;
}
.hero p{
  color: #b3adc2;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 22px;
  font-size: 13px;
  line-height: 1.55;
}
.hero-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}

.btn{
  background: var(--accent);
  color: #fff;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  padding: 11px 22px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  box-shadow: 0 6px 24px var(--accent-glow);
}
.btn:hover{
  transform: translateY(-2px);
  filter: brightness(1.15);
}
.btn.alt{
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  border: 1px solid var(--border);
  box-shadow: none;
}
.btn.alt:hover{
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255,255,255,0.25);
}

/* CARDS & TRACKS */
main{position:relative;z-index:3;margin-top:-3vh}
.row{margin:32px 0}
.row h2{
  font: 700 18px var(--font-display);
  letter-spacing: -0.3px;
  padding: 0 5vw 12px;
  color: #fff;
}

.track{
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 6px 5vw 18px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.track::-webkit-scrollbar{display:none}

.card{
  flex: 0 0 auto;
  width: clamp(125px, 12.5vw, 170px);
  aspect-ratio: 2/3;
  border-radius: var(--radius-sm);
  background: var(--surface);
  overflow: hidden;
  position: relative;
  scroll-snap-align: start;
  border: 1px solid var(--border);
  transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
}
.card:hover{
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(255,255,255,0.3);
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8);
}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{
  position: absolute;
  inset: auto 0 0;
  padding: 32px 10px 10px;
  font-size: 11px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(5,4,7,0.96));
  color: #fff;
  opacity: 0;
  transition: opacity .2s ease;
}
.card:hover .t{opacity:1}

.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 16px;
  padding: 100px 5vw 40px;
}
.grid .card{width:auto}
.empty{padding:100px 5vw;color:var(--text-muted);text-align:center;font-size:14px}

/* MODALS */
.layer{
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(16px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}
.layer.open{display:flex}

.panel{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 840px;
  width: 100%;
  max-height: 88vh;
  overflow: auto;
  position: relative;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95);
}
.panel .bd{height:min(40vw, 290px);background-size:cover;background-position:center}
.panel .in{padding:28px}
.panel h2{font: 800 25px var(--font-display); letter-spacing: -0.5px}
.meta{color:var(--text-muted);margin:8px 0 16px;font-size:12px;font-weight:500}
.x{
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(0,0,0,0.65);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font-size: 17px;
  z-index: 10;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.x:hover{background:rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.4)}

/* SUBTITLE MODAL (FIXED OVERLAY LAYER) */
.sub-layer { z-index: 9999; }
.sub-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 520px;
  width: 100%;
  padding: 24px;
  position: relative;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
}
.sub-search-row {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}
.sub-input {
  flex: 1;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: #fff;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
}
.sub-input:focus { border-color: var(--accent); outline: none; }
.sub-select {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: #fff;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
}
.sub-results-list {
  max-height: 220px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}
.sub-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: all 0.2s;
}
.sub-item:hover { background: var(--surface-hover); border-color: var(--accent); }
.sub-item span { font-size: 12px; font-weight: 600; color: #fff; }
.sub-item badge { font-size: 10px; background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 4px; color: var(--text-muted); }

/* PERFECTLY ALIGNED PLAYER & CONTROLS */
.player-wrap{
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 960px;
  max-height: 94vh;
  gap: 12px;
  margin: auto;
}
.player{
  width: 100%;
  aspect-ratio: 16/9;
  max-height: 52vh;
  background: #000;
  border-radius: var(--radius-md);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border);
  box-shadow: 0 0 70px var(--ambient-color), 0 24px 60px rgba(0,0,0,0.95);
  transition: box-shadow 0.8s ease;
}
.player iframe{width:100%;height:100%;border:0;display:block}

.server-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  background: var(--surface);
  padding: 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.server-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.8px;
}
.server-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.server-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}
.server-btn:hover { background: var(--surface-hover); color: #fff; border-color: rgba(255,255,255,0.25); }
.server-btn.active { background: rgba(229, 9, 20, 0.12); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(229,9,20,0.2); }
.server-badge { font-size: 7px; background: var(--accent); color: #fff; padding: 2px 4px; border-radius: 3px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }

/* STRICT 3-COLUMN CONTROLS GRID */
.player-controls-row { 
  display: grid; 
  grid-template-columns: repeat(3, 1fr);
  gap: 8px; 
  align-items: center; 
  width: 100%; 
}
.icon-btn {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(229, 9, 20, 0.08); }
.icon-btn svg{width:13px;height:13px;fill:currentColor; flex-shrink: 0;}

.ep-nav-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  width: 100%;
}

.tp{display:flex;align-items:flex-end;flex:0 0 auto;margin-right:6px}
.rank{
  font: 800 clamp(50px,9vw,85px)/.8 var(--font-display);
  color: transparent;
  -webkit-text-stroke: 2px var(--accent);
  margin-right: -12px;
  z-index: 1;
}
.sub{font:700 16px var(--font-display);padding:0 5vw 12px}

.ep-header-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.ep-search-input {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: #fff;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 12px;
  flex: 1;
  min-width: 140px;
}
.ep-search-input:focus { border-color: var(--accent); outline: none; }

.ep{
  display: flex;
  gap: 14px;
  padding: 12px;
  border-top: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .2s;
}
.ep:hover{background:var(--surface-hover)}
.ep img{width:116px;height:65px;object-fit:cover;border-radius:6px;flex:none}
.ep p{color:var(--text-muted);font-size:11px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep b{font-family:var(--font-display);font-size:12px;color:#fff}

footer{padding:35px 5vw 100px;color:var(--text-muted);font-size:11px;text-align:center;border-top:1px solid var(--border);margin-top:40px}

.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chips span{
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
}

#toast{
  position: fixed;
  bottom: 85px;
  right: 24px;
  background: var(--accent);
  color: #fff;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 12px;
  z-index: 1000;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}

@media(max-width:768px){
  header{padding:14px 4vw;gap:10px}
  .logo{font-size:18px}
  #q{width:130px}
  .hero{min-height:55vh;padding:100px 4vw 4vh}
  .hero h1{font-size:24px}
  .grid{padding-top:120px}
  .player{max-height:36vh}
  .server-grid { grid-template-columns: repeat(2, 1fr); }
  .player-controls-row { grid-template-columns: repeat(1, 1fr); }
  .ep-nav-row { grid-template-columns: repeat(1, 1fr); }
  #toast{left:16px;right:16px;text-align:center}
}
</style>
</head>
<body>
<header id="hd">
  <span class="logo" onclick="switchTab('home')"><div class="logo-icon"></div>Stream<span>Vault</span></span>
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="q" type="search" placeholder="Search titles..." aria-label="Search">
  </div>
</header>

<div id="hero"></div>
<main id="app"></main>

<nav class="bottom-nav">
  <button class="b-nav-item active" data-tab="home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Home
  </button>
  <button class="b-nav-item" data-tab="anime" onclick="switchTab('anime')">
    <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
    Anime
  </button>
  <button class="b-nav-item" data-tab="discover" onclick="switchTab('discover')">
    <svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>
    Discover
  </button>
  <button class="b-nav-item" data-tab="list" onclick="switchTab('list')">
    <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
    Library
  </button>
</nav>

<footer>StreamVault Pro · Subtitle-Guaranteed Engine</footer>

<div class="layer" id="md"><div class="panel" id="mp" tabindex="-1"></div></div>

<!-- SUBTITLE MODAL (FIXED OVERLAY LAYER) -->
<div class="layer sub-layer" id="subModal">
  <div class="sub-panel">
    <button class="x" onclick="$('#subModal').classList.remove('open')">×</button>
    <h3 style="font-family:var(--font-display);font-size:18px;color:#fff;">Search Web Subtitles</h3>
    <p style="color:var(--text-muted);font-size:11px;margin-top:2px;">Find and attach subtitles from global databases instantly.</p>
    
    <div class="sub-search-row">
      <input type="text" id="subQuery" class="sub-input" placeholder="Movie or Show Title...">
      <select id="subLang" class="sub-select">
        <option value="eng">English</option>
        <option value="spa">Spanish</option>
        <option value="fre">French</option>
        <option value="ger">German</option>
        <option value="ara">Arabic</option>
        <option value="hin">Hindi</option>
        <option value="jpn">Japanese</option>
      </select>
      <button class="btn" onclick="fetchOnlineSubtitles()">Search</button>
    </div>

    <div class="sub-results-list" id="subResultsList">
      <p style="color:var(--text-muted);font-size:12px;text-align:center;padding:20px;">Enter title to search subtitles...</p>
    </div>

    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:11px;color:var(--text-muted);">Have a local file?</span>
      <label class="btn alt" style="padding:6px 14px;font-size:11px;cursor:pointer;">
        Upload .SRT / .VTT
        <input type="file" id="subFileInput" accept=".srt,.vtt" style="display:none">
      </label>
    </div>
  </div>
</div>

<!-- PLAYER MODAL -->
<div class="layer" id="pl">
  <button class="x" id="px" aria-label="Close player">×</button>
  <div class="player-wrap">
    <div class="player" id="pv"></div>
    
    <!-- SUBTITLE-GUARANTEED SERVERS BAR -->
    <div class="server-bar" id="serverBarContainer">
      <div class="server-header">
        <span>SUBTITLE-GUARANTEED SERVERS</span>
        <span style="font-size:11px;color:var(--text-muted)">1080p Auto-CC Ready</span>
      </div>
      <div class="server-grid">
        <button class="server-btn active" data-server="vidcore">VidCore <span class="server-badge">4K+CC</span></button>
        <button class="server-btn" data-server="autoembed">AutoEmbed <span class="server-badge">Auto</span></button>
        <button class="server-btn" data-server="2embed">2Embed <span class="server-badge">CC</span></button>
        <button class="server-btn" data-server="framex">FrameX <span class="server-badge">Pro</span></button>
      </div>

      <div class="player-controls-row">
        <button class="icon-btn" onclick="openSubtitleSearch()">
