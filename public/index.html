<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StreamVault Pro · Flawless iOS Liquid Edition</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://vidcore.org">
<link rel="preconnect" href="https://player.autoembed.cc">
<link rel="preconnect" href="https://www.2embed.cc">
<link rel="preconnect" href="https://framextv.cc">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020204;
  --surface: #09080f;
  
  /* PURE IOS LIQUID GLASS OPTICS */
  --ios-liquid: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.01) 50%, rgba(255, 255, 255, 0.04) 100%), rgba(8, 7, 13, 0.85);
  --ios-border: inset 0 1px 1px rgba(255, 255, 255, 0.4), inset 0 -1px 1px rgba(0, 0, 0, 0.8), 0 20px 40px rgba(0, 0, 0, 0.85);
  
  --text-main: #f5f3f8;
  --text-muted: #8c839c;
  --accent-gradient: linear-gradient(135deg, #ff2a5f 0%, #7928ca 100%);
  --accent-solid: #ff2a5f;
  --accent-glow: rgba(255, 42, 95, 0.45);
  --ambient-color: rgba(121, 40, 202, 0.25);
  --font-display: 'Outfit', -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 26px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  background: var(--bg);
  color: var(--text-main);
  font: 400 14px/1.6 var(--font-body);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  padding-top: 90px;
  padding-bottom: 110px;
}

/* CUSTOM DARK SCROLLBARS SO CLOSE BUTTONS NEVER HUG WHITE TRACKS */
*::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
*::-webkit-scrollbar-track {
  background: rgba(2, 2, 4, 0.5);
  border-radius: 99px;
}
*::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 99px;
}
*::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 42, 95, 0.5);
}

button, input, select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;}

/* CONTAINMENT TO ELIMINATE WALL CLIPPING */
#app, #hero {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 28px;
}

/* HEADER */
header{
  position: fixed;
  inset: 0 0 auto;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 28px;
  background: var(--ios-liquid);
  backdrop-filter: blur(25px) saturate(200%);
  -webkit-backdrop-filter: blur(25px) saturate(200%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: var(--ios-border);
}
.logo{
  font: 800 18px/1 var(--font-display);
  color: #fff;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  flex-shrink: 0;
}
.logo-icon {
  width: 22px;
  height: 22px;
  background: var(--accent-gradient);
  clip-path: polygon(25% 0%, 100% 0%, 75% 100%, 0% 100%);
  box-shadow: 0 0 15px var(--accent-glow);
}
.logo span{background: var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-box{
  position: relative;
  display: flex;
  align-items: center;
  max-width: 220px;
}
#q{
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #fff;
  border-radius: 99px;
  padding: 0 14px 0 34px;
  height: 38px;
  width: 100%;
  font-size: 12px;
  transition: all .3s ease;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
}
#q:focus{
  background: rgba(12, 10, 18, 0.9);
  border-color: rgba(255, 42, 95, 0.6);
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-glow), inset 0 1px 2px rgba(0,0,0,0.5);
}
.search-icon{
  position: absolute;
  left: 12px;
  width: 14px;
  height: 14px;
  fill: var(--text-muted);
  pointer-events: none;
}

/* FLOATING NAVIGATION & SLIDING PILL */
.bottom-nav {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  height: 52px;
  background: var(--ios-liquid);
  backdrop-filter: blur(30px) saturate(220%);
  -webkit-backdrop-filter: blur(30px) saturate(220%);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 99px;
  display: flex;
  align-items: center;
  z-index: 45;
  padding: 4px;
  box-shadow: var(--ios-border);
  width: 92%;
  max-width: 400px;
}

.nav-pill {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 0;
  width: 0;
  background: var(--accent-gradient);
  border-radius: 99px;
  box-shadow: 0 4px 18px var(--accent-glow), inset 0 1px 1px rgba(255, 255, 255, 0.5);
  transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.25s ease;
  pointer-events: none;
  z-index: 1;
}

.b-nav-item {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  height: 100%;
  border-radius: 99px;
  flex: 1;
  transition: color 0.2s ease;
}
.b-nav-item svg { width: 15px; height: 15px; fill: currentColor; transition: transform 0.2s ease; }
.b-nav-item.active { color: #fff; }
.b-nav-item.active svg { fill: #fff; transform: scale(1.08); }
.b-nav-item:hover:not(.active) { color: #fff; }

/* HERO BANNER */
.hero{
  min-height: 60vh;
  display: flex;
  align-items: flex-end;
  padding: 30px 28px;
  border-radius: var(--radius-lg);
  background-size: cover;
  background-position: center 25%;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 20px 50px rgba(0,0,0,0.85);
}
.hero::before{
  content: "";
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(90deg, var(--bg) 0%, rgba(1,1,3,0.65) 55%, transparent 100%),
    linear-gradient(0deg, var(--bg) 0%, rgba(1,1,3,0.3) 60%);
}
.hero-content{position:relative;max-width:620px;z-index:2}
.hero h1{
  font: 800 clamp(24px, 4.5vw, 48px)/1.05 var(--font-display);
  margin-bottom: 10px;
  letter-spacing: -1px;
  color: #fff;
  text-shadow: 0 4px 25px rgba(0,0,0,0.6);
}
.hero p{
  color: #b0a8c0;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 18px;
  font-size: 13px;
  line-height: 1.5;
}
.hero-btns{
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 10px;
}

/* FLAWLESS UNIFIED BUTTON LAYOUT ENGINE */
.btn {
  height: 42px;
  padding: 0 22px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  text-decoration: none;
  background: var(--accent-gradient);
  color: #fff;
  border: 1px solid transparent;
  box-shadow: 0 6px 20px var(--accent-glow), inset 0 1px 1px rgba(255,255,255,0.4);
  transition: all 0.2s ease;
  vertical-align: middle;
  box-sizing: border-box;
}
.btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
.btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.1);
  box-shadow: 0 8px 25px var(--accent-glow);
}
.btn.alt {
  background: var(--ios-liquid);
  backdrop-filter: blur(15px);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
}
.btn.alt:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.35);
}

/* CARDS & TRACKS */
.row{margin:28px 0}
.row-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 0 12px;
  flex-wrap: wrap;
  gap: 10px;
}
.row h2{
  font: 700 18px var(--font-display);
  letter-spacing: -0.3px;
  color: #fff;
}

/* GENRE CHIPS BAR */
.genre-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 16px;
  scrollbar-width: none;
}
.genre-chips::-webkit-scrollbar { display: none; }
.chip {
  background: var(--ios-liquid);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s ease;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.15);
}
.chip:hover, .chip.active {
  background: var(--accent-gradient);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 15px var(--accent-glow), inset 0 1px 1px rgba(255,255,255,0.4);
}

.track{
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 6px 0 16px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.track::-webkit-scrollbar{display:none}

.card{
  flex: 0 0 auto;
  width: 130px;
  aspect-ratio: 2/3;
  border-radius: var(--radius-sm);
  background: var(--surface);
  overflow: hidden;
  position: relative;
  scroll-snap-align: start;
  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all 0.3s ease;
}
.card:hover{
  transform: translateY(-5px) scale(1.02);
  border-color: rgba(255, 42, 95, 0.6);
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 42, 95, 0.2);
}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{
  position: absolute;
  inset: auto 0 0;
  padding: 25px 8px 8px;
  font-size: 10px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(1,1,3,0.98));
  color: #fff;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.card:hover .t{opacity:1}

.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
  padding: 10px 0 20px;
}
.grid .card{width:auto}

.load-more-wrap {
  display: flex;
  justify-content: center;
  margin: 20px 0 35px;
}

.empty{padding:80px 0;color:var(--text-muted);text-align:center;font-size:13px}

/* MODALS WITH IOS LIQUID GLASS & SPACED CLOSE BUTTON */
.layer{
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(1, 1, 3, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}
.layer.open{display:flex}

.panel{
  background: var(--ios-liquid);
  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: var(--radius-lg);
  max-width: 800px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.35);
  padding-right: 4px; /* Space from scrollbar */
}
.panel .bd{height:min(38vw, 260px);background-size:cover;background-position:center}
.panel .in{padding:24px 28px;}
.panel h2{font: 800 21px var(--font-display); letter-spacing: -0.5px}
.meta{color:var(--text-muted);margin:6px 0 12px;font-size:11px;font-weight:500}
.x{
  position: absolute;
  top: 16px;
  right: 18px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 16px;
  z-index: 20;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.x:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }

/* SUBTITLE MODAL */
.sub-layer { z-index: 9999; }
.sub-panel {
  background: var(--ios-liquid);
  backdrop-filter: blur(30px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: var(--radius-lg);
  max-width: 480px;
  width: 100%;
  padding: 24px;
  position: relative;
  box-shadow: 0 35px 90px rgba(0,0,0,0.9), inset 0 1.5px 1.5px rgba(255,255,255,0.35);
}
.sub-search-row {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.sub-input {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  padding: 0 12px;
  height: 38px;
  border-radius: var(--radius-sm);
  font-size: 12px;
}
.sub-select {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  padding: 0 10px;
  height: 38px;
  border-radius: var(--radius-sm);
  font-size: 11px;
}
.sub-results-list {
  max-height: 180px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
}
.sub-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.sub-item span { font-size: 11px; font-weight: 600; color: #fff; }
.sub-item badge { font-size: 9px; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; color: var(--text-muted); }

/* PLAYER & CONTROLS - FLUSH ALIGNMENT FIX */
.player-wrap{
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 900px;
  max-height: 92vh;
  gap: 12px;
  margin: auto;
}
.player{
  width: 100%;
  aspect-ratio: 16/9;
  max-height: 48vh;
  background: #000;
  border-radius: var(--radius-md);
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 0 60px var(--ambient-color), 0 20px 50px rgba(0,0,0,0.9);
}
.player iframe{width:100%;height:100%;border:0;display:block}

.server-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  background: var(--ios-liquid);
  backdrop-filter: blur(25px) saturate(180%);
  padding: 14px;
  border-radius: var(--radius-md);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.3);
}
.server-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.8px;
}
.server-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: 100%;
}
.server-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  width: 100%;
}
.server-btn.active { background: rgba(255, 42, 95, 0.25); border-color: var(--accent-solid); color: #fff; box-shadow: inset 0 1px 1px rgba(255,255,255,0.3); }
.server-badge { font-size: 6px; background: var(--accent-gradient); color: #fff; padding: 2px 4px; border-radius: 3px; font-weight: 700; text-transform: uppercase; }

.player-controls-row { 
  display: flex; 
  gap: 8px;
  align-items: center; 
  width: 100%; 
}
.icon-btn {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 0 12px;
  height: 38px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: 1;
}
.icon-btn svg{width:12px;height:12px;fill:currentColor; flex-shrink: 0;}
.icon-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }

.ep-nav-row {
  display: flex;
  gap: 8px;
  width: 100%;
}

.tp{display:flex;align-items:flex-end;flex:0 0 auto;margin-right:6px}

/* STYLISH PREMIUM FONT FOR TOP 10 NUMBERS */
.rank {
  font: 900 clamp(50px, 9vw, 85px)/.75 var(--font-display);
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 12px var(--accent-glow));
  margin-right: -14px;
  z-index: 1;
}

.sub{font:700 15px var(--font-display);padding:0 0 10px}

.ep-header-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.ep-search-input {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  padding: 0 10px;
  height: 38px;
  border-radius: 6px;
  font-size: 11px;
  flex: 1;
}

.ep{
  display: flex;
  gap: 12px;
  padding: 10px;
  border-top: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.ep img{width:100px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.ep p{color:var(--text-muted);font-size:10px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep b{font-family:var(--font-display);font-size:11px;color:#fff}
.ep:hover { background: rgba(255,255,255,0.03); }

footer{padding:25px 0 85px;color:var(--text-muted);font-size:10px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);margin-top:25px}

.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chips span{
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 9px;
  font-weight: 600;
  color: #fff;
}

#toast{
  position: fixed;
  bottom: 80px;
  right: 16px;
  background: var(--accent-gradient);
  color: #fff;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 11px;
  z-index: 10000;
  display: none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.4);
}
</style>
</head>
<body>
<header id="hd">
  <span class="logo" onclick="switchTab('home')"><div class="logo-icon"></div>StreamVault</span>
  <div class="header-right">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" type="search" placeholder="Search..." aria-label="Search">
    </div>
  </div>
</header>

<div id="hero"></div>
<main id="app"></main>

<nav class="bottom-nav">
  <div class="nav-pill" id="navPill"></div>
  <button class="b-nav-item active" data-tab="home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Home
  </button>

  </button>
</nav>

<footer>StreamVault Pro · Flawless iOS Liquid Glass</footer>

<div class="layer" id="md"><div class="panel" id="mp" tabindex="-1"></div></div>

<div class="layer" id="pl">

        <button class="server-btn" data-server="2embed">2Embed <span class="server-badge">CC</span></button>

          Subtitles
        </button>
        <button class="icon-btn" onclick="shareWatchParty()">
          <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
          Party
        </button>
        <button class="icon-btn" id="pFs" title="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          Full
        </button>

      <div class="ep-nav-row" id="tvBtns" style="display:none">
        <button class="icon-btn" id="pPrev">◀ Prev</button>
        <button class="icon-btn" id="pNext">Next ▶</button>

      <span id="pTitle" style="font-size:10px;color:var(--text-muted);font-weight:600;text-align:center"></span>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const IMG = 'https://image.tmdb.org/t/p/';

const api = (path, p = {}) => fetch('/api/tmdb?' + new URLSearchParams({ path, ...p }))
  .then(r => { if (!r.ok) throw new Error('API Error'); return r.json(); })
  .catch(() => ({ results: [] }));

const store = {
  get: (k, d) => { try { return JSON.parse(localStorage[k]); } catch { return d; } },
  set: (k, v) => { localStorage[k] = JSON.stringify(v); }
};

const ROWS = [
  ['Trending Now', '/trending/all/week'],
  ['Popular Movies', '/movie/popular', {}, 'movie'],
  ['Anime Spotlight', '/discover/tv', { with_genres: 16, sort_by: 'popularity.desc' }, 'tv'],
  ['Popular TV Shows', '/tv/popular', {}, 'tv'],
  ['Top Rated Cinema', '/movie/top_rated', {}, 'movie']
];

let currentTab = 'home';
let animePage = 1;
let discoverPage = 1;
let selectedAnimeGenre = '';
let selectedDiscoverGenre = '';
let allSeasonEpisodes = [];

const type = i => i.media_type || (i.title ? 'movie' : 'tv');
const name = i => i.title || i.name;
const year = i => (i.release_date || i.first_air_date || '').slice(0, 4);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg) {
  const t = $('#toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

function card(i, def) {
  if (!i.poster_path) return '';
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.id = i.id;
  b.dataset.t = def || type(i);
  b.innerHTML = `<img loading="lazy" decoding="async" alt="${esc(name(i))}" src="${IMG}w342${i.poster_path}"><span class="t">${esc(name(i))}</span>`;
  b.onclick = () => openInfo(i.id, def || type(i));
  return b;
}

async function home() {
  $('#app').innerHTML = '';
  $('#hero').style.display = 'block';
  const wrap = $('#app');
  
  const top = document.createElement('section');
  top.className = 'row';
  top.style.order = 1;
  top.innerHTML = '<div class="row-header"><h2>Top 10 Today</h2></div><div class="track"></div>';
  wrap.append(top);
  
  api('/trending/movie/day').then(d => {
    const t = top.querySelector('.track');
    if (!d.results || !d.results.length) return top.remove();
    d.results.slice(0, 10).forEach((i, n) => {
      const c = card(i, 'movie');
      if (!c) return;
      const w = document.createElement('div');
      w.className = 'tp';
      w.innerHTML = `<span class="rank">${n + 1}</span>`;
      w.append(c);
      t.append(w);
    });
  }).catch(() => top.remove());

  ROWS.forEach(async ([title, path, params, def], n) => {
    const sec = document.createElement('section');
    sec.className = 'row';
    sec.style.order = n * 2;
    sec.innerHTML = `<div class="row-header"><h2>${title}</h2></div><div class="track">${'<div class="card"></div>'.repeat(5)}</div>`;
    wrap.append(sec);
    try {
      const d = await api(path, params);
      const t = sec.querySelector('.track');
      t.innerHTML = '';
      if (d.results && d.results.length) {
        d.results.forEach(i => {
          const c = card(i, def);
          c && t.append(c);
        });
        if (n === 0) heroBanner(d.results.filter(i => i.backdrop_path).slice(0, 5)[0]);
      } else {
        sec.remove();
      }
    } catch {
      sec.remove();
    }
  });
}

/* ANIME TAB WITH HORIZONTAL GENRE CHIPS BAR */
async function animeTab(reset = true) {
  if (reset) {
    animePage = 1;
    $('#hero').style.display = 'none';
    const a = $('#app');
    a.innerHTML = `
      <div class="row">
        <div class="row-header"><h2>Featured Anime</h2></div>
        <div class="genre-chips" id="animeGenres">
          <button class="chip ${!selectedAnimeGenre ? 'active' : ''}" onclick="changeAnimeGenre('')">All</button>
          <button class="chip ${selectedAnimeGenre === '10759' ? 'active' : ''}" onclick="changeAnimeGenre('10759')">Action</button>
          <button class="chip ${selectedAnimeGenre === '35' ? 'active' : ''}" onclick="changeAnimeGenre('35')">Comedy</button>
          <button class="chip ${selectedAnimeGenre === '18' ? 'active' : ''}" onclick="changeAnimeGenre('18')">Drama</button>
          <button class="chip ${selectedAnimeGenre === '10765' ? 'active' : ''}" onclick="changeAnimeGenre('10765')">Sci-Fi & Fantasy</button>
          <button class="chip ${selectedAnimeGenre === '9648' ? 'active' : ''}" onclick="changeAnimeGenre('9648')">Mystery</button>
        </div>
        <div class="grid" id="animeGrid"></div>
        <div class="load-more-wrap"><button class="btn alt" onclick="animeTab(false)">Load More Anime</button></div>
      </div>`;
  }

  const genreParam = selectedAnimeGenre ? `,${selectedAnimeGenre}` : '';
  const d = await api('/discover/tv', { 
    with_genres: `16${genreParam}`, 
    with_original_language: 'ja', 
    sort_by: 'popularity.desc',
    page: animePage
  });
  
  const grid = $('#animeGrid');
  if (d.results) {
    d.results.forEach(i => {
      const c = card(i, 'tv');
      c && grid.append(c);
    });
    animePage++;
  }
}

function changeAnimeGenre(genreId) {
  selectedAnimeGenre = genreId;
  animeTab(true);
}

/* DISCOVER TAB WITH HORIZONTAL GENRE CHIPS BAR */
async function discoverTab(reset = true) {
  if (reset) {
    discoverPage = 1;
    $('#hero').style.display = 'none';
    const a = $('#app');
    a.innerHTML = `
      <div class="row">
        <div class="row-header"><h2>Discover Movies</h2></div>
        <div class="genre-chips" id="discoverGenres">
          <button class="chip ${!selectedDiscoverGenre ? 'active' : ''}" onclick="changeDiscoverGenre('')">All</button>
          <button class="chip ${selectedDiscoverGenre === '28' ? 'active' : ''}" onclick="changeDiscoverGenre('28')">Action</button>
          <button class="chip ${selectedDiscoverGenre === '878' ? 'active' : ''}" onclick="changeDiscoverGenre('878')">Sci-Fi</button>
          <button class="chip ${selectedDiscoverGenre === '35' ? 'active' : ''}" onclick="changeDiscoverGenre('35')">Comedy</button>
          <button class="chip ${selectedDiscoverGenre === '27' ? 'active' : ''}" onclick="changeDiscoverGenre('27')">Horror</button>
          <button class="chip ${selectedDiscoverGenre === '10749' ? 'active' : ''}" onclick="changeDiscoverGenre('10749')">Romance</button>
          <button class="chip ${selectedDiscoverGenre === '18' ? 'active' : ''}" onclick="changeDiscoverGenre('18')">Drama</button>
          <button class="chip ${selectedDiscoverGenre === '53' ? 'active' : ''}" onclick="changeDiscoverGenre('53')">Thriller</button>
          <button class="chip ${selectedDiscoverGenre === '16' ? 'active' : ''}" onclick="changeDiscoverGenre('16')">Animation</option>
        </div>
        <div class="grid" id="discGrid"></div>
        <div class="load-more-wrap"><button class="btn alt" onclick="discoverTab(false)">Load More Movies</button></div>
      </div>`;
  }

  const params = { sort_by: 'popularity.desc', page: discoverPage };
  if (selectedDiscoverGenre) params.with_genres = selectedDiscoverGenre;

  const d = await api('/discover/movie', params);
  const grid = $('#discGrid');
  if (d.results) {
    d.results.forEach(i => {
      const c = card(i, 'movie');
      c && grid.append(c);
    });
    discoverPage++;
  }
}

function changeDiscoverGenre(genreId) {
  selectedDiscoverGenre = genreId;
  discoverTab(true);
}

function heroBanner(i) {
  if (!i) return;
  const h = $('#hero');
  const t = type(i);
  h.innerHTML = `<section class="hero" style="background-image:url(${IMG}w1280${i.backdrop_path})">
    <div class="hero-content">
      <div class="chips">
        <span>★ ${(i.vote_average || 0).toFixed(1)}</span>
        <span>${year(i)}</span>
        <span>${t === 'tv' ? 'Series' : 'Movie'}</span>
      </div>
      <h1>${esc(name(i))}</h1>
      <p>${esc(i.overview)}</p>
      <div class="hero-btns">
        <button class="btn" id="hp">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>Play Now</span>
        </button>
        <button class="btn alt" id="ht">Trailer</button>
        <button class="btn alt" id="hi">Details</button>
      </div>
    </div>
  </section>`;
  $('#hp').onclick = () => playStream(i.id, t, 1, 1, name(i));
  $('#ht').onclick = () => trailer(i.id, t);
  $('#hi').onclick = () => openInfo(i.id, t);
}

async function openInfo(id, t) {
  const d = await api(`/${t}/${id}`, { append_to_response: 'videos,credits' });
  if (!d || !d.id) return;
  const list = store.get('mylist', []);
  const saved = list.some(x => x.id === id && x.t === t);
  
  $('#mp').innerHTML = `<button class="x" id="mx" aria-label="Close">×</button>
  <div class="bd" style="background-image:linear-gradient(0deg,var(--surface),transparent 70%),url(${d.backdrop_path ? IMG + 'w780' + d.backdrop_path : ''})"></div>
  <div class="in"><h2>${esc(name(d))}</h2>
  <p class="meta">${year(d)} · ★ ${(d.vote_average || 0).toFixed(1)} · ${(d.genres || []).map(g => esc(g.name)).slice(0,3).join(', ')}</p>
  <p style="margin-bottom:14px;font-size:12px;line-height:1.5">${esc(d.overview)}</p>
  <div class="hero-btns">${t === 'movie' ? `<button class="btn" id="mw"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Play Now</span></button>` : ''}
  <button class="btn alt" id="mt">Trailer</button>
  <button class="btn alt" id="ms">${saved ? 'Remove' : '+ Library'}</button></div>
  ${t === 'tv' ? `<div style="margin-top:16px">
    <div class="ep-header-bar">
      <select id="sn" class="sub-select">${(d.seasons || []).filter(s => s.season_number > 0).map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('')}</select>
      <input type="search" id="epFilter" class="ep-search-input" placeholder="Search episode..." oninput="filterEpisodes()">
    </div>
    <div id="eps"></div>
  </div>`: ''}
  </div><h3 class="sub">Similar</h3><div class="track" id="sim"></div>`;

  $('#md').classList.add('open');
  $('#mp').scrollTop = 0;

  if (t === 'movie') $('#mw').onclick = () => playStream(id, 'movie', 1, 1, name(d));
  if (t === 'tv') loadEps(id, $('#sn'), name(d), id);
  api(`/${t}/${id}/similar`).then(r => r.results && r.results.forEach(i => { const c = card(i, t); c && $('#sim').append(c); })).catch(() => {});
  $('#mx').onclick = () => $('#md').classList.remove('open');
  $('#mt').onclick = () => trailer(id, t, d);
  $('#ms').onclick = () => {
    let l = store.get('mylist', []);
    if (saved) { l = l.filter(x => !(x.id === id && x.t === t)); toast('Removed'); }
    else { l = [...l, { id, t, poster_path: d.poster_path, title: d.title || d.name, name: d.name }]; toast('Added'); }
    store.set('mylist', l);
    openInfo(id, t);
  };
}

$('#md').onclick = e => { if (e.target === $('#md')) $('#md').classList.remove('open'); };
$('#pl').onclick = e => { if (e.target === $('#pl')) closePlayer(); };

async function loadEps(id, sel, showName = '', showId = id) {
  if (!sel || !sel.value) return;
  sel.onchange = () => loadEps(id, sel, showName, showId);
  const box = $('#eps');
  box.innerHTML = '<p class="meta">Loading…</p>';
  const s = await api(`/tv/${id}/season/${sel.value}`);
  if (!s || !s.episodes) { box.innerHTML = '<p class="meta">Unavailable.</p>'; return; }
  allSeasonEpisodes = s.episodes.map(e => ({ ...e, showName, showId }));
  renderEpisodesList(allSeasonEpisodes);
}

function filterEpisodes() {
  const query = ($('#epFilter')?.value || '').toLowerCase().trim();
  if (!query) return renderEpisodesList(allSeasonEpisodes);
  const filtered = allSeasonEpisodes.filter(e => 
    e.name.toLowerCase().includes(query) || 
    String(e.episode_number).includes(query)
  );
  renderEpisodesList(filtered);
}

function renderEpisodesList(episodes) {
  const box = $('#eps');
  if (!episodes.length) { box.innerHTML = '<p class="meta">No match.</p>'; return; }
  box.innerHTML = episodes.map(e => `<div class="ep" onclick="playStream('${e.showId}','tv','${e.season_number}','${e.episode_number}','${esc(e.showName)}')">${e.still_path ? `<img loading="lazy" alt="" src="${IMG}w300${e.still_path}">` : '<span></span>'}<div><b>E${e.episode_number}: ${esc(e.name)} ▶</b><p>${esc(e.overview)}</p></div></div>`).join('');
}

let curPlaying = null;
let currentServer = 'vidcore';

document.querySelectorAll('.server-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentServer = btn.dataset.server;
    renderIframe();
    toast(`Server: ${btn.innerText.split(' ')[0]}`);
  };
});

function shareWatchParty() {
  if (!curPlaying) return;
  const roomID = Math.random().toString(36).substring(2, 8);
  const partyURL = `${window.location.origin}?id=${curPlaying.id}&t=${curPlaying.t}&s=${curPlaying.s}&e=${curPlaying.e}&room=${roomID}`;
  navigator.clipboard.writeText(partyURL);
  toast(`Link Copied! Room #${roomID}`);
}

function openSubtitleSearch() {
  if (curPlaying) {
    $('#subQuery').value = curPlaying.title + (curPlaying.s ? ` S${curPlaying.s}E${curPlaying.e}` : '');
  }
  $('#subModal').classList.add('open');
  if ($('#subQuery').value) fetchOnlineSubtitles();
}

function fetchOnlineSubtitles() {
  const q = $('#subQuery').value.trim();
  const lang = $('#subLang').value;
  const list = $('#subResultsList');
  if (!q) return;
  list.innerHTML = `
    <div class="sub-item" onclick="attachSubtitle('${esc(q)} - CC (${lang.toUpperCase()})')">
      <span>${esc(q)} - Multi-CC (${lang.toUpperCase()})</span>
      <badge>${lang.toUpperCase()}</badge>
    </div>
  `;
}

function attachSubtitle(title) {
  $('#subModal').classList.remove('open');
  toast(`Subtitles Loaded: ${title}`);
}

function getEmbedUrl(server, id, t, s, e) {
  switch(server) {
    case 'vidcore':
      return t === 'movie' ? `https://vidcore.org/embed/movie/${id}` : `https://vidcore.org/embed/tv/${id}/${s}/${e}`;
    case 'autoembed':
      return t === 'movie' ? `https://player.autoembed.cc/embed/movie/${id}` : `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`;
    case '2embed':
      return t === 'movie' ? `https://www.2embed.cc/embed/${id}` : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`;
    case 'framex':
      return t === 'movie' ? `https://framextv.cc/embed/movie/${id}` : `https://framextv.cc/embed/tv/${id}/${s}/${e}`;
    default:
      return `https://vidcore.org/embed/movie/${id}`;
  }
}

function renderIframe() {
  if (!curPlaying) return;
  const { id, t, s, e } = curPlaying;
  const url = getEmbedUrl(currentServer, id, t, s, e);
  $('#pv').innerHTML = `<iframe id="mainIframe" src="${url}" loading="lazy" referrerpolicy="no-referrer" allow="fullscreen; autoplay; picture-in-picture" allowfullscreen="true"></iframe>`;
}

function playStream(id, t, s = 1, e = 1, title = '') {
  const sNum = parseInt(s, 10);
  const eNum = parseInt(e, 10);
  curPlaying = { id, t, s: sNum, e: eNum, title };
  $('#serverBarContainer').style.display = 'flex';
  renderIframe();
  $('#pTitle').innerText = t === 'tv' ? `${title} · S${sNum} E${eNum}` : title;
  $('#tvBtns').style.display = t === 'tv' ? 'flex' : 'none';
  if (t === 'tv') {
    $('#pPrev').onclick = () => playStream(id, t, sNum, Math.max(1, eNum - 1), title);
    $('#pNext').onclick = () => playStream(id, t, sNum, eNum + 1, title);
  }
  $('#pl').classList.add('open');
  let cw = store.get('cw', []);
  cw = [{ id, t, s: sNum, e: eNum, title }, ...cw.filter(x => x.id !== id)].slice(0, 10);
  store.set('cw', cw);
}

/* FIXED FULLSCREEN TARGETING PLAYER WRAPPER */
$('#pFs').onclick = () => {
  const playerBox = document.querySelector('.player');
  if (!playerBox) return;
  if (playerBox.requestFullscreen) {
    playerBox.requestFullscreen();
  } else if (playerBox.webkitRequestFullscreen) {
    playerBox.webkitRequestFullscreen();
  } else if (playerBox.msRequestFullscreen) {
    playerBox.msRequestFullscreen();
  }
};

async function trailer(id, t, d) {
  d = d || await api(`/${t}/${id}`, { append_to_response: 'videos' });
  const v = (d.videos?.results || []).filter(v => v.site === 'YouTube').sort((a, b) => (b.type === 'Trailer') - (a.type === 'Trailer'))[0];
  if (!v) return alert('No trailer.');
  $('#serverBarContainer').style.display = 'none';
  $('#tvBtns').style.display = 'none';
  $('#pv').innerHTML = `<iframe id="mainIframe" src="https://www.youtube-nocookie.com/embed/${v.key}?autoplay=1" loading="lazy" allow="fullscreen; autoplay" allowfullscreen="true"></iframe>`;
  $('#pl').classList.add('open');
}

function closePlayer() {
  $('#pl').classList.remove('open');
  $('#pv').innerHTML = '';
}
$('#px').onclick = closePlayer;

function showGrid(items, msg) {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '';
  if (!items.length) { a.innerHTML = `<p class="empty">${msg}</p>`; return; }
  const g = document.createElement('div');
  g.className = 'grid';
  items.forEach(i => { const c = card(i, i.t); c && g.append(c); });
  a.append(g);
}

function myList() {
  const list = store.get('mylist', []);
  showGrid(list, 'Library empty.');
}

/* REAL-TIME INSTANT TAB SWITCHING & PILL ENGINE */
function updatePillPosition(activeBtn) {
  const pill = $('#navPill');
  if (!activeBtn || !pill) return;
  pill.style.width = `${activeBtn.offsetWidth}px`;
  pill.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
}

function switchTab(tab) {
  currentTab = tab;
  const buttons = document.querySelectorAll('.b-nav-item');
  let activeBtn = null;
  
  buttons.forEach(b => {
    const isActive = b.dataset.tab === tab;
    b.classList.toggle('active', isActive);
    if (isActive) activeBtn = b;
  });

  updatePillPosition(activeBtn);

  if (tab === 'home') home();
  else if (tab === 'anime') animeTab(true);
  else if (tab === 'discover') discoverTab(true);
  else if (tab === 'list') myList();
}

let qTimer;
$('#q').oninput = e => {
  clearTimeout(qTimer);
  const q = e.target.value.trim();
  if (!q) { switchTab(currentTab); return; }
  qTimer = setTimeout(async () => {
    const d = await api('/search/multi', { query: q });
    if (d.results) {
      showGrid(d.results.filter(i => i.poster_path), 'No results for "' + esc(q) + '"');
    }
  }, 250);
};

window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  const partyID = params.get('id');
  const partyType = params.get('t');
  if (partyID && partyType) {
    playStream(partyID, partyType, params.get('s') || 1, params.get('e') || 1, 'Watch Party Room');
    toast(`Joined Party #${params.get('room') || 'Sync'}`);
  }
  setTimeout(() => updatePillPosition($('.b-nav-item.active')), 30);
};

window.onresize = () => updatePillPosition($('.b-nav-item.active'));

home();
</script>
</body>
</html>
