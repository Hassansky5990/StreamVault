<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StreamVault - Ultimate Player</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a10;
  --surf:#16121f;
  --surf-light:#221c2f;
  --line:#2e2640;
  --text:#f4f1fa;
  --mute:#9e94b0;
  --acc:#f5c342;
  --acc-glow:rgba(245, 195, 66, 0.2);
  --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --display:'Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 700px at 90% -10%,#3b1f6b33,transparent),var(--bg);color:var(--text);font:400 15px/1.6 var(--sans);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

header{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 4vw;background:linear-gradient(var(--bg),transparent);transition:all .3s;flex-wrap:wrap}
header.solid{background:#0c0a15f2;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{font:800 20px var(--display);color:var(--acc);cursor:pointer;letter-spacing:-0.5px;white-space:nowrap}
#q{background:var(--surf);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:7px 14px;flex:1;min-width:140px;font-size:13px;transition:all .2s}
#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
nav{display:flex;gap:14px;width:100%;overflow-x:auto;scrollbar-width:none;padding-top:4px;border-top:1px solid rgba(255,255,255,0.05)}
nav::-webkit-scrollbar{display:none}
nav button{color:var(--mute);padding:4px 0;font-weight:500;font-size:13px;white-space:nowrap}
nav button.on,nav button:hover{color:var(--text)}

.hero{min-height:65vh;display:flex;align-items:flex-end;padding:100px 4vw 4vh;background-size:cover;background-position:center top;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 10%,transparent 70%),linear-gradient(0deg,var(--bg) 5%,transparent 50%)}
.hero>div{position:relative;max-width:580px;z-index:2;width:100%}
.hero h1{font:800 clamp(26px,6vw,52px)/1.1 var(--display);margin-bottom:10px;letter-spacing:-0.5px}
.hero p{color:#d4cce6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px;font-size:13px}
.hero-btns{display:flex;gap:8px;flex-wrap:nowrap;width:100%;overflow-x:auto}
.btn{background:var(--acc);color:#120d00;font-weight:700;padding:8px 16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:13px;white-space:nowrap;flex:1;text-align:center}
.btn.alt{background:rgba(255,255,255,0.08);color:var(--text);border:1px solid rgba(255,255,255,0.12)}

main{padding-bottom:80px;position:relative;z-index:3}
.row{margin:24px 0}
.row h2{font:700 17px var(--display);padding:0 4vw 8px}
.track{display:flex;gap:10px;overflow-x:auto;padding:4px 4vw 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:clamp(110px,28vw,170px);aspect-ratio:2/3;border-radius:10px;background:var(--surf);overflow:hidden;position:relative;scroll-snap-align:start;border:1px solid var(--line)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{position:absolute;inset:auto 0 0;padding:20px 6px 6px;font-size:11px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,0.9));opacity:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:120px 4vw 0}
.grid .card{width:auto}
.empty{padding:100px 4vw;color:var(--mute);text-align:center;font-size:14px}

.layer{position:fixed;inset:0;z-index:50;background:rgba(6,4,10,0.95);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:10px;overflow-y:auto}
.layer.open{display:flex}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;max-width:850px;width:100%;max-height:92vh;overflow:auto;position:relative}
.panel .bd{height:min(45vw,280px);background-size:cover;background-position:center}
.panel .in{padding:16px 18px 24px}
.panel h2{font:800 22px var(--display)}
.meta{color:var(--mute);margin:4px 0 12px;font-size:12px}
.x{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.1);border-radius:50%;width:32px;height:32px;font-size:16px;z-index:5;color:var(--text);display:flex;align-items:center;justify-content:center}

.player-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:980px;gap:6px;margin:auto}
.player{width:100%;aspect-ratio:16/9;max-height:48vh;background:#000;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line)}
.player video,.player iframe{width:100%;height:100%;border:0;display:block}

.player-bar{display:flex;flex-direction:column;gap:6px;width:100%;background:var(--surf);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.player-row{display:flex;gap:6px;width:100%;align-items:center}
.icon-btn, select{background:var(--surf-light);border:1px solid var(--line);padding:6px 8px;border-radius:6px;font-size:11px;font-weight:500;color:var(--text);flex:1;text-align:center;justify-content:center;display:inline-flex;align-items:center;gap:4px;max-width:100%}
.icon-btn svg{width:13px;height:13px;fill:currentColor}

.tp{display:flex;align-items:flex-end;flex:0 0 auto;margin-right:4px}
.rank{font:800 clamp(50px,9vw,80px)/.8 var(--display);color:transparent;-webkit-text-stroke:2px var(--acc);margin-right:-10px;z-index:1}
.sub{font:700 15px var(--display);padding:0 4vw 6px}

.ep-controls{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.ep{display:flex;gap:10px;padding:8px;border-top:1px solid var(--line);border-radius:6px;cursor:pointer}
.ep img{width:95px;height:54px;object-fit:cover;border-radius:4px;flex:none}
.ep p{color:var(--mute);font-size:11px;margin-top:2px}
.ep b{font-family:var(--display);font-size:12px}

footer{padding:24px 4vw;color:var(--mute);font-size:11px;text-align:center;border-top:1px solid var(--line);margin-top:20px}

.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:99px;padding:2px 8px;font-size:10px;font-weight:600}
.row h2::before{content:"";display:inline-block;width:3px;height:12px;background:var(--acc);border-radius:2px;margin-right:6px;vertical-align:0px}

#toast{position:fixed;bottom:16px;right:16px;left:16px;max-width:280px;margin:auto;background:var(--acc);color:#120d00;padding:8px 14px;border-radius:6px;font-weight:700;z-index:100;display:none;box-shadow:0 8px 30px rgba(0,0,0,0.6);text-align:center;font-size:12px}
</style>
</head>
<body>
<header id="hd">
  <span class="logo" onclick="navTo('home')">StreamVault</span>
  <input id="q" type="search" placeholder="Search movies, shows..." aria-label="Search">
  <nav>
    <button class="on" data-v="home">Home</button>
    <button data-v="browse">Browse</button>
    <button data-v="free">Free</button>
    <button data-v="list">My List</button>
  </nav>
</header>

<div id="hero"></div>
<main id="app"></main>

<footer>StreamVault v7.0 · Multi-Mirror Streamer.</footer>

<div class="layer" id="md"><div class="panel" id="mp" tabindex="-1"></div></div>

<!-- Player Modal -->
<div class="layer" id="pl">
  <button class="x" id="px" aria-label="Close player">×</button>
  <div class="player-wrap">
    <div class="player" id="pv"></div>
    <div class="player-bar" id="pbar">
      <div class="player-row">
        <select id="srcSelect" style="border-color:var(--acc);font-weight:600">
          <option value="vidsrcme">Server 1 (VidSrc ME - Main)</option>
          <option value="vidsrcpro">Server 2 (VidSrc Pro)</option>
          <option value="vidsrccc">Server 3 (VidSrc CC)</option>
          <option value="autoembed">Server 4 (AutoEmbed)</option>
          <option value="2embed">Server 5 (2Embed)</option>
          <option value="smashy">Server 6 (SmashyStream)</option>
        </select>
        <button class="icon-btn" id="nextServerBtn" style="flex:0 0 auto">🔄 Next</button>
      </div>

      <div class="player-row">
        <label class="icon-btn" style="cursor:pointer;">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Subs
          <input type="file" id="subFileInput" accept=".srt,.vtt">
        </label>
        
        <button class="icon-btn" id="autoNextToggle" style="border-color:var(--acc);">
          ⚡ Auto-Next: <span id="autoNextStatus">ON</span>
        </button>

        <button class="icon-btn" id="pFs" style="flex:0 0 auto" title="Toggle Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>

      <span id="pTitle" style="font-size:11px;color:var(--mute);font-weight:600;text-align:center;margin-top:2px"></span>

      <div class="player-row" id="tvBtns" style="display:none;margin-top:2px">
        <button class="icon-btn" id="pPrev">◀ Prev</button>
        <button class="icon-btn" id="pNext">Next ▶</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const IMG = 'https://image.tmdb.org/t/p/';
const api = (path, p = {}) => fetch('/api/tmdb?' + new URLSearchParams({ path, ...p })).then(r => { if (!r.ok) throw 0; return r.json(); });
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage[k]); } catch { return d; } },
  set: (k, v) => { localStorage[k] = JSON.stringify(v); }
};

const ROWS = [
  ['Trending this week', '/trending/all/week'],
  ['Popular movies', '/movie/popular', {}, 'movie'],
  ['Anime series', '/discover/tv', { with_genres: 16, with_original_language: 'ja', sort_by: 'popularity.desc' }, 'tv'],
  ['Popular TV shows', '/tv/popular', {}, 'tv'],
  ['Top rated movies', '/movie/top_rated', {}, 'movie'],
  ['Top rated TV', '/tv/top_rated', {}, 'tv']
];

const type = i => i.media_type || (i.title ? 'movie' : 'tv');
const name = i => i.title || i.name;
const year = i => (i.release_date || i.first_air_date || '').slice(0, 4);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg) {
  const t = $('#toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function card(i, def) {
  if (!i.poster_path) return '';
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.id = i.id;
  b.dataset.t = def || type(i);
  b.innerHTML = `<img loading="lazy" decoding="async" alt="${esc(name(i))}" src="${IMG}w342${i.poster_path}"><span class="t">${esc(name(i))}</span>`;
  b.onclick = () => openInfo(i.id, def || type(i));
  return b;
}

async function home() {
  $('#app').innerHTML = '';
  $('#hero').style.display = '';
  const wrap = $('#app');
  const top = document.createElement('section');
  top.className = 'row';
  top.style.order = 1;
  top.innerHTML = '<h2>Top 10 movies today</h2><div class="track"></div>';
  wrap.append(top);
  
  api('/trending/movie/day').then(d => {
    const t = top.querySelector('.track');
    d.results.slice(0, 10).forEach((i, n) => {
      const c = card(i, 'movie');
      if (!c) return;
      const w = document.createElement('div');
      w.className = 'tp';
      w.innerHTML = `<span class="rank">${n + 1}</span>`;
      w.append(c);
      t.append(w);
    });
  }).catch(() => top.remove());

  ROWS.forEach(async ([title, path, params, def], n) => {
    const sec = document.createElement('section');
    sec.className = 'row';
    sec.style.order = n * 2;
    sec.innerHTML = `<h2>${title}</h2><div class="track">${'<div class="card"></div>'.repeat(5)}</div>`;
    wrap.append(sec);
    try {
      const d = await api(path, params);
      const t = sec.querySelector('.track');
      t.innerHTML = '';
      d.results.forEach(i => {
        const c = card(i, def);
        c && t.append(c);
      });
      if (!t.children.length) return sec.remove();
      if (n === 0) heroes(d.results.filter(i => i.backdrop_path).slice(0, 5));
    } catch {
      sec.remove();
    }
  });
}

let hTimer;
function heroes(list) {
  let n = 0;
  const show = () => hero(list[n++ % list.length]);
  show();
  clearInterval(hTimer);
  hTimer = setInterval(() => {
    if ($('#hero').style.display !== 'none' && !$('.layer.open')) show();
  }, 9000);
}

function hero(i) {
  if (!i) return;
  const h = $('#hero');
  const t = type(i);
  h.innerHTML = `<section class="hero" style="background-image:url(${IMG}w780${i.backdrop_path})"><div><div class="chips"><span>★ ${(i.vote_average || 0).toFixed(1)}</span><span>${year(i)}</span><span>${t === 'tv' ? 'Series' : 'Movie'}</span></div><h1>${esc(name(i))}</h1><p>${esc(i.overview)}</p>
  <div class="hero-btns"><button class="btn" id="hp">Watch Now</button><button class="btn alt" id="ht">Trailer</button><button class="btn alt" id="hi">Overview</button></div></div></section>`;
  $('#hp').onclick = () => playStream(i.id, t, 1, 1, name(i));
  $('#ht').onclick = () => trailer(i.id, t);
  $('#hi').onclick = () => openInfo(i.id, t);
}

async function openInfo(id, t) {
  const d = await api(`/${t}/${id}`, { append_to_response: 'videos,credits' }).catch(() => null);
  if (!d) return;
  const list = store.get('mylist', []);
  const saved = list.some(x => x.id === id && x.t === t);
  
  $('#mp').innerHTML = `<button class="x" id="mx" aria-label="Close">×</button>
  <div class="bd" style="background-image:linear-gradient(0deg,var(--surf),transparent 60%),url(${d.backdrop_path ? IMG + 'w780' + d.backdrop_path : ''})"></div>
  <div class="in"><h2>${esc(name(d))}</h2>
  <p class="meta">${year(d)} · ★ ${(d.vote_average || 0).toFixed(1)} · ${(d.genres || []).map(g => esc(g.name)).slice(0,2).join(', ')}</p>
  <p style="margin-bottom:12px;font-size:12px">${esc(d.overview)}</p>
  <div class="hero-btns">${t === 'movie' ? `<button class="btn" id="mw">Watch Now</button>` : ''}
  <button class="btn alt" id="mt">Trailer</button>
  <button class="btn alt" id="ms">${saved ? 'Remove' : '+ List'}</button></div>
  ${t === 'tv' ? `<div style="margin-top:14px">
    <div class="ep-controls">
      <select id="sn">${(d.seasons || []).filter(s => s.season_number > 0).map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('')}</select>
      <input type="text" id="epSearch" placeholder="🔍 Search..." style="flex:1">
    </div>
    <div id="eps"></div>
  </div>`: ''}
  </div><h3 class="sub">More like this</h3><div class="track" id="sim"></div>`;

  $('#md').classList.add('open');
  $('#mp').scrollTop = 0;

  if (t === 'movie') {
    $('#mw').onclick = () => playStream(id, 'movie', 1, 1, name(d));
  }
  if (t === 'tv') {
    loadEps(id, $('#sn'), name(d));
  }
  api(`/${t}/${id}/similar`).then(r => r.results.forEach(i => { const c = card(i, t); c && $('#sim').append(c); })).catch(() => {});
  $('#mx').onclick = () => $('#md').classList.remove('open');
  $('#mt').onclick = () => trailer(id, t, d);
  $('#ms').onclick = () => {
    let l = store.get('mylist', []);
    if (saved) { l = l.filter(x => !(x.id === id && x.t === t)); toast('Removed'); }
    else { l = [...l, { id, t, poster_path: d.poster_path, title: d.title || d.name, name: d.name }]; toast('Saved'); }
    store.set('mylist', l);
    openInfo(id, t);
  };
}

$('#md').onclick = e => { if (e.target === $('#md')) $('#md').classList.remove('open'); };
$('#pl').onclick = e => { if (e.target === $('#pl')) closePlayer(); };

async function loadEps(id, sel, showName = '') {
  if (!sel || !sel.value) return;
  sel.onchange = () => loadEps(id, sel, showName);
  const box = $('#eps');
  box.innerHTML = '<p class="meta">Loading…</p>';
  const s = await api(`/tv/${id}/season/${sel.value}`).catch(() => null);
  if (!s || !s.episodes) { box.innerHTML = '<p class="meta">Episodes unavailable.</p>'; return; }
  box.innerHTML = s.episodes.map(e => `<div class="ep" onclick="playStream('${id}','tv','${sel.value}','${e.episode_number}','${esc(showName)}')">${e.still_path ? `<img loading="lazy" alt="" src="${IMG}w300${e.still_path}">` : '<span></span>'}<div><b>${e.episode_number}. ${esc(e.name)} ▶</b><p>${esc(e.overview)}</p></div></div>`).join('');
}

let curPlaying = null;
let autoNextEnabled = true;

$('#autoNextToggle').onclick = () => {
  autoNextEnabled = !autoNextEnabled;
  $('#autoNextStatus').innerText = autoNextEnabled ? 'ON' : 'OFF';
};

// DIRECT WORKING EMBED URL MAPPER
function getEmbedUrl(provider, id, t, s, e) {
  switch(provider) {
    case 'vidsrcme': 
      return t === 'movie' ? `https://vidsrc.me/embed/movie?tmdb=${id}` : `https://vidsrc.me/embed/tv?tmdb=${id}&season=${s}&episode=${e}`;
    case 'vidsrcpro': 
      return t === 'movie' ? `https://vidsrc.pro/embed/movie/${id}` : `https://vidsrc.pro/embed/tv/${id}/${s}/${e}`;
    case 'vidsrccc': 
      return t === 'movie' ? `https://vidsrc.cc/v2/embed/movie/${id}` : `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`;
    case 'autoembed': 
      return t === 'movie' ? `https://player.autoembed.cc/embed/movie/${id}` : `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`;
    case '2embed': 
      return t === 'movie' ? `https://www.2embed.cc/embed/${id}` : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`;
    case 'smashy': 
      return t === 'movie' ? `https://embed.smashystream.com/playere.php?tmdb=${id}` : `https://embed.smashystream.com/playere.php?tmdb=${id}&s=${s}&e=${e}`;
    default: 
      return `https://vidsrc.me/embed/movie?tmdb=${id}`;
  }
}

function renderIframe() {
  if (!curPlaying) return;
  const { id, t, s, e } = curPlaying;
  const provider = $('#srcSelect').value;
  const url = getEmbedUrl(provider, id, t, s, e);
  
  /* Render clean iframe without referrer restrictions */
  $('#pv').innerHTML = `<iframe id="mainIframe" src="${url}" referrerpolicy="no-referrer" allow="fullscreen; autoplay; picture-in-picture; encrypted-media; gyroscope; accelerometer" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>`;
}

$('#nextServerBtn').onclick = () => {
  const sel = $('#srcSelect');
  sel.selectedIndex = (sel.selectedIndex + 1) % sel.options.length;
  toast(`Switched: ${sel.options[sel.selectedIndex].text}`);
  renderIframe();
};

function playStream(id, t, s = 1, e = 1, title = '') {
  const sNum = parseInt(s, 10);
  const eNum = parseInt(e, 10);
  curPlaying = { id, t, s: sNum, e: eNum, title };
  renderIframe();
  $('#pTitle').innerText = t === 'tv' ? `${title} - S${sNum} E${eNum}` : title;
  $('#tvBtns').style.display = t === 'tv' ? 'flex' : 'none';
  if (t === 'tv') {
    $('#pPrev').onclick = () => playStream(id, t, sNum, Math.max(1, eNum - 1), title);
    $('#pNext').onclick = () => playStream(id, t, sNum, eNum + 1, title);
  }
  $('#pl').classList.add('open');
}

$('#srcSelect').onchange = renderIframe;

$('#pFs').onclick = () => {
  const iframe = $('#mainIframe');
  if (!iframe) return;
  if (iframe.requestFullscreen) iframe.requestFullscreen();
};

async function trailer(id, t, d) {
  d = d || await api(`/${t}/${id}`, { append_to_response: 'videos' });
  const v = (d.videos?.results || []).filter(v => v.site === 'YouTube').sort((a, b) => (b.type === 'Trailer') - (a.type === 'Trailer'))[0];
  if (!v) return alert('No trailer available.');
  $('#tvBtns').style.display = 'none';
  $('#pv').innerHTML = `<iframe id="mainIframe" src="https://www.youtube-nocookie.com/embed/${v.key}?autoplay=1" allow="fullscreen; autoplay" allowfullscreen="true"></iframe>`;
  $('#pl').classList.add('open');
}

function closePlayer() {
  $('#pl').classList.remove('open');
  $('#pv').innerHTML = '';
}
$('#px').onclick = closePlayer;

function showGrid(items, msg) {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '';
  if (!items.length) { a.innerHTML = `<p class="empty">${msg}</p>`; return; }
  const g = document.createElement('div');
  g.className = 'grid';
  items.forEach(i => { const c = card(i, i.t); c && g.append(c); });
  a.append(g);
}

function navTo(v) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'home') home();
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => navTo(b.dataset.v));

let qTimer;
$('#q').oninput = e => {
  clearTimeout(qTimer);
  const q = e.target.value.trim();
  if (!q) { navTo('home'); return; }
  qTimer = setTimeout(async () => {
    const d = await api('/search/multi', { query: q }).catch(() => ({ results: [] }));
    showGrid(d.results.filter(i => i.poster_path), 'No results for "' + esc(q) + '"');
  }, 300);
};

home();
</script>
</body>
</html>
