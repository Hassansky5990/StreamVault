  <!-- JavaScript Application Logic -->
  <script>
    const TMDB_API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
    const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
    const TMDB_IMG_BASE = 'https://image.tmdb.org/t/p/w500';
    const TMDB_ORIGINAL_IMG = 'https://image.tmdb.org/t/p/original';

    let currentTab = 'home';
    let watchlist = JSON.parse(localStorage.getItem('streamvault_watchlist') || '[]');
    let currentModalItem = null;
    let currentTrailerKey = null;
    let currentPlayerMode = 'main'; // 'main' (vidnest), 'alt' (framex), 'third' (vidrift), 'trailer'
    let currentSeasonEpisodes = [];
    let activeSeasonNumber = 1;
    let activeEpisodeNumber = 1;
    let playerLoadTimeout = null;

    // Initialize application on load
    window.onload = function () {
      switchTab('home');
    };

    function switchTab(tab) {
      currentTab = tab;
      
      // Update active nav styling
      const tabs = ['home', 'movies', 'tv', 'anime', 'watchlist'];
      tabs.forEach(t => {
        const desktopBtn = document.getElementById(`nav-${t}`);
        const mobileBtn = document.getElementById(`mob-nav-${t}`);
        if (desktopBtn) {
          if (t === tab) {
            desktopBtn.className = "px-3 py-1.5 rounded-lg text-white bg-white/10 transition-all font-heading font-bold";
          } else {
            desktopBtn.className = "px-3 py-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-all font-heading";
          }
        }
        if (mobileBtn) {
          if (t === tab) {
            mobileBtn.className = "flex flex-col items-center gap-1 text-accent transition-all";
          } else {
            mobileBtn.className = "flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-all";
          }
        }
      });

      const heroSection = document.getElementById('heroSection');
      if (tab === 'watchlist') {
        if (heroSection) heroSection.style.display = 'none';
        renderWatchlistPage();
      } else {
        if (heroSection) heroSection.style.display = 'block';
        fetchCatalogData(tab);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleMobileSearch() {
      const container = document.getElementById('mobileSearchContainer');
      if (container) {
        container.classList.toggle('hidden');
        if (!container.classList.contains('hidden')) {
          document.getElementById('mobileSearchInput').focus();
        }
      }
    }

    async function fetchCatalogData(tab) {
      const container = document.getElementById('contentContainer');
      container.innerHTML = `
        <div class="flex items-center justify-center py-20">
          <div class="w-8 h-8 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
        </div>
      `;

      try {
        if (tab === 'home') {
          // Fetch Trending, Popular Movies, Top Rated TV, and Anime
          const [trendingRes, moviesRes, tvRes, animeRes] = await Promise.all([
            fetch(`${TMDB_BASE_URL}/trending/all/day?api_key=${TMDB_API_KEY}`),
            fetch(`${TMDB_BASE_URL}/movie/popular?api_key=${TMDB_API_KEY}`),
            fetch(`${TMDB_BASE_URL}/tv/top_rated?api_key=${TMDB_API_KEY}`),
            fetch(`${TMDB_BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&with_genres=16&with_original_language=ja`)
          ]);

          const trendingData = await trendingRes.json();
          const moviesData = await moviesRes.json();
          const tvData = await tvRes.json();
          const animeData = await animeRes.json();

          // Set Hero Banner using first trending item
          if (trendingData.results && trendingData.results.length > 0) {
            setupHeroBanner(trendingData.results[0]);
          }

          container.innerHTML = '';
          container.appendChild(createMediaRow("Trending Today", trendingData.results));
          container.appendChild(createMediaRow("Popular Movies", moviesData.results));
          container.appendChild(createMediaRow("Top Rated TV Shows", tvData.results));
          container.appendChild(createMediaRow("Featured Anime", animeData.results));

        } else if (tab === 'movies') {
          const [popRes, topRes, upRes] = await Promise.all([
            fetch(`${TMDB_BASE_URL}/movie/popular?api_key=${TMDB_API_KEY}`),
            fetch(`${TMDB_BASE_URL}/movie/top_rated?api_key=${TMDB_API_KEY}`),
            fetch(`${TMDB_BASE_URL}/movie/upcoming?api_key=${TMDB_API_KEY}`)
          ]);
          const pop = await popRes.json();
          const top = await topRes.json();
          const up = await upRes.json();

          if (pop.results && pop.results.length > 0) setupHeroBanner(pop.results[0]);

          container.innerHTML = '';
          container.appendChild(createMediaRow("Popular Movies", pop.results));
          container.appendChild(createMediaRow("Top Rated Movies", top.results));
          container.appendChild(createMediaRow("Upcoming Releases", up.results));

        } else if (tab === 'tv') {
          const [popRes, topRes, airRes] = await Promise.all([
            fetch(`${TMDB_BASE_URL}/tv/popular?api_key=${TMDB_API_KEY}`),
            fetch(`${TMDB_BASE_URL}/tv/top_rated?api_key=${TMDB_API_KEY}`),
            fetch(`${TMDB_BASE_URL}/tv/on_the_air?api_key=${TMDB_API_KEY}`)
          ]);
          const pop = await popRes.json();
          const top = await topRes.json();
          const air = await airRes.json();

          if (pop.results && pop.results.length > 0) setupHeroBanner(pop.results[0]);

          container.innerHTML = '';
          container.appendChild(createMediaRow("Popular TV Series", pop.results));
          container.appendChild(createMediaRow("Acclaimed TV Masterpieces", top.results));
          container.appendChild(createMediaRow("Currently Airing", air.results));

        } else if (tab === 'anime') {
          const [animeRes, animeMovieRes, actionAnimeRes] = await Promise.all([
            fetch(`${TMDB_BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&with_genres=16&with_original_language=ja`),
            fetch(`${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&with_genres=16&with_original_language=ja`),
            fetch(`${TMDB_BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&with_genres=16,10759&with_original_language=ja`)
          ]);
          const anime = await animeRes.json();
          const animeMovie = await animeMovieRes.json();
          const actionAnime = await actionAnimeRes.json();

          if (anime.results && anime.results.length > 0) setupHeroBanner(anime.results[0]);

          container.innerHTML = '';
          container.appendChild(createMediaRow("Popular Anime Series", anime.results));
          container.appendChild(createMediaRow("Anime Movies", animeMovie.results));
          container.appendChild(createMediaRow("Action & Adventure Anime", actionAnime.results));
        }
      } catch (err) {
        console.error("Error fetching catalog data:", err);
        container.innerHTML = `<div class="text-center py-12 text-gray-400 text-xs">Failed to load content. Please check your network connection.</div>`;
      }
    }

    function setupHeroBanner(item) {
      const title = item.title || item.name || 'Untitled';
      const overview = item.overview || 'No description available.';
      const backdrop = item.backdrop_path ? `${TMDB_ORIGINAL_IMG}${item.backdrop_path}` : '';
      const rating = item.vote_average ? item.vote_average.toFixed(1) : '8.0';
      const year = (item.release_date || item.first_air_date || '2026').substring(0, 4);

      document.getElementById('heroTitle').innerText = title;
      document.getElementById('heroOverview').innerText = overview;
      document.getElementById('heroRating').innerHTML = `<i class="fa-solid fa-star text-[10px]"></i> ${rating}`;
      document.getElementById('heroYear').innerText = year;
      if (backdrop) {
        document.getElementById('heroBg').style.backgroundImage = `url('${backdrop}')`;
      }

      const playBtn = document.getElementById('heroPlayBtn');
      const infoBtn = document.getElementById('heroInfoBtn');
      
      const newPlayBtn = playBtn.cloneNode(true);
      const newInfoBtn = infoBtn.cloneNode(true);
      playBtn.parentNode.replaceChild(newPlayBtn, playBtn);
      infoBtn.parentNode.replaceChild(newInfoBtn, infoBtn);

      newPlayBtn.onclick = () => openModal(item);
      newInfoBtn.onclick = () => openModal(item);
    }

    function createMediaRow(title, items) {
      const section = document.createElement('div');
      section.className = "space-y-3";
      
      const header = document.createElement('div');
      header.className = "flex items-center justify-between";
      header.innerHTML = `
        <h3 class="text-base md:text-lg font-heading font-extrabold text-white tracking-tight">${title}</h3>
      `;
      section.appendChild(header);

      const scrollContainer = document.createElement('div');
      scrollContainer.className = "flex items-center gap-4 overflow-x-auto no-scrollbar pb-2 pt-1 genre-scroll-container";

      if (!items || items.length === 0) {
        scrollContainer.innerHTML = `<p class="text-xs text-gray-500 py-4">No items available.</p>`;
      } else {
        items.forEach(item => {
          if (!item.poster_path) return;
          const card = document.createElement('div');
          card.className = "min-w-[130px] md:min-w-[160px] max-w-[130px] md:max-w-[160px] group cursor-pointer space-y-2 shrink-0";
          
          const mediaType = item.media_type || (item.first_air_date ? 'tv' : 'movie');
          const itemTitle = item.title || item.name || 'Untitled';
          const rating = item.vote_average ? item.vote_average.toFixed(1) : '7.5';
          const year = (item.release_date || item.first_air_date || '').substring(0, 4);

          card.innerHTML = `
            <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-white/5 border border-white/10 shadow-md group-hover:border-accent/60 transition-all duration-300">
              <img src="${TMDB_IMG_BASE}${item.poster_path}" alt="${itemTitle}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
              <div class="absolute inset-0 bg-gradient-to-t from-dark/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-2.5">
                <span class="w-full py-1.5 rounded-lg bg-accent text-white font-heading font-bold text-[10px] text-center shadow">Watch Now</span>
              </div>
              <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded text-[10px] font-heading font-bold text-yellow-400 border border-white/10 flex items-center gap-1">
                <i class="fa-solid fa-star text-[9px]"></i> ${rating}
              </div>
            </div>
            <div>
              <h4 class="text-xs font-heading font-bold text-white truncate group-hover:text-accent transition-colors">${itemTitle}</h4>
              <p class="text-[10px] font-heading text-gray-400">${year} • <uppercase>${mediaType}</uppercase></p>
            </div>
          `;
          card.onclick = () => openModal(item);
          scrollContainer.appendChild(card);
        });
      }

      section.appendChild(scrollContainer);
      return section;
    }

    async function handleGlobalSearch(e) {
      const query = e.target.value.trim();
      const container = document.getElementById('contentContainer');
      const heroSection = document.getElementById('heroSection');

      if (!query) {
        if (heroSection) heroSection.style.display = currentTab === 'watchlist' ? 'none' : 'block';
        if (currentTab === 'watchlist') renderWatchlistPage();
        else fetchCatalogData(currentTab);
        return;
      }

      if (heroSection) heroSection.style.display = 'none';
      container.innerHTML = `
        <div class="flex items-center justify-center py-20">
          <div class="w-8 h-8 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
        </div>
      `;

      try {
        const res = await fetch(`${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        const results = (data.results || []).filter(item => item.poster_path && (item.media_type === 'movie' || item.media_type === 'tv'));

        container.innerHTML = '';
        const section = document.createElement('div');
        section.className = "space-y-4";
        section.innerHTML = `<h3 class="text-lg font-heading font-extrabold text-white">Search Results for "${query}" (${results.length})</h3>`;
        
        if (results.length === 0) {
          section.innerHTML += `<p class="text-xs text-gray-400">No matching titles found.</p>`;
        } else {
          const grid = document.createElement('div');
          grid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4";
          
          results.forEach(item => {
            const card = document.createElement('div');
            card.className = "group cursor-pointer space-y-2";
            const mediaType = item.media_type || (item.first_air_date ? 'tv' : 'movie');
            const itemTitle = item.title || item.name || 'Untitled';
            const rating = item.vote_average ? item.vote_average.toFixed(1) : '7.5';
            const year = (item.release_date || item.first_air_date || '').substring(0, 4);

            card.innerHTML = `
              <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-white/5 border border-white/10 shadow-md group-hover:border-accent/60 transition-all duration-300">
                <img src="${TMDB_IMG_BASE}${item.poster_path}" alt="${itemTitle}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded text-[10px] font-heading font-bold text-yellow-400 border border-white/10 flex items-center gap-1">
                  <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                </div>
              </div>
              <div>
                <h4 class="text-xs font-heading font-bold text-white truncate group-hover:text-accent transition-colors">${itemTitle}</h4>
                <p class="text-[10px] font-heading text-gray-400">${year} • ${mediaType.toUpperCase()}</p>
              </div>
            `;
            card.onclick = () => openModal(item);
            grid.appendChild(card);
          });
          section.appendChild(grid);
        }
        container.appendChild(section);
      } catch (err) {
        console.error("Search error:", err);
      }
    }

    function renderWatchlistPage() {
      const container = document.getElementById('contentContainer');
      container.innerHTML = '';

      const section = document.createElement('div');
      section.className = "space-y-4";
      section.innerHTML = `
        <div class="flex items-center justify-between">
          <h2 class="text-xl md:text-2xl font-heading font-extrabold text-white">My Watchlist (${watchlist.length})</h2>
        </div>
      `;

      if (watchlist.length === 0) {
        section.innerHTML += `
          <div class="flex flex-col items-center justify-center py-24 text-center bg-white/5 rounded-2xl border border-white/10 p-6">
            <i class="fa-solid fa-bookmark text-accent text-3xl mb-3"></i>
            <h3 class="text-sm font-heading font-bold text-white mb-1">Your Watchlist is Empty</h3>
            <p class="text-xs text-gray-400 max-w-sm">Save your favorite movies and shows to access them instantly here.</p>
          </div>
        `;
      } else {
        const grid = document.createElement('div');
        grid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4";
        
        watchlist.forEach(item => {
          const card = document.createElement('div');
          card.className = "group cursor-pointer space-y-2";
          const mediaType = item.media_type || (item.first_air_date ? 'tv' : 'movie');
          const itemTitle = item.title || item.name || 'Untitled';
          const rating = item.vote_average ? item.vote_average.toFixed(1) : '7.5';
          const year = (item.release_date || item.first_air_date || '').substring(0, 4);

          card.innerHTML = `
            <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-white/5 border border-white/10 shadow-md group-hover:border-accent/60 transition-all duration-300">
              <img src="${TMDB_IMG_BASE}${item.poster_path}" alt="${itemTitle}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
              <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded text-[10px] font-heading font-bold text-yellow-400 border border-white/10 flex items-center gap-1">
                <i class="fa-solid fa-star text-[9px]"></i> ${rating}
              </div>
            </div>
            <div>
              <h4 class="text-xs font-heading font-bold text-white truncate group-hover:text-accent transition-colors">${itemTitle}</h4>
              <p class="text-[10px] font-heading text-gray-400">${year} • ${mediaType.toUpperCase()}</p>
            </div>
          `;
          card.onclick = () => openModal(item);
          grid.appendChild(card);
        });
        section.appendChild(grid);
      }
      container.appendChild(section);
    }

    async function openModal(item) {
      currentModalItem = item;
      currentPlayerMode = 'main';
      const dropdown = document.getElementById('serverSelectDropdown');
      if (dropdown) dropdown.value = 'main';

      const modal = document.getElementById('mediaModal');
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      const type = item.media_type || (item.first_air_date ? 'tv' : 'movie');
      const title = item.title || item.name || 'Untitled';
      const overview = item.overview || 'No overview available.';
      const rating = item.vote_average ? item.vote_average.toFixed(1) : '7.5';
      const year = (item.release_date || item.first_air_date || '2026').substring(0, 4);

      document.getElementById('modalMediaType').innerText = type.toUpperCase();
      document.getElementById('modalRating').innerText = rating;
      document.getElementById('modalYear').innerText = year;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalOverview').innerText = overview;
      document.getElementById('modalLang').innerText = (item.original_language || 'en').toUpperCase();
      document.getElementById('modalPopularity').innerText = item.popularity ? item.popularity.toFixed(0) : '100';
      document.getElementById('modalIdDisplay').innerText = item.id;
      document.getElementById('modalStatus').innerText = item.status || 'Released';

      updateWatchlistModalButton();

      // Fetch additional details (genres, trailer, seasons)
      try {
        const detailRes = await fetch(`${TMDB_BASE_URL}/${type}/${item.id}?api_key=${TMDB_API_KEY}&append_to_response=videos,seasons`);
        const detailData = await detailRes.json();

        if (detailData.genres) {
          document.getElementById('modalGenres').innerText = detailData.genres.map(g => g.name).join(', ');
        }

        // Find Trailer key
        const videos = detailData.videos?.results || [];
        const trailer = videos.find(v => v.type === 'Trailer' && v.site === 'YouTube') || videos.find(v => v.site === 'YouTube');
        currentTrailerKey = trailer ? trailer.key : null;

        const tvEpisodesSection = document.getElementById('tvEpisodesSection');
        if (type === 'tv') {
          tvEpisodesSection.classList.remove('hidden');
          const seasons = (detailData.seasons || []).filter(s => s.season_number >= 0);
          const seasonDropdown = document.getElementById('seasonDropdown');
          seasonDropdown.innerHTML = '';

          seasons.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.season_number;
            opt.textContent = `${s.name} (${s.episode_count} Eps)`;
            seasonDropdown.appendChild(opt);
          });

          if (seasons.length > 0) {
            activeSeasonNumber = seasons[0].season_number;
            seasonDropdown.value = activeSeasonNumber;
            await loadEpisodesForSeason(item.id, activeSeasonNumber);
          }
        } else {
          tvEpisodesSection.classList.add('hidden');
        }

        loadPlayer(item, type, activeSeasonNumber, activeEpisodeNumber);
      } catch (err) {
        console.error("Error loading details:", err);
        loadPlayer(item, type, 1, 1);
      }
    }

    async function loadEpisodesForSeason(tvId, seasonNum) {
      activeSeasonNumber = seasonNum;
      const episodesGrid = document.getElementById('episodesGrid');
      episodesGrid.innerHTML = `<div class="col-span-full text-center py-6 text-xs text-gray-400">Loading episodes...</div>`;

      try {
        const res = await fetch(`${TMDB_BASE_URL}/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        
        const today = new Date();
        currentSeasonEpisodes = (data.episodes || []).filter(ep => {
          if (!ep.air_date) return true;
          return new Date(ep.air_date) <= today;
        });

        renderEpisodesList(currentSeasonEpisodes);

        if (currentSeasonEpisodes.length > 0) {
          activeEpisodeNumber = currentSeasonEpisodes[0].episode_number;
        }
      } catch (err) {
        console.error("Error loading season episodes:", err);
        episodesGrid.innerHTML = `<div class="col-span-full text-center py-6 text-xs text-red-400">Failed to load episodes.</div>`;
      }
    }

    function renderEpisodesList(episodes) {
      const episodesGrid = document.getElementById('episodesGrid');
      episodesGrid.innerHTML = '';

      if (episodes.length === 0) {
        episodesGrid.innerHTML = `<div class="col-span-full text-center py-6 text-xs text-gray-400">No released episodes found for this season.</div>`;
        return;
      }

      episodes.forEach(ep => {
        const card = document.createElement('div');
        const isSelected = ep.episode_number === activeEpisodeNumber;
        card.className = `p-3 rounded-xl border transition-all cursor-pointer flex flex-col gap-2 ${isSelected ? 'bg-accent/20 border-accent' : 'bg-white/5 border-white/10 hover:border-white/30'}`;
        
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-heading font-bold text-white">E${ep.episode_number}. ${ep.name}</span>
            <span class="text-[10px] font-heading text-gray-400">${ep.runtime ? ep.runtime + 'm' : ''}</span>
          </div>
          <p class="text-[11px] text-gray-300 line-clamp-2">${ep.overview || 'No episode description available.'}</p>
        `;

        card.onclick = () => {
          activeEpisodeNumber = ep.episode_number;
          renderEpisodesList(currentSeasonEpisodes);
          loadPlayer(currentModalItem, 'tv', activeSeasonNumber, activeEpisodeNumber);
        };

        episodesGrid.appendChild(card);
      });
    }

    function filterEpisodesList(e) {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        renderEpisodesList(currentSeasonEpisodes);
        return;
      }
      const filtered = currentSeasonEpisodes.filter(ep => 
        ep.name.toLowerCase().includes(query) || ep.episode_number.toString().includes(query)
      );
      renderEpisodesList(filtered);
    }

    function onSeasonChanged(seasonNum) {
      if (currentModalItem) {
        loadEpisodesForSeason(currentModalItem.id, parseInt(seasonNum));
      }
    }

    function setPlayerMode(mode) {
      currentPlayerMode = mode;
      if (currentModalItem) {
        const type = currentModalItem.media_type || (currentModalItem.first_air_date ? 'tv' : 'movie');
        loadPlayer(currentModalItem, type, activeSeasonNumber, activeEpisodeNumber);
      }
    }

    function loadPlayer(item, type, seasonNum, episodeNum) {
      const playerContainer = document.getElementById('modalPlayerContainer');
      const tmdbId = item.id;
      const s = seasonNum || 1;
      const e = episodeNum || 1;
      
      if (playerLoadTimeout) clearTimeout(playerLoadTimeout);

      playerContainer.innerHTML = `
        <div class="absolute inset-0 flex flex-col items-center justify-center bg-black/90 z-25 transition-opacity duration-300" id="playerLoader">
          <div class="w-8 h-8 border-2 border-accent border-t-transparent rounded-full animate-spin mb-2"></div>
          <p class="text-[11px] text-gray-300 font-heading">Connecting to Stream Server (${currentPlayerMode.toUpperCase()})...</p>
        </div>
      `;
      
      let embedUrl = '';
      if (currentPlayerMode === 'trailer') {
        if (currentTrailerKey) {
          embedUrl = `https://www.youtube.com/embed/${currentTrailerKey}?autoplay=1`;
        } else {
          playerContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center text-gray-400 text-xs p-4 text-center h-full">
              <i class="fa-solid fa-triangle-exclamation text-accent text-2xl mb-2"></i>
              <span>No official trailer preview found. Please select Server 1 or Server 2.</span>
            </div>
          `;
          return;
        }
      } else if (currentPlayerMode === 'alt') {
        // FrameX Provider
        if (type === 'movie') {
          embedUrl = `https://framextv.xyz/embed/${tmdbId}?autoplay=1&muted=0`;
        } else {
          embedUrl = `https://framextv.xyz/embed/${tmdbId}/${s}/${e}?autoplay=1&muted=0`;
        }
      } else if (currentPlayerMode === 'third') {
        // VidRift Provider
        if (type === 'movie') {
          embedUrl = `https://embed.su/embed/movie/${tmdbId}`;
        } else {
          embedUrl = `https://embed.su/embed/tv/${tmdbId}/${s}/${e}`;
        }
      } else {
        // VidNest Provider (Server 1)
        if (type === 'movie') {
          embedUrl = `https://vidnest.fun/movie/${tmdbId}`;
        } else {
          embedUrl = `https://vidnest.fun/tv/${tmdbId}/${s}/${e}`;
        }
      }

      setTimeout(() => {
        playerContainer.innerHTML += `
          <iframe id="activePlayerIframe" src="${embedUrl}" class="w-full h-full border-0 absolute inset-0 opacity-0 transition-opacity duration-500" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="origin" onload="onPlayerIframeLoaded()"></iframe>
        `;
      }, 100);

      playerLoadTimeout = setTimeout(() => {
        const loader = document.getElementById('playerLoader');
        if (loader) {
          loader.innerHTML = `
            <i class="fa-solid fa-circle-exclamation text-yellow-400 text-2xl mb-2"></i>
            <p class="text-xs text-white font-heading font-bold mb-1">Server taking too long to respond</p>
            <p class="text-[10px] text-gray-400 mb-3 text-center px-4">Try switching to Server 2 or Server 3 in the dropdown above.</p>
          `;
        }
      }, 7000);
    }

    function onPlayerIframeLoaded() {
      if (playerLoadTimeout) clearTimeout(playerLoadTimeout);
      const loader = document.getElementById('playerLoader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
      const iframe = document.getElementById('activePlayerIframe');
      if (iframe) {
        iframe.classList.remove('opacity-0');
      }
    }

    function closeModal() {
      const modal = document.getElementById('mediaModal');
      modal.classList.add('hidden');
      document.body.style.overflow = 'auto';
      const playerContainer = document.getElementById('modalPlayerContainer');
      if (playerContainer) playerContainer.innerHTML = '';
      currentModalItem = null;
    }

    function toggleWatchlistFromModal() {
      if (!currentModalItem) return;
      const index = watchlist.findIndex(i => i.id === currentModalItem.id);
      if (index > -1) {
        watchlist.splice(index, 1);
      } else {
        watchlist.push(currentModalItem);
      }
      localStorage.setItem('streamvault_watchlist', JSON.stringify(watchlist));
      updateWatchlistModalButton();
      if (currentTab === 'watchlist') {
        renderWatchlistPage();
      }
    }

    function updateWatchlistModalButton() {
      if (!currentModalItem) return;
      const exists = watchlist.some(i => i.id === currentModalItem.id);
      const btn = document.getElementById('modalWatchlistBtn');
      const text = document.getElementById('modalWatchlistText');
      
      if (exists) {
        btn.className = "flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-accent text-white font-heading font-bold text-xs shadow-md transition-all";
        text.innerText = "In Watchlist";
      } else {
        btn.className = "flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white font-heading font-bold text-xs border border-white/15 transition-all";
        text.innerText = "Add to Watchlist";
      }
    }
  </script>
</body>
</html>
