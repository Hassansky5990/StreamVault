<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StreamVault</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07060a;
  --surface: #110e17;
  --surface-hover: #1b1725;
  --border: rgba(255, 255, 255, 0.08);
  --text-main: #f8f6fc;
  --text-muted: #8e879f;
  --accent: #ffcc00;
  --accent-glow: rgba(255, 204, 0, 0.2);
  --font-display: 'Outfit', -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  background: var(--bg);
  color: var(--text-main);
  font: 400 14px/1.5 var(--font-body);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:all 0.2s ease}

/* HEADER & NAVBAR */
header{
  position: fixed;
  inset: 0 0 auto;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 5vw;
  background: linear-gradient(180deg, rgba(7,6,10,0.9) 0%, rgba(7,6,10,0) 100%);
  backdrop-filter: blur(8px);
  transition: all .3s ease;
}
header.solid{
  background: rgba(11, 9, 16, 0.88);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.logo{
  font: 800 22px/1 var(--font-display);
  color: #fff;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.logo span{color:var(--accent)}

nav{display:flex;gap:20px;align-items:center}
nav button{
  color: var(--text-muted);
  font-weight: 600;
  font-size: 13px;
  padding: 6px 0;
  position: relative;
}
nav button.on, nav button:hover{color: #fff}
nav button.on::after{
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--accent);
  border-radius: 2px;
}

.search-box{
  position: relative;
  display: flex;
  align-items: center;
}
#q{
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: #fff;
  border-radius: 99px;
  padding: 8px 16px 8px 36px;
  width: 200px;
  font-size: 13px;
  font-family: var(--font-body);
  transition: all .25s ease;
}
#q:focus{
  background: var(--surface);
  border-color: var(--accent);
  width: 240px;
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-icon{
  position: absolute;
  left: 12px;
  width: 14px;
  height: 14px;
  fill: var(--text-muted);
  pointer-events: none;
}

/* HERO CINEMATIC BANNER */
.hero{
  min-height: 80vh;
  display: flex;
  align-items: flex-end;
  padding: 120px 5vw 8vh;
  background-size: cover;
  background-position: center 20%;
  position: relative;
}
.hero::before{
  content: "";
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(90deg, var(--bg) 0%, rgba(7,6,10,0.7) 50%, transparent 100%),
    linear-gradient(0deg, var(--bg) 0%, transparent 60%);
}
.hero-content{position:relative;max-width:580px;z-index:2}
.hero h1{
  font: 800 clamp(32px, 5vw, 58px)/1.05 var(--font-display);
  margin-bottom: 12px;
  letter-spacing: -1px;
  color: #fff;
}
.hero p{
  color: #b8b2c6;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 24px;
  font-size: 14px;
  line-height: 1.6;
}
.hero-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.btn{
  background: var(--accent);
  color: #000;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  padding: 11px 22px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  box-shadow: 0 4px 20px var(--accent-glow);
}
.btn:hover{
  transform: translateY(-2px);
  filter: brightness(1.1);
}
.btn.alt{
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  border: 1px solid var(--border);
  box-shadow: none;
}
.btn.alt:hover{
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255,255,255,0.2);
}

/* CARDS & ROWS */
main{padding-bottom:100px;position:relative;z-index:3;margin-top:-4vh}
.row{margin:32px 0}
.row h2{
  font: 700 18px var(--font-display);
  letter-spacing: -0.3px;
  padding: 0 5vw 14px;
  color: #fff;
}

.track{
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 4px 5vw 20px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.track::-webkit-scrollbar{display:none}

.card{
  flex: 0 0 auto;
  width: clamp(130px, 13vw, 180px);
  aspect-ratio: 2/3;
  border-radius: var(--radius-md);
  background: var(--surface);
  overflow: hidden;
  position: relative;
  scroll-snap-align: start;
  border: 1px solid var(--border);
  transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
}
.card:hover{
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(255,255,255,0.3);
  box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{
  position: absolute;
  inset: auto 0 0;
  padding: 32px 10px 10px;
  font-size: 12px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(7,6,10,0.95));
  color: #fff;
  opacity: 0;
  transition: opacity .2s ease;
}
.card:hover .t{opacity:1}

.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 16px;
  padding: 120px 5vw 0;
}
.grid .card{width:auto}
.empty{padding:120px 5vw;color:var(--text-muted);text-align:center;font-size:15px}

/* MODALS */
.layer{
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}
.layer.open{display:flex}

.panel{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 860px;
  width: 100%;
  max-height: 88vh;
  overflow: auto;
  position: relative;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
}
.panel .bd{height:min(42vw, 320px);background-size:cover;background-position:center}
.panel .in{padding:28px 32px 36px}
.panel h2{font: 800 28px var(--font-display); letter-spacing: -0.5px}
.meta{color:var(--text-muted);margin:8px 0 16px;font-size:13px;font-weight:500}
.x{
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  font-size: 18px;
  z-index: 5;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.x:hover{background:rgba(255,255,255,0.2)}

/* PLAYER CONTAINERS */
.player-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:980px;max-height:94vh;gap:10px;margin:auto}
.player{
  width: 100%;
  aspect-ratio: 16/9;
  max-height: 58vh;
  background: #000;
  border-radius: var(--radius-md);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border);
  box-shadow: 0 20px 50px rgba(0,0,0,0.9);
}
.player iframe{width:100%;height:100%;border:0;display:block}

.player-bar{
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  background: var(--surface);
  padding: 12px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
}
.player-row{display:flex;gap:10px;width:100%;align-items:center;flex-wrap:wrap}

.icon-btn, select{
  background: var(--surface-hover);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-family: var(--font-body);
  font-weight: 600;
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.icon-btn:hover, select:focus{
  border-color: var(--accent);
  color: var(--accent);
}
.icon-btn svg{width:14px;height:14px;fill:currentColor}
select{flex:1;outline:none}
input[type="file"]{display:none}

.tp{display:flex;align-items:flex-end;flex:0 0 auto;margin-right:6px}
.rank{
  font: 800 clamp(60px,10vw,96px)/.8 var(--font-display);
  color: transparent;
  -webkit-text-stroke: 2px var(--accent);
  margin-right: -14px;
  z-index: 1;
}
.sub{font:700 16px var(--font-display);padding:0 5vw 10px}

.ep-controls{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.ep{
  display: flex;
  gap: 14px;
  padding: 12px;
  border-top: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .2s;
}
.ep:hover{background:var(--surface-hover)}
.ep img{width:120px;height:68px;object-fit:cover;border-radius:6px;flex:none}
.ep p{color:var(--text-muted);font-size:12px;margin-top:2px}
.ep b{font-family:var(--font-display);font-size:13px}

footer{padding:40px 5vw;color:var(--text-muted);font-size:12px;text-align:center;border-top:1px solid var(--border);margin-top:40px}

.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chips span{
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
}

#toast{
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--accent);
  color: #000;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 13px;
  z-index: 100;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

/* MOBILE ADAPTATION */
@media(max-width:640px){
  header{padding:12px 4vw;gap:12px;flex-wrap:wrap}
  .logo{font-size:19px}
  #q{order:3;width:100%;margin-top:4px}
  nav{order:2;gap:12px}
  nav button{font-size:12px}
  .hero{min-height:60vh;padding:110px 4vw 4vh}
  .hero h1{font-size:28px}
  .grid{padding-top:140px}
  .player{max-height:40vh}
  .player-bar{padding:8px}
  .icon-btn, select{font-size:11px;padding:6px 10px;flex:1;justify-content:center}
  .layer{padding:8px}
  #toast{left:16px;right:16px;text-align:center}
}
</style>
</head>
<body>
<header id="hd">
  <span class="logo" onclick="navTo('home')">Stream<span>Vault</span></span>
  <nav>
    <button class="on" data-v="home">Home</button>
    <button data-v="browse">Browse</button>
    <button data-v="free">Free</button>
    <button data-v="list">My List</button>
  </nav>
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="q" type="search" placeholder="Search titles..." aria-label="Search">
  </div>
</header>

<div id="hero"></div>
<main id="app"></main>

<footer>StreamVault · Premier Cinema Interface</footer>

<div class="layer" id="md"><div class="panel" id="mp" tabindex="-1"></div></div>

<div class="layer" id="pl">
  <button class="x" id="px" aria-label="Close player">×</button>
  <div class="player-wrap">
    <div class="player" id="pv"></div>
    <div class="player-bar" id="pbar">
      <div class="player-row">
        <select id="srcSelect">
          <option value="vidrift">Server 1 (VidRift)</option>
          <option value="apiplayer">Server 2 (APIPlayer)</option>
          <option value="vidsrcnet">Server 3 (VidSrc.me Mirror)</option>
          <option value="2embed">Server 4 (2Embed)</option>
        </select>
        <button class="icon-btn" id="nextServerBtn" style="flex:0 0 auto">🔄 Cycle Server</button>
      </div>

      <div class="player-row">
        <label class="icon-btn" style="cursor:pointer;">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Subtitles
          <input type="file" id="subFileInput" accept=".srt,.vtt">
        </label>
        
        <button class="icon-btn" id="autoNextToggle">
          ⚡ Auto-Next: <span id="autoNextStatus">ON</span>
        </button>

        <button class="icon-btn" id="pFs" style="flex:0 0 auto" title="Toggle Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>

      <span id="pTitle" style="font-size:12px;color:var(--text-muted);font-weight:600;text-align:center;margin-top:2px"></span>

      <div class="player-row" id="tvBtns" style="display:none;justify-content:center;margin-top:2px">
        <button class="icon-btn" id="pPrev">◀ Prev Episode</button>
        <button class="icon-btn" id="pNext">Next Episode ▶</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const IMG = 'https://image.tmdb.org/t/p/';
const api = (path, p = {}) => fetch('/api/tmdb?' + new URLSearchParams({ path, ...p })).then(r => { if (!r.ok) throw 0; return r.json(); });
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage[k]); } catch { return d; } },
  set: (k, v) => { localStorage[k] = JSON.stringify(v); }
};

const ROWS = [
  ['Trending Now', '/trending/all/week'],
  ['Popular Movies', '/movie/popular', {}, 'movie'],
  ['Anime Spotlight', '/discover/tv', { with_genres: 16, with_original_language: 'ja', sort_by: 'popularity.desc' }, 'tv'],
  ['Popular TV Shows', '/tv/popular', {}, 'tv'],
  ['Top Rated Cinema', '/movie/top_rated', {}, 'movie'],
  ['Top Rated Series', '/tv/top_rated', {}, 'tv']
];

const type = i => i.media_type || (i.title ? 'movie' : 'tv');
const name = i => i.title || i.name;
const year = i => (i.release_date || i.first_air_date || '').slice(0, 4);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg) {
  const t = $('#toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function card(i, def) {
  if (!i.poster_path) return '';
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.id = i.id;
  b.dataset.t = def || type(i);
  b.innerHTML = `<img loading="lazy" decoding="async" alt="${esc(name(i))}" src="${IMG}w342${i.poster_path}"><span class="t">${esc(name(i))}</span>`;
  b.onclick = () => openInfo(i.id, def || type(i));
  return b;
}

async function home() {
  $('#app').innerHTML = '';
  $('#hero').style.display = '';
  const wrap = $('#app');
  const top = document.createElement('section');
  top.className = 'row';
  top.style.order = 1;
  top.innerHTML = '<h2>Top 10 Today</h2><div class="track"></div>';
  wrap.append(top);
  
  api('/trending/movie/day').then(d => {
    const t = top.querySelector('.track');
    d.results.slice(0, 10).forEach((i, n) => {
      const c = card(i, 'movie');
      if (!c) return;
      const w = document.createElement('div');
      w.className = 'tp';
      w.innerHTML = `<span class="rank">${n + 1}</span>`;
      w.append(c);
      t.append(w);
    });
  }).catch(() => top.remove());

  ROWS.forEach(async ([title, path, params, def], n) => {
    const sec = document.createElement('section');
    sec.className = 'row';
    sec.style.order = n * 2;
    sec.innerHTML = `<h2>${title}</h2><div class="track">${'<div class="card"></div>'.repeat(6)}</div>`;
    wrap.append(sec);
    try {
      const d = await api(path, params);
      const t = sec.querySelector('.track');
      t.innerHTML = '';
      d.results.forEach(i => {
        const c = card(i, def);
        c && t.append(c);
      });
      if (!t.children.length) return sec.remove();
      if (n === 0) heroes(d.results.filter(i => i.backdrop_path).slice(0, 5));
    } catch {
      sec.remove();
    }
  });

  const cw = store.get('cw', []);
  if (cw.length) {
    const s = document.createElement('section');
    s.className = 'row';
    s.style.order = -1;
    s.innerHTML = '<h2>Continue Watching</h2><div class="track"></div>';
    cw.forEach(x => {
      const b = document.createElement('button');
      b.className = 'card';
      b.innerHTML = `<span class="t" style="opacity:1">${esc(x.title)} ${x.s ? `S${x.s} E${x.e}` : ''}</span>`;
      b.style.background = 'var(--surface)';
      b.onclick = () => playStream(x.id, x.t, x.s || 1, x.e || 1, x.title);
      s.querySelector('.track').append(b);
    });
    wrap.append(s);
  }
}

let hTimer;
function heroes(list) {
  let n = 0;
  const show = () => hero(list[n++ % list.length]);
  show();
  clearInterval(hTimer);
  hTimer = setInterval(() => {
    if ($('#hero').style.display !== 'none' && !$('.layer.open')) show();
  }, 9000);
}

function hero(i) {
  if (!i) return;
  const h = $('#hero');
  const t = type(i);
  h.innerHTML = `<section class="hero" style="background-image:url(${IMG}w1280${i.backdrop_path})"><div class="hero-content"><div class="chips"><span>★ ${(i.vote_average || 0).toFixed(1)}</span><span>${year(i)}</span><span>${t === 'tv' ? 'Series' : 'Movie'}</span></div><h1>${esc(name(i))}</h1><p>${esc(i.overview)}</p>
  <div class="hero-btns"><button class="btn" id="hp">▶ Play Now</button><button class="btn alt" id="ht">Trailer</button><button class="btn alt" id="hi">Overview</button></div></div></section>`;
  $('#hp').onclick = () => playStream(i.id, t, 1, 1, name(i));
  $('#ht').onclick = () => trailer(i.id, t);
  $('#hi').onclick = () => openInfo(i.id, t);
}

async function openInfo(id, t) {
  const d = await api(`/${t}/${id}`, { append_to_response: 'videos,credits' }).catch(() => null);
  if (!d) return;
  const list = store.get('mylist', []);
  const saved = list.some(x => x.id === id && x.t === t);
  
  $('#mp').innerHTML = `<button class="x" id="mx" aria-label="Close">×</button>
  <div class="bd" style="background-image:linear-gradient(0deg,var(--surface),transparent 70%),url(${d.backdrop_path ? IMG + 'w780' + d.backdrop_path : ''})"></div>
  <div class="in"><h2>${esc(name(d))}</h2>
  <p class="meta">${year(d)} · ★ ${(d.vote_average || 0).toFixed(1)} · ${(d.genres || []).map(g => esc(g.name)).slice(0,3).join(', ')}</p>
  <p style="margin-bottom:18px;font-size:13px;line-height:1.6">${esc(d.overview)}</p>
  <div class="hero-btns">${t === 'movie' ? `<button class="btn" id="mw">▶ Play Now</button>` : ''}
  <button class="btn alt" id="mt">Trailer</button>
  <button class="btn alt" id="ms">${saved ? 'Remove' : '+ My List'}</button></div>
  ${t === 'tv' ? `<div style="margin-top:20px">
    <div class="ep-controls">
      <select id="sn">${(d.seasons || []).filter(s => s.season_number > 0).map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('')}</select>
      <input type="text" id="epSearch" placeholder="Filter episodes..." style="flex:1;background:var(--surface-hover);border:1px solid var(--border);color:#fff;padding:8px 12px;border-radius:6px;font-size:12px">
    </div>
    <div id="eps"></div>
  </div>`: ''}
  </div><h3 class="sub">More Like This</h3><div class="track" id="sim"></div>`;

  $('#md').classList.add('open');
  $('#mp').scrollTop = 0;

  if (t === 'movie') {
    $('#mw').onclick = () => playStream(id, 'movie', 1, 1, name(d));
  }
  if (t === 'tv') {
    loadEps(id, $('#sn'), name(d));
  }
  api(`/${t}/${id}/similar`).then(r => r.results.forEach(i => { const c = card(i, t); c && $('#sim').append(c); })).catch(() => {});
  $('#mx').onclick = () => $('#md').classList.remove('open');
  $('#mt').onclick = () => trailer(id, t, d);
  $('#ms').onclick = () => {
    let l = store.get('mylist', []);
    if (saved) { l = l.filter(x => !(x.id === id && x.t === t)); toast('Removed from list'); }
    else { l = [...l, { id, t, poster_path: d.poster_path, title: d.title || d.name, name: d.name }]; toast('Added to list'); }
    store.set('mylist', l);
    openInfo(id, t);
  };
}

$('#md').onclick = e => { if (e.target === $('#md')) $('#md').classList.remove('open'); };
$('#pl').onclick = e => { if (e.target === $('#pl')) closePlayer(); };

async function loadEps(id, sel, showName = '') {
  if (!sel || !sel.value) return;
  sel.onchange = () => loadEps(id, sel, showName);
  const box = $('#eps');
  box.innerHTML = '<p class="meta">Loading episodes…</p>';
  const s = await api(`/tv/${id}/season/${sel.value}`).catch(() => null);
  if (!s || !s.episodes) { box.innerHTML = '<p class="meta">Episodes unavailable.</p>'; return; }
  box.innerHTML = s.episodes.map(e => `<div class="ep" onclick="playStream('${id}','tv','${sel.value}','${e.episode_number}','${esc(showName)}')">${e.still_path ? `<img loading="lazy" alt="" src="${IMG}w300${e.still_path}">` : '<span></span>'}<div><b>E${e.episode_number}: ${esc(e.name)} ▶</b><p>${esc(e.overview)}</p></div></div>`).join('');
}

let curPlaying = null;
let autoNextEnabled = true;

$('#autoNextToggle').onclick = () => {
  autoNextEnabled = !autoNextEnabled;
  $('#autoNextStatus').innerText = autoNextEnabled ? 'ON' : 'OFF';
};

// CLEAN SERVERS ROUTER (BLOCKED DOMAINS PURGED)
function getEmbedUrl(provider, id, t, s, e) {
  switch(provider) {
    case 'vidrift':
      return t === 'movie' ? `https://embed.vidrift.net/embed/movie/${id}` : `https://embed.vidrift.net/embed/tv/${id}/${s}/${e}`;
    case 'apiplayer':
      return t === 'movie' ? `https://apiplayer.co/embed/movie/${id}` : `https://apiplayer.co/embed/tv/${id}/${s}/${e}`;
    case 'vidsrcnet':
      return t === 'movie' ? `https://vidsrc.me/embed/movie?tmdb=${id}` : `https://vidsrc.me/embed/tv?tmdb=${id}&season=${s}&episode=${e}`;
    case '2embed':
      return t === 'movie' ? `https://www.2embed.cc/embed/${id}` : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`;
    default:
      return `https://embed.vidrift.net/embed/movie/${id}`;
  }
}

function renderIframe() {
  if (!curPlaying) return;
  const { id, t, s, e } = curPlaying;
  const provider = $('#srcSelect').value;
  const url = getEmbedUrl(provider, id, t, s, e);
  
  $('#pv').innerHTML = `<iframe id="mainIframe" src="${url}" referrerpolicy="no-referrer" allow="fullscreen; autoplay; picture-in-picture; encrypted-media; gyroscope; accelerometer" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>`;
}

$('#nextServerBtn').onclick = () => {
  const sel = $('#srcSelect');
  sel.selectedIndex = (sel.selectedIndex + 1) % sel.options.length;
  toast(`Server: ${sel.options[sel.selectedIndex].text}`);
  renderIframe();
};

function playStream(id, t, s = 1, e = 1, title = '') {
  const sNum = parseInt(s, 10);
  const eNum = parseInt(e, 10);
  curPlaying = { id, t, s: sNum, e: eNum, title };
  renderIframe();
  $('#pTitle').innerText = t === 'tv' ? `${title} · S${sNum} E${eNum}` : title;
  $('#tvBtns').style.display = t === 'tv' ? 'flex' : 'none';
  if (t === 'tv') {
    $('#pPrev').onclick = () => playStream(id, t, sNum, Math.max(1, eNum - 1), title);
    $('#pNext').onclick = () => playStream(id, t, sNum, eNum + 1, title);
  }
  $('#pl').classList.add('open');
  let cw = store.get('cw', []);
  cw = [{ id, t, s: sNum, e: eNum, title }, ...cw.filter(x => x.id !== id)].slice(0, 10);
  store.set('cw', cw);
}

$('#srcSelect').onchange = renderIframe;

$('#pFs').onclick = () => {
  const iframe = $('#mainIframe');
  if (!iframe) return;
  if (iframe.requestFullscreen) iframe.requestFullscreen();
};

async function trailer(id, t, d) {
  d = d || await api(`/${t}/${id}`, { append_to_response: 'videos' });
  const v = (d.videos?.results || []).filter(v => v.site === 'YouTube').sort((a, b) => (b.type === 'Trailer') - (a.type === 'Trailer'))[0];
  if (!v) return alert('No trailer available.');
  $('#tvBtns').style.display = 'none';
  $('#pv').innerHTML = `<iframe id="mainIframe" src="https://www.youtube-nocookie.com/embed/${v.key}?autoplay=1" allow="fullscreen; autoplay" allowfullscreen="true"></iframe>`;
  $('#pl').classList.add('open');
}

function closePlayer() {
  $('#pl').classList.remove('open');
  $('#pv').innerHTML = '';
}
$('#px').onclick = closePlayer;

function showGrid(items, msg) {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '';
  if (!items.length) { a.innerHTML = `<p class="empty">${msg}</p>`; return; }
  const g = document.createElement('div');
  g.className = 'grid';
  items.forEach(i => { const c = card(i, i.t); c && g.append(c); });
  a.append(g);
}

function myList() {
  const list = store.get('mylist', []);
  showGrid(list, 'Your list is empty. Add titles with "+ My List".');
}

function navTo(v) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'home') home();
  else if (v === 'list') myList();
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => navTo(b.dataset.v));

let qTimer;
$('#q').oninput = e => {
  clearTimeout(qTimer);
  const q = e.target.value.trim();
  if (!q) { navTo('home'); return; }
  qTimer = setTimeout(async () => {
    const d = await api('/search/multi', { query: q }).catch(() => ({ results: [] }));
    showGrid(d.results.filter(i => i.poster_path), 'No titles found for "' + esc(q) + '"');
  }, 300);
};

window.onscroll = () => $('#hd').classList.toggle('solid', window.scrollY > 20);

home();
</script>
</body>
</html>
