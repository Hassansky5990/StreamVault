      const modes = ['main', 'alt', 'third', 'multiembed', 'trailer'];

        const btn = document.getElementById(`server-btn-${m}`);
        if (!btn) return;

        }
      });

      if (dropdown) dropdown.value = currentPlayerMode;

    function loadPlayer(item, type, seasonNum, episodeNum) {
      const playerContainer = document.getElementById('modalPlayerContainer');
      const tmdbId = item.id;
      const s = seasonNum || 1;
      const e = episodeNum || 1;
      
      if (playerLoadTimeout) clearTimeout(playerLoadTimeout);

      // Show smooth loading state
      playerContainer.innerHTML = `
        <div class="absolute inset-0 flex flex-col items-center justify-center bg-black/90 z-20 transition-opacity duration-300" id="playerLoader">
          <div class="w-8 h-8 border-2 border-accent border-t-transparent rounded-full animate-spin mb-2"></div>
          <p class="text-[11px] text-gray-300 font-heading">Connecting to Stream Server (${currentPlayerMode.toUpperCase()})...</p>
          <button onclick="forceReloadIframe()" class="mt-3 px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs text-white border border-white/20 transition-all cursor-pointer">Stuck? Switch Server</button>
        </div>
      `;
      
      let embedUrl = '';
      if (currentPlayerMode === 'trailer') {
        if (currentTrailerKey) {
          embedUrl = `https://www.youtube.com/embed/${currentTrailerKey}?autoplay=1`;
        } else {
          playerContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center text-gray-400 text-xs p-4 text-center h-full">
              <i class="fa-solid fa-triangle-exclamation text-accent text-2xl mb-2"></i>
              <span>No official trailer preview found. Please select Vidnest, FrameX, or VidRift.</span>
            </div>
          `;
          return;
        }
      } else if (currentPlayerMode === 'alt') {
        // FrameX Provider
        if (type === 'movie') {
          embedUrl = `https://framextv.xyz/embed/${tmdbId}?autoplay=1&muted=0`;
        } else {
          embedUrl = `https://framextv.xyz/embed/${tmdbId}/${s}/${e}?autoplay=1&muted=0`;
        }
      } else if (currentPlayerMode === 'third') {
        // VidRift Provider (Embed.su)
        if (type === 'movie') {
          embedUrl = `https://embed.su/embed/movie/${tmdbId}`;
        } else {
          embedUrl = `https://embed.su/embed/tv/${tmdbId}/${s}/${e}`;
        }
      } else if (currentPlayerMode === 'multiembed') {
        // AutoEmbed / SuperEmbed Provider
        if (type === 'movie') {
          embedUrl = `https://multiembed.mov/?video_id=${tmdbId}&tmdb=1`;
        } else {
          embedUrl = `https://multiembed.mov/?video_id=${tmdbId}&tmdb=1&s=${s}&e=${e}`;
        }
      } else {
        // Vidnest Provider
        if (type === 'movie') {
          embedUrl = `https://vidnest.fun/movie/${tmdbId}`;
        } else {
          embedUrl = `https://vidnest.fun/tv/${tmdbId}/${s}/${e}`;
        }
      }

      // Append iframe with smooth fade-in after load
      setTimeout(() => {
        playerContainer.innerHTML += `

              <button onclick="setPlayerMode('multiembed')" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-heading font-bold uppercase border border-white/20">AutoEmbed (S4)</button>
            </div>
          `;
        }
      }, 7000);
    }

    function onPlayerIframeLoaded() {
      if (playerLoadTimeout) clearTimeout(playerLoadTimeout);
      const loader = document.getElementById('playerLoader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
      const iframe = document.getElementById('activePlayerIframe');
      if (iframe) {
        iframe.classList.remove('opacity-0');
      }
    }
