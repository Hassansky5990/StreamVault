<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StreamVault - Premium Cinema Experience</title>
  
  <!-- Fonts: Inter & Outfit for refined, high-end UI hierarchy -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              heading: ['Outfit', 'sans-serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              pitch: '#050508',
              surface: 'rgba(18, 18, 26, 0.75)',
              surfaceBorder: 'rgba(255, 255, 255, 0.08)',
              accent: '#e50914',
              accentHover: '#f40612',
              accentGlow: 'rgba(229, 9, 20, 0.35)',
              violetAccent: '#8b5cf6',
            },
          },
        },
      }
    }
  </script>

  <style>
    /* Custom Reset & Base Engine Styling */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    body {
      background-color: #050508;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Modern Minimalist Dark Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(5, 5, 8, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(229, 9, 20, 0.6);
    }

    /* Scroll Tracks without Visible Scrollbar */
    .track-no-bar::-webkit-scrollbar {
      display: none;
    }
    .track-no-bar {
      -ms-overflow-style: none;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    /* Refined Liquid Glass Surfaces */
    .liquid-glass {
      background: rgba(12, 12, 18, 0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .liquid-glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .liquid-glass-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(229, 9, 20, 0.4);
      box-shadow: 0 10px 30px -10px rgba(229, 9, 20, 0.3);
    }

    /* Standardized Height Control Button CSS */
    .std-btn {
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0 14px;
    }

    /* Re-engineered Top 10 Row Strict Metrics */
    .tp-item {
      display: flex;
      align-items: flex-end;
      flex: 0 0 auto;
      position: relative;
    }

    .tp-rank-num {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(3.5rem, 6vw, 5rem);
      font-weight: 900;
      line-height: 0.8;
      letter-spacing: -0.05em;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.1) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
      margin-right: -0.25rem;
      z-index: 1;
      text-shadow: 0 10px 20px rgba(0,0,0,0.9);
    }

    /* Text Truncation Utilities */
    .clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Shimmer Skeleton Loader */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
    }

    /* Ambient Subtle Background Glow */
    .glow-radial {
      background: radial-gradient(circle, rgba(229, 9, 20, 0.12) 0%, rgba(139, 92, 246, 0.05) 50%, rgba(5, 5, 8, 0) 70%);
    }

    /* Aspect Ratio Container for Video Player */
    .aspect-video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background-color: #000;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }

    .aspect-video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body class="relative min-h-screen pb-28 selection:bg-accent selection:text-white antialiased">

  <!-- AMBIENT BACKGROUND GLOWS -->
  <div class="fixed top-0 left-1/4 w-[300px] sm:w-[600px] h-[300px] sm:h-[600px] glow-radial pointer-events-none z-0"></div>
  <div class="fixed top-1/3 -right-20 w-[300px] sm:w-[600px] h-[300px] sm:h-[600px] glow-radial pointer-events-none z-0 opacity-60"></div>

  <!-- FIXED HEADER -->
  <header class="fixed top-0 left-0 right-0 z-40 liquid-glass border-b border-surfaceBorder transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-3 sm:gap-6">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2.5 cursor-pointer group shrink-0" onclick="switchTab('home')">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-accent to-red-700 flex items-center justify-center shadow-lg shadow-accent/20 group-hover:scale-105 transition-transform duration-300">
          <svg class="w-4 h-4 sm:w-5 sm:h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div>
          <span class="font-heading font-extrabold text-lg sm:text-2xl tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">StreamVault</span>
          <span class="text-[9px] font-semibold tracking-widest text-accent uppercase block -mt-1">Pro Cinema</span>
        </div>
      </div>

      <!-- Quick Search Bar -->
      <div class="flex-1 max-w-xs sm:max-w-md relative">
        <div class="relative flex items-center">
          <svg class="w-4 h-4 absolute left-3.5 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search movies, anime..." 
            class="w-full bg-white/5 border border-white/10 rounded-full pl-10 pr-9 py-2 text-xs sm:text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-accent/60 focus:ring-1 focus:ring-accent/30 transition-all duration-200"
            oninput="handleSearchInput(event)"
          />
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 text-gray-400 hover:text-white text-xs">
            ✕
          </button>
        </div>

        <!-- Live Instant Search Dropdown Box -->
        <div id="searchDropdown" class="hidden absolute left-0 right-0 top-full mt-2 liquid-glass rounded-2xl p-2 shadow-2xl z-50 border border-white/10 max-h-80 overflow-y-auto">
          <!-- Live results populated by JS -->
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="hidden sm:flex items-center gap-3 shrink-0">
        <button onclick="switchTab('library')" class="std-btn bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 gap-2">
          <svg class="w-4 h-4 text-accent" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          My Watchlist
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="pt-20 sm:pt-28 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 space-y-8 sm:space-y-12 pb-16">

    <!-- VIEW: HOME TAB -->
    <div id="tab-home" class="space-y-8 sm:space-y-12">
      
      <!-- HERO BANNER -->
      <section id="heroSection" class="relative rounded-2xl sm:rounded-3xl overflow-hidden min-h-[420px] sm:min-h-[520px] flex items-end p-5 sm:p-12 border border-white/10 shadow-2xl bg-black/80">
        <!-- Background Image Container -->
        <div id="heroBg" class="absolute inset-0 bg-cover bg-center transition-all duration-700 transform scale-105"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#050508] via-[#050508]/60 to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-[#050508] via-[#050508]/80 to-transparent"></div>

        <!-- Hero Content Overlay -->
        <div class="relative z-10 max-w-2xl space-y-3 sm:space-y-4">
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider bg-accent text-white shadow-md shadow-accent/30">Spotlight</span>
            <span id="heroRating" class="text-xs font-semibold text-yellow-400 flex items-center gap-1 bg-white/10 px-2.5 py-1 rounded-md backdrop-blur-md">★ 8.8</span>
            <span id="heroYear" class="text-xs font-medium text-gray-300">2026</span>
          </div>
          
          <h1 id="heroTitle" class="font-heading text-2xl sm:text-5xl font-extrabold text-white leading-tight tracking-tight">
            Loading Spotlight Title...
          </h1>

          <p id="heroOverview" class="text-gray-300 text-xs sm:text-sm clamp-2 sm:clamp-3 leading-relaxed max-w-xl">
            Stream high-definition movies and series with fast playback, synchronized subtitles, and personalized watchlist sync.
          </p>

          <div class="flex flex-wrap items-center gap-3 pt-1">
            <button id="heroPlayBtn" class="std-btn bg-accent hover:bg-accentHover text-white font-bold shadow-lg shadow-accent/30 hover:scale-105 gap-2 px-5">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Watch Now
            </button>
            <button id="heroBookmarkBtn" class="std-btn bg-white/10 hover:bg-white/20 border border-white/15 text-white gap-2 px-5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              Add to Library
            </button>
          </div>
        </div>
      </section>

      <!-- TOP 10 TODAY ROW WITH SLIDER BUTTONS -->
      <section class="space-y-4 relative">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-1.5 h-5 bg-accent rounded-full"></div>
            <h2 class="font-heading text-lg sm:text-2xl font-bold text-white tracking-tight">Top 10 Today</h2>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="scrollTrack('top10Track', -320)" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-white transition-all shadow-md">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <button onclick="scrollTrack('top10Track', 320)" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-white transition-all shadow-md">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>

        <div id="top10Track" class="flex gap-4 sm:gap-6 overflow-x-auto pb-4 track-no-bar pt-1">
          <!-- Populated by JavaScript -->
        </div>
      </section>

      <!-- GENRE QUICK CHIPS BAR -->
      <section class="space-y-3">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400">Popular Categories</h3>
        <div id="genreChipsTrack" class="flex flex-wrap items-center gap-2.5">
          <!-- Populated dynamically as static flex items -->
        </div>
      </section>

      <!-- TRENDING MOVIES ROW -->
      <section class="space-y-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-1.5 h-5 bg-violet-500 rounded-full"></div>
            <h2 class="font-heading text-lg sm:text-2xl font-bold text-white tracking-tight">Trending Movies</h2>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="scrollTrack('trendingMoviesTrack', -350)" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-white transition-all shadow-md">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <button onclick="scrollTrack('trendingMoviesTrack', 350)" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-white transition-all shadow-md">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
        <div id="trendingMoviesTrack" class="flex gap-3.5 sm:gap-5 overflow-x-auto pb-4 track-no-bar">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- Popular TV Shows Row -->
      <section class="space-y-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-1.5 h-5 bg-red-500 rounded-full"></div>
            <h2 class="font-heading text-lg sm:text-2xl font-bold text-white tracking-tight">Popular Series & Shows</h2>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="scrollTrack('popularTvTrack', -350)" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-white transition-all shadow-md">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <button onclick="scrollTrack('popularTvTrack', 350)" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-white transition-all shadow-md">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
        <div id="popularTvTrack" class="flex gap-3.5 sm:gap-5 overflow-x-auto pb-4 track-no-bar">
          <!-- Dynamically filled -->
        </div>
      </section>

    </div>

    <!-- VIEW: ANIME TAB -->
    <div id="tab-anime" class="hidden space-y-6">
      <div class="flex flex-col gap-3.5 border-b border-white/10 pb-4">
        <div>
          <h2 class="font-heading text-xl sm:text-3xl font-extrabold text-white">Anime Collection</h2>
          <p class="text-xs text-gray-400">Discover
