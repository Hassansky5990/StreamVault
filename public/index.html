<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StreamVault Pro · True Liquid Edition</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://vidcore.org">
<link rel="preconnect" href="https://player.autoembed.cc">
<link rel="preconnect" href="https://www.2embed.cc">
<link rel="preconnect" href="https://framextv.cc">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020204;
  --surface: #09080e;
  --surface-hover: #121019;
  
  /* TRUE LIQUID GLASS OPTICS */
  --liquid-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 60%, rgba(255, 255, 255, 0.03) 100%), rgba(10, 8, 16, 0.55);
  --border-glass: rgba(255, 255, 255, 0.2);
  --border-glass-bright: rgba(255, 255, 255, 0.45);
  
  --text-main: #f5f3f8;
  --text-muted: #8c839c;
  --accent-gradient: linear-gradient(135deg, #ff2a5f 0%, #7928ca 100%);
  --accent-solid: #ff2a5f;
  --accent-glow: rgba(255, 42, 95, 0.45);
  --ambient-color: rgba(121, 40, 202, 0.25);
  --font-display: 'Outfit', -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  background: var(--bg);
  color: var(--text-main);
  font: 400 14px/1.6 var(--font-body);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 100px;
}

button, input, select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;}

/* PAGE ENTER TRANSITION */
#app {
  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#app.tab-changing {
  opacity: 0;
  transform: translateY(10px);
}

/* HEADER / NAVBAR */
header{
  position: fixed;
  inset: 0 0 auto;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 4vw;
  background: linear-gradient(180deg, rgba(2,2,4,0.85) 0%, rgba(2,2,4,0) 100%);
  backdrop-filter: blur(8px);
  transition: all .3s ease;
}
header.solid{
  background: var(--liquid-glass);
  backdrop-filter: blur(20px) saturate(200%);
  border-bottom: 1px solid var(--border-glass);
  box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255, 255, 255, 0.25);
}
.logo{
  font: 800 19px/1 var(--font-display);
  color: #fff;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  flex-shrink: 0;
}
.logo-icon {
  width: 24px;
  height: 24px;
  background: var(--accent-gradient);
  clip-path: polygon(25% 0%, 100% 0%, 75% 100%, 0% 100%);
  box-shadow: 0 0 20px var(--accent-glow);
}
.logo span{background: var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-box{
  position: relative;
  display: flex;
  align-items: center;
  max-width: 200px;
}
#q{
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #fff;
  border-radius: 99px;
  padding: 9px 14px 9px 36px;
  width: 100%;
  font-size: 12px;
  transition: all .35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
#q:focus{
  background: rgba(10, 8, 16, 0.8);
  border-color: rgba(255, 42, 95, 0.6);
  outline: none;
  box-shadow: 0 0 0 4px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.search-icon{
  position: absolute;
  left: 13px;
  width: 15px;
  height: 15px;
  fill: var(--text-muted);
  pointer-events: none;
}

/* LIQUID GLASS DONATE BUTTON */
.donate-btn {
  background: linear-gradient(135deg, rgba(255, 42, 95, 0.18) 0%, rgba(121, 40, 202, 0.18) 100%), rgba(255, 255, 255, 0.02);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #fff;
  padding: 8px 14px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 1.5px 0 rgba(255, 255, 255, 0.35);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
}
.donate-btn svg { width: 13px; height: 13px; fill: #ff2a5f; animation: pulse-heart 2s infinite; }
.donate-btn:hover {
  background: var(--accent-gradient);
  border-color: transparent;
  box-shadow: 0 8px 25px var(--accent-glow), inset 0 1.5px 0 rgba(255,255,255,0.5);
  transform: translateY(-1px);
}
.donate-btn:hover svg { fill: #fff; }

@keyframes pulse-heart {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

/* FLOATING TRUE LIQUID TABS & ANIMATED PILL */
.bottom-nav {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  height: 56px;
  background: var(--liquid-glass);
  backdrop-filter: blur(25px) saturate(210%);
  -webkit-backdrop-filter: blur(25px) saturate(210%);
  border: 1px solid var(--border-glass);
  border-radius: 99px;
  display: flex;
  align-items: center;
  z-index: 45;
  padding: 4px 6px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 1.5px 0 rgba(255, 255, 255, 0.35);
  width: 92%;
  max-width: 440px;
}

/* SLIDING LIQUID GLOW PILL */
.nav-pill {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 0;
  width: 0;
  background: var(--accent-gradient);
  border-radius: 99px;
  box-shadow: 0 6px 20px var(--accent-glow), inset 0 1.5px 0 rgba(255, 255, 255, 0.45);
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.35s ease;
  pointer-events: none;
  z-index: 1;
}

.b-nav-item {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  height: 100%;
  border-radius: 99px;
  flex: 1;
  transition: color 0.3s ease;
}
.b-nav-item svg { width: 15px; height: 15px; fill: currentColor; transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.b-nav-item.active { color: #fff; }
.b-nav-item.active svg { fill: #fff; transform: scale(1.12); }
.b-nav-item:hover:not(.active) { color: #fff; }

/* HERO BANNER */
.hero{
  min-height: 75vh;
  display: flex;
  align-items: flex-end;
  padding: 110px 5vh 6vh;
  background-size: cover;
  background-position: center 25%;
  position: relative;
}
.hero::before{
  content: "";
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(90deg, var(--bg) 0%, rgba(2,2,4,0.65) 55%, transparent 100%),
    linear-gradient(0deg, var(--bg) 0%, rgba(2,2,4,0.25) 60%);
}
.hero-content{position:relative;max-width:620px;z-index:2}
.hero h1{
  font: 800 clamp(26px, 4.5vw, 52px)/1.05 var(--font-display);
  margin-bottom: 12px;
  letter-spacing: -1.2px;
  color: #fff;
  text-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.hero p{
  color: #b0a8c0;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 20px;
  font-size: 13px;
  line-height: 1.5;
}
.hero-btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}

.btn{
  background: var(--accent-gradient);
  color: #fff;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
  box-shadow: 0 8px 25px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.4);
}
.btn:hover{
  transform: translateY(-2px);
  filter: brightness(1.1);
  box-shadow: 0 12px 30px var(--accent-glow), inset 0 1.5px 0 rgba(255,255,255,0.5);
}
.btn.alt{
  background: var(--liquid-glass);
  backdrop-filter: blur(15px);
  color: #fff;
  border: 1px solid var(--border-glass);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
}

/* CARDS & TRACKS */
main{position:relative;z-index:3;margin-top:-3vh}
.row{margin:28px 0}
.row h2{
  font: 700 17px var(--font-display);
  letter-spacing: -0.3px;
  padding: 0 5vw 10px;
  color: #fff;
}

.track{
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 6px 5vw 16px 5vw;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.track::-webkit-scrollbar{display:none}

.card{
  flex: 0 0 auto;
  width: 130px;
  aspect-ratio: 2/3;
  border-radius: var(--radius-sm);
  background: var(--surface);
  overflow: hidden;
  position: relative;
  scroll-snap-align: start;
  border: 1px solid rgba(255, 255, 255, 0.08);
  transition: all .35s cubic-bezier(0.4, 0, 0.2, 1);
}
.card:hover{
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(255, 42, 95, 0.6);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85), 0 0 20px rgba(255, 42, 95, 0.25);
}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{
  position: absolute;
  inset: auto 0 0;
  padding: 25px 8px 8px;
  font-size: 10px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(2,2,4,0.98));
  color: #fff;
  opacity: 0;
  transition: opacity .2s ease;
}
.card:hover .t{opacity:1}

.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
  gap: 14px;
  padding: 90px 4vw 40px;
}
.grid .card{width:auto}
.empty{padding:100px 4vw;color:var(--text-muted);text-align:center;font-size:13px}

/* MODALS WITH LIQUID GLASS */
.layer{
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(2, 2, 4, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow-y: auto;
}
.layer.open{display:flex}

.panel{
  background: var(--liquid-glass);
  backdrop-filter: blur(35px) saturate(200%);
  -webkit-backdrop-filter: blur(35px) saturate(200%);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  max-width: 820px;
  width: 100%;
  max-height: 88vh;
  overflow: auto;
  position: relative;
  box-shadow: 0 50px 120px rgba(0, 0, 0, 0.95), inset 0 1.5px 0 rgba(255, 255, 255, 0.3);
}
.panel .bd{height:min(40vw, 280px);background-size:cover;background-position:center}
.panel .in{padding:24px}
.panel h2{font: 800 22px var(--font-display); letter-spacing: -0.5px}
.meta{color:var(--text-muted);margin:6px 0 14px;font-size:11px;font-weight:500}
.x{
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-glass);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 16px;
  z-index: 10;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.x:hover { background: rgba(255,255,255,0.15); }

/* DONATE MODAL PANEL */
.donate-panel {
  background: var(--liquid-glass);
  backdrop-filter: blur(35px) saturate(200%);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  max-width: 440px;
  width: 100%;
  padding: 28px;
  position: relative;
  box-shadow: 0 40px 100px rgba(0,0,0,0.9), inset 0 1.5px 0 rgba(255,255,255,0.35);
  text-align: center;
}
.donate-panel h3 { font: 800 20px var(--font-display); margin-bottom: 8px; color: #fff; }
.donate-panel p { color: var(--text-muted); font-size: 12px; line-height: 1.5; margin-bottom: 20px; }
.crypto-box {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 12px;
  border-radius: var(--radius-sm);
  font-family: monospace;
  font-size: 11px;
  color: #ff2a5f;
  word-break: break-all;
  margin-bottom: 16px;
}

/* SUBTITLE MODAL */
.sub-layer { z-index: 9999; }
.sub-panel {
  background: var(--liquid-glass);
  backdrop-filter: blur(35px) saturate(200%);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  max-width: 500px;
  width: 100%;
  padding: 20px;
  position: relative;
  box-shadow: 0 40px 100px rgba(0,0,0,0.9), inset 0 1.5px 0 rgba(255, 255, 255, 0.3);
}
.sub-search-row {
  display: flex;
  gap: 8px;
  margin: 14px 0;
}
.sub-input {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
}
.sub-select {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  padding: 10px 10px;
  border-radius: var(--radius-sm);
  font-size: 11px;
}
.sub-results-list {
  max-height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
}
.sub-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.sub-item span { font-size: 11px; font-weight: 600; color: #fff; }
.sub-item badge { font-size: 9px; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; color: var(--text-muted); }

/* PLAYER & CONTROLS */
.player-wrap{
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 940px;
  max-height: 94vh;
  gap: 10px;
  margin: auto;
}
.player{
  width: 100%;
  aspect-ratio: 16/9;
  max-height: 50vh;
  background: #000;
  border-radius: var(--radius-md);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border-glass);
  box-shadow: 0 0 70px var(--ambient-color), 0 24px 60px rgba(0,0,0,0.95);
}
.player iframe{width:100%;height:100%;border:0;display:block}

.server-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  background: var(--liquid-glass);
  backdrop-filter: blur(25px) saturate(200%);
  padding: 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-glass);
  box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1.5px 0 rgba(255,255,255,0.25);
}
.server-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.8px;
}
.server-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.server-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 8px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}
.server-btn.active { background: rgba(255, 42, 95, 0.2); border-color: var(--accent-solid); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); }
.server-badge { font-size: 6px; background: var(--accent-gradient); color: #fff; padding: 2px 4px; border-radius: 3px; font-weight: 700; text-transform: uppercase; }

.player-controls-row { 
  display: grid; 
  grid-template-columns: repeat(3, 1fr);
  gap: 6px; 
  align-items: center; 
  width: 100%; 
}
.icon-btn {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
}
.icon-btn svg{width:12px;height:12px;fill:currentColor; flex-shrink: 0;}
.icon-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--border-glass); }

.ep-nav-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  width: 100%;
}

.tp{display:flex;align-items:flex-end;flex:0 0 auto;margin-right:6px}
.rank{
  font: 800 clamp(45px, 8vw, 75px)/.8 var(--font-display);
  color: transparent;
  -webkit-text-stroke: 2px rgba(255, 42, 95, 0.7);
  margin-right: -10px;
  z-index: 1;
}
.sub{font:700 15px var(--font-display);padding:0 5vw 10px}

.ep-header-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.ep-search-input {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 11px;
  flex: 1;
}

.ep{
  display: flex;
  gap: 12px;
  padding: 10px;
  border-top: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.ep img{width:100px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.ep p{color:var(--text-muted);font-size:10px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep b{font-family:var(--font-display);font-size:11px;color:#fff}
.ep:hover { background: rgba(255,255,255,0.03); }

footer{padding:30px 4vw 90px;color:var(--text-muted);font-size:10px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);margin-top:30px}

.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chips span{
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-glass);
  backdrop-filter: blur(10px);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 9px;
  font-weight: 600;
  color: #fff;
}

#toast{
  position: fixed;
  bottom: 85px;
  right: 16px;
  background: var(--accent-gradient);
  color: #fff;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 11px;
  z-index: 10000;
  display: none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
}
</style>
</head>
<body>
<header id="hd">
  <span class="logo" onclick="switchTab('home')"><div class="logo-icon"></div>Stream<span>Vault</span></span>
  <div class="header-right">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" type="search" placeholder="Search..." aria-label="Search">
    </div>
    <button class="donate-btn" onclick="openDonateModal()">

        <button class="icon-btn" id="pNext">Next ▶</button>

<script>
const $ = s => document.querySelector(s);
const IMG = 'https://image.tmdb.org/t/p/';

const api = (path, p = {}) => fetch('/api/tmdb?' + new URLSearchParams({ path, ...p }))
  .then(r => { if (!r.ok) throw new Error('API Error'); return r.json(); })
  .catch(() => ({ results: [] }));

const store = {
  get: (k, d) => { try { return JSON.parse(localStorage[k]); } catch { return d; } },
  set: (k, v) => { localStorage[k] = JSON.stringify(v); }
};

const ROWS = [
  ['Trending Now', '/trending/all/week'],
  ['Popular Movies', '/movie/popular', {}, 'movie'],
  ['Anime Spotlight', '/discover/tv', { with_genres: 16, sort_by: 'popularity.desc' }, 'tv'],
  ['Popular TV Shows', '/tv/popular', {}, 'tv'],
  ['Top Rated Cinema', '/movie/top_rated', {}, 'movie']
];

let currentTab = 'home';
let allSeasonEpisodes = [];
const type = i => i.media_type || (i.title ? 'movie' : 'tv');
const name = i => i.title || i.name;
const year = i => (i.release_date || i.first_air_date || '').slice(0, 4);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg) {
  const t = $('#toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

function openDonateModal() {
  $('#donateModal').classList.add('open');
}

function copyCrypto() {
  navigator.clipboard.writeText('TYourCryptoWalletAddressHere12345');
  toast('Wallet address copied! 💖');
}

function card(i, def) {
  if (!i.poster_path) return '';
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.id = i.id;
  b.dataset.t = def || type(i);
  b.innerHTML = `<img loading="lazy" decoding="async" alt="${esc(name(i))}" src="${IMG}w342${i.poster_path}"><span class="t">${esc(name(i))}</span>`;
  b.onclick = () => openInfo(i.id, def || type(i));
  return b;
}

async function home() {
  $('#app').innerHTML = '';
  $('#hero').style.display = '';
  const wrap = $('#app');
  
  const top = document.createElement('section');
  top.className = 'row';
  top.style.order = 1;
  top.innerHTML = '<h2>Top 10 Today</h2><div class="track"></div>';
  wrap.append(top);
  
  api('/trending/movie/day').then(d => {
    const t = top.querySelector('.track');
    if (!d.results || !d.results.length) return top.remove();
    d.results.slice(0, 10).forEach((i, n) => {
      const c = card(i, 'movie');
      if (!c) return;
      const w = document.createElement('div');
      w.className = 'tp';
      w.innerHTML = `<span class="rank">${n + 1}</span>`;
      w.append(c);
      t.append(w);
    });
  }).catch(() => top.remove());

  ROWS.forEach(async ([title, path, params, def], n) => {
    const sec = document.createElement('section');
    sec.className = 'row';
    sec.style.order = n * 2;
    sec.innerHTML = `<h2>${title}</h2><div class="track">${'<div class="card"></div>'.repeat(5)}</div>`;
    wrap.append(sec);
    try {
      const d = await api(path, params);
      const t = sec.querySelector('.track');
      t.innerHTML = '';
      if (d.results && d.results.length) {
        d.results.forEach(i => {
          const c = card(i, def);
          c && t.append(c);
        });
        if (n === 0) heroBanner(d.results.filter(i => i.backdrop_path).slice(0, 5)[0]);
      } else {
        sec.remove();
      }
    } catch {
      sec.remove();
    }
  });

  const cw = store.get('cw', []);
  if (cw.length) {
    const s = document.createElement('section');
    s.className = 'row';
    s.style.order = -1;
    s.innerHTML = '<h2>Continue Watching</h2><div class="track"></div>';
    cw.forEach(x => {
      const b = document.createElement('button');
      b.className = 'card';
      b.innerHTML = `<span class="t" style="opacity:1">${esc(x.title)} ${x.s ? `S${x.s} E${x.e}` : ''}</span>`;
      b.style.background = 'var(--surface)';
      b.onclick = () => playStream(x.id, x.t, x.s || 1, x.e || 1, x.title);
      s.querySelector('.track').append(b);
    });
    wrap.append(s);
  }
}

async function animeTab() {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '<div class="row" style="padding-top:30px"><h2>Featured Anime</h2><div class="grid" id="animeGrid"></div></div>';
  const d = await api('/discover/tv', { with_genres: 16, with_original_language: 'ja', sort_by: 'popularity.desc' });
  const grid = $('#animeGrid');
  grid.innerHTML = '';
  if (d.results) {
    d.results.forEach(i => {
      const c = card(i, 'tv');
      c && grid.append(c);
    });
  }
}

async function discoverTab() {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '<div class="row" style="padding-top:30px"><h2>Discover Blockbusters</h2><div class="grid" id="discGrid"></div></div>';
  const d = await api('/movie/popular');
  const grid = $('#discGrid');
  grid.innerHTML = '';
  if (d.results) {
    d.results.forEach(i => {
      const c = card(i, 'movie');
      c && grid.append(c);
    });
  }
}

function heroBanner(i) {
  if (!i) return;
  const h = $('#hero');
  const t = type(i);
  h.innerHTML = `<section class="hero" style="background-image:url(${IMG}w1280${i.backdrop_path})"><div class="hero-content"><div class="chips"><span>★ ${(i.vote_average || 0).toFixed(1)}</span><span>${year(i)}</span><span>${t === 'tv' ? 'Series' : 'Movie'}</span></div><h1>${esc(name(i))}</h1><p>${esc(i.overview)}</p>
  <div class="hero-btns"><button class="btn" id="hp">▶ Play Now</button><button class="btn alt" id="ht">Trailer</button><button class="btn alt" id="hi">Details</button></div></div></section>`;
  $('#hp').onclick = () => playStream(i.id, t, 1, 1, name(i));
  $('#ht').onclick = () => trailer(i.id, t);
  $('#hi').onclick = () => openInfo(i.id, t);
}

async function openInfo(id, t) {
  const d = await api(`/${t}/${id}`, { append_to_response: 'videos,credits' });
  if (!d || !d.id) return;
  const list = store.get('mylist', []);
  const saved = list.some(x => x.id === id && x.t === t);
  
  $('#mp').innerHTML = `<button class="x" id="mx" aria-label="Close">×</button>
  <div class="bd" style="background-image:linear-gradient(0deg,var(--surface),transparent 70%),url(${d.backdrop_path ? IMG + 'w780' + d.backdrop_path : ''})"></div>
  <div class="in"><h2>${esc(name(d))}</h2>
  <p class="meta">${year(d)} · ★ ${(d.vote_average || 0).toFixed(1)} · ${(d.genres || []).map(g => esc(g.name)).slice(0,3).join(', ')}</p>
  <p style="margin-bottom:14px;font-size:12px;line-height:1.5">${esc(d.overview)}</p>
  <div class="hero-btns">${t === 'movie' ? `<button class="btn" id="mw">▶ Play Now</button>` : ''}
  <button class="btn alt" id="mt">Trailer</button>
  <button class="btn alt" id="ms">${saved ? 'Remove' : '+ Library'}</button></div>
  ${t === 'tv' ? `<div style="margin-top:16px">
    <div class="ep-header-bar">
      <select id="sn" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:8px 10px;border-radius:6px;font-size:11px">${(d.seasons || []).filter(s => s.season_number > 0).map(s => `<option value="${s.season_number}" style="background:#09080e;">Season ${s.season_number}</option>`).join('')}</select>
      <input type="search" id="epFilter" class="ep-search-input" placeholder="Search episode..." oninput="filterEpisodes()">
    </div>
    <div id="eps"></div>
  </div>`: ''}
  </div><h3 class="sub">Similar</h3><div class="track" id="sim"></div>`;

  $('#md').classList.add('open');
  $('#mp').scrollTop = 0;

  if (t === 'movie') $('#mw').onclick = () => playStream(id, 'movie', 1, 1, name(d));
  if (t === 'tv') loadEps(id, $('#sn'), name(d), id);
  api(`/${t}/${id}/similar`).then(r => r.results && r.results.forEach(i => { const c = card(i, t); c && $('#sim').append(c); })).catch(() => {});
  $('#mx').onclick = () => $('#md').classList.remove('open');
  $('#mt').onclick = () => trailer(id, t, d);
  $('#ms').onclick = () => {
    let l = store.get('mylist', []);
    if (saved) { l = l.filter(x => !(x.id === id && x.t === t)); toast('Removed'); }
    else { l = [...l, { id, t, poster_path: d.poster_path, title: d.title || d.name, name: d.name }]; toast('Added'); }
    store.set('mylist', l);
    openInfo(id, t);
  };
}

$('#md').onclick = e => { if (e.target === $('#md')) $('#md').classList.remove('open'); };
$('#pl').onclick = e => { if (e.target === $('#pl')) closePlayer(); };
$('#donateModal').onclick = e => { if (e.target === $('#donateModal')) $('#donateModal').classList.remove('open'); };

async function loadEps(id, sel, showName = '', showId = id) {
  if (!sel || !sel.value) return;
  sel.onchange = () => loadEps(id, sel, showName, showId);
  const box = $('#eps');
  box.innerHTML = '<p class="meta">Loading…</p>';
  const s = await api(`/tv/${id}/season/${sel.value}`);
  if (!s || !s.episodes) { box.innerHTML = '<p class="meta">Unavailable.</p>'; return; }
  allSeasonEpisodes = s.episodes.map(e => ({ ...e, showName, showId }));
  renderEpisodesList(allSeasonEpisodes);
}

function filterEpisodes() {
  const query = ($('#epFilter')?.value || '').toLowerCase().trim();
  if (!query) return renderEpisodesList(allSeasonEpisodes);
  const filtered = allSeasonEpisodes.filter(e => 
    e.name.toLowerCase().includes(query) || 
    String(e.episode_number).includes(query)
  );
  renderEpisodesList(filtered);
}

function renderEpisodesList(episodes) {
  const box = $('#eps');
  if (!episodes.length) { box.innerHTML = '<p class="meta">No match.</p>'; return; }
  box.innerHTML = episodes.map(e => `<div class="ep" onclick="playStream('${e.showId}','tv','${e.season_number}','${e.episode_number}','${esc(e.showName)}')">${e.still_path ? `<img loading="lazy" alt="" src="${IMG}w300${e.still_path}">` : '<span></span>'}<div><b>E${e.episode_number}: ${esc(e.name)} ▶</b><p>${esc(e.overview)}</p></div></div>`).join('');
}

let curPlaying = null;
let currentServer = 'vidcore';

document.querySelectorAll('.server-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentServer = btn.dataset.server;
    renderIframe();
    toast(`Server: ${btn.innerText.split(' ')[0]}`);
  };
});

function shareWatchParty() {
  if (!curPlaying) return;
  const roomID = Math.random().toString(36).substring(2, 8);
  const partyURL = `${window.location.origin}?id=${curPlaying.id}&t=${curPlaying.t}&s=${curPlaying.s}&e=${curPlaying.e}&room=${roomID}`;
  navigator.clipboard.writeText(partyURL);
  toast(`Link Copied! Room #${roomID}`);
}

function openSubtitleSearch() {
  if (curPlaying) {
    $('#subQuery').value = curPlaying.title + (curPlaying.s ? ` S${curPlaying.s}E${curPlaying.e}` : '');
  }
  $('#subModal').classList.add('open');
  if ($('#subQuery').value) fetchOnlineSubtitles();
}

function fetchOnlineSubtitles() {
  const q = $('#subQuery').value.trim();
  const lang = $('#subLang').value;
  const list = $('#subResultsList');
  if (!q) return;
  list.innerHTML = `
    <div class="sub-item" onclick="attachSubtitle('${esc(q)} - CC (${lang.toUpperCase()})')">
      <span>${esc(q)} - Multi-CC (${lang.toUpperCase()})</span>
      <badge>${lang.toUpperCase()}</badge>
    </div>
  `;
}

function attachSubtitle(title) {
  $('#subModal').classList.remove('open');
  toast(`Subtitles Loaded: ${title}`);
}

function getEmbedUrl(server, id, t, s, e) {
  switch(server) {
    case 'vidcore':
      return t === 'movie' ? `https://vidcore.org/embed/movie/${id}` : `https://vidcore.org/embed/tv/${id}/${s}/${e}`;
    case 'autoembed':
      return t === 'movie' ? `https://player.autoembed.cc/embed/movie/${id}` : `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`;
    case '2embed':
      return t === 'movie' ? `https://www.2embed.cc/embed/${id}` : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`;
    case 'framex':
      return t === 'movie' ? `https://framextv.cc/embed/movie/${id}` : `https://framextv.cc/embed/tv/${id}/${s}/${e}`;
    default:
      return `https://vidcore.org/embed/movie/${id}`;
  }
}

function renderIframe() {
  if (!curPlaying) return;
  const { id, t, s, e } = curPlaying;
  const url = getEmbedUrl(currentServer, id, t, s, e);
  $('#pv').innerHTML = `<iframe id="mainIframe" src="${url}" loading="lazy" referrerpolicy="no-referrer" allow="fullscreen; autoplay; picture-in-picture" allowfullscreen="true"></iframe>`;
}

function playStream(id, t, s = 1, e = 1, title = '') {
  const sNum = parseInt(s, 10);
  const eNum = parseInt(e, 10);
  curPlaying = { id, t, s: sNum, e: eNum, title };
  $('#serverBarContainer').style.display = 'flex';
  renderIframe();
  $('#pTitle').innerText = t === 'tv' ? `${title} · S${sNum} E${eNum}` : title;
  $('#tvBtns').style.display = t === 'tv' ? 'grid' : 'none';
  if (t === 'tv') {
    $('#pPrev').onclick = () => playStream(id, t, sNum, Math.max(1, eNum - 1), title);
    $('#pNext').onclick = () => playStream(id, t, sNum, eNum + 1, title);
  }
  $('#pl').classList.add('open');
  let cw = store.get('cw', []);
  cw = [{ id, t, s: sNum, e: eNum, title }, ...cw.filter(x => x.id !== id)].slice(0, 10);
  store.set('cw', cw);
}

$('#pFs').onclick = () => {
  const iframe = $('#mainIframe');
  if (!iframe) return;
  if (iframe.requestFullscreen) iframe.requestFullscreen();
};

async function trailer(id, t, d) {
  d = d || await api(`/${t}/${id}`, { append_to_response: 'videos' });
  const v = (d.videos?.results || []).filter(v => v.site === 'YouTube').sort((a, b) => (b.type === 'Trailer') - (a.type === 'Trailer'))[0];
  if (!v) return alert('No trailer.');
  $('#serverBarContainer').style.display = 'none';
  $('#tvBtns').style.display = 'none';
  $('#pv').innerHTML = `<iframe id="mainIframe" src="https://www.youtube-nocookie.com/embed/${v.key}?autoplay=1" loading="lazy" allow="fullscreen; autoplay" allowfullscreen="true"></iframe>`;
  $('#pl').classList.add('open');
}

function closePlayer() {
  $('#pl').classList.remove('open');
  $('#pv').innerHTML = '';
}
$('#px').onclick = closePlayer;

function showGrid(items, msg) {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '';
  if (!items.length) { a.innerHTML = `<p class="empty">${msg}</p>`; return; }
  const g = document.createElement('div');
  g.className = 'grid';
  items.forEach(i => { const c = card(i, i.t); c && g.append(c); });
  a.append(g);
}

function myList() {
  const list = store.get('mylist', []);
  showGrid(list, 'Library empty.');
}

// ANIMATED SLIDING TAB INDICATOR ENGINE
function updatePillPosition(activeBtn) {
  const pill = $('#navPill');
  if (!activeBtn || !pill) return;
  pill.style.width = `${activeBtn.offsetWidth}px`;
  pill.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
}

function switchTab(tab) {
  currentTab = tab;
  const buttons = document.querySelectorAll('.b-nav-item');
  let activeBtn = null;
  
  buttons.forEach(b => {
    const isActive = b.dataset.tab === tab;
    b.classList.toggle('active', isActive);
    if (isActive) activeBtn = b;
  });

  updatePillPosition(activeBtn);

  const app = $('#app');
  app.classList.add('tab-changing');
  
  setTimeout(() => {
    if (tab === 'home') home();
    else if (tab === 'anime') animeTab();
    else if (tab === 'discover') discoverTab();
    else if (tab === 'list') myList();
    app.classList.remove('tab-changing');
  }, 150);
}

let qTimer;
$('#q').oninput = e => {
  clearTimeout(qTimer);
  const q = e.target.value.trim();
  if (!q) { switchTab(currentTab); return; }
  qTimer = setTimeout(async () => {
    const d = await api('/search/multi', { query: q });
    if (d.results) {
      showGrid(d.results.filter(i => i.poster_path), 'No results for "' + esc(q) + '"');
    }
  }, 300);
};

window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  const partyID = params.get('id');
  const partyType = params.get('t');
  if (partyID && partyType) {
    playStream(partyID, partyType, params.get('s') || 1, params.get('e') || 1, 'Watch Party Room');
    toast(`Joined Party #${params.get('room') || 'Sync'}`);
  }
  setTimeout(() => updatePillPosition($('.b-nav-item.active')), 50);
};

window.onresize = () => updatePillPosition($('.b-nav-item.active'));
window.onscroll = () => $('#hd').classList.toggle('solid', window.scrollY > 20);

home();
</script>
</body>
</html>
