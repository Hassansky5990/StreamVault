<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamVault</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14101c;--surf:#1f1a2b;--line:#2f2840;--text:#f2ede4;--mute:#a79fb8;--acc:#f2b134;
--serif:'Fraunces',Georgia,serif;--sans:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(1100px 600px at 85% -10%,#4a2f7a55,transparent),var(--bg);color:var(--text);font:400 16px/1.5 var(--sans);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:28px;padding:14px 4vw;
 background:linear-gradient(var(--bg),transparent);transition:background .3s}
header.solid{background:#14101ce8;backdrop-filter:blur(14px)}
.logo{font:800 24px var(--serif);color:var(--acc);cursor:pointer}
nav{display:flex;gap:18px;flex:1}
nav button{color:var(--mute);padding:6px 2px}
nav button.on,nav button:hover{color:var(--text)}
#q{background:var(--surf);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:8px 16px;width:min(240px,40vw)}
.hero{min-height:78vh;display:flex;align-items:flex-end;padding:0 4vw 9vh;background-size:cover;background-position:center top;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 8%,transparent 70%),linear-gradient(0deg,var(--bg),transparent 45%)}
.hero>div{position:relative;max-width:560px}
.hero h1{font:800 clamp(34px,6vw,64px)/1.05 var(--serif);margin-bottom:12px}
.hero p{color:#d8d0e6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:18px}
.btn{background:var(--acc);color:#1a1200;font-weight:600;padding:10px 22px;border-radius:8px;margin-right:10px;display:inline-block;text-decoration:none;transition:transform 0.2s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:#ffffff1f;color:var(--text)}
main{padding-bottom:60px;margin-top:-4vh;position:relative}
.row{margin:26px 0}
.row h2{font:600 21px var(--serif);padding:0 4vw 10px}
.track{display:flex;gap:12px;overflow-x:auto;padding:4px 4vw 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.card{flex:0 0 auto;width:clamp(120px,14vw,190px);aspect-ratio:2/3;border-radius:10px;background:var(--surf);overflow:hidden;
 position:relative;scroll-snap-align:start;transition:transform .2s}
.card:hover{transform:scale(1.05);z-index:2}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{position:absolute;inset:auto 0 0;padding:24px 8px 8px;font-size:13px;background:linear-gradient(transparent,#000c);opacity:0;transition:.2s}
.card:hover .t,.card:focus-visible .t{opacity:1}
.sk{background:linear-gradient(90deg,var(--surf),var(--line),var(--surf));background-size:200%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200%}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:100px 4vw 0}
.grid .card{width:auto}
.empty{padding:120px 4vw;color:var(--mute);text-align:center}
.layer{position:fixed;inset:0;z-index:50;background:#000a;display:none;align-items:center;justify-content:center;padding:3vw}
.layer.open{display:flex}
.panel{background:var(--surf);border-radius:14px;max-width:880px;width:100%;max-height:92vh;overflow:auto;position:relative;outline:none}
.panel .bd{height:min(46vw,380px);background-size:cover;background-position:center}
.panel .in{padding:22px 26px 28px}
.panel h2{font:800 30px var(--serif)}
.meta{color:var(--mute);margin:6px 0 12px}
.x{position:absolute;top:10px;right:12px;background:#000a;border-radius:50%;width:36px;height:36px;font-size:20px;z-index:2;color:var(--text);display:flex;align-items:center;justify-content:center}
.player-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:1100px;gap:12px;position:relative}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;position:relative}
.player video,.player iframe{width:100%;height:100%;border:0;display:block}
.player-bar{display:flex;gap:12px;width:100%;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--surf);padding:10px 14px;border-radius:10px;border:1px solid var(--line)}
.player-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);padding:7px 12px;border-radius:6px;font-size:13px;color:var(--text);transition:background 0.2s}
.icon-btn:hover{background:var(--line);color:var(--acc)}
.icon-btn svg{width:16px;height:16px;fill:currentColor}
select, input[type="text"]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:100px 4vw 0}
.tp{display:flex;align-items:flex-end;flex:0 0 auto;margin-right:6px}
.rank{font:800 clamp(70px,12vw,120px)/.8 var(--serif);color:transparent;-webkit-text-stroke:2px var(--acc);margin-right:-14px;z-index:1}
.sub{font:600 18px var(--serif);padding:0 4vw 8px}.panel .track{padding-bottom:24px}
.ep-controls{display:flex;gap:10px;margin-bottom:12px;align-items:center}
.ep{display:flex;gap:12px;padding:12px;border-top:1px solid var(--line);border-radius:8px;transition:background .2s;cursor:pointer}
.ep:hover{background:var(--line)}
.ep img{width:120px;height:68px;object-fit:cover;border-radius:6px;flex:none}
.ep p{color:var(--mute);font-size:14px}.ep small{color:var(--mute);margin-left:8px}
footer{padding:30px 4vw 40px;color:var(--mute);font-size:13px;text-align:center}
nav button{white-space:nowrap}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.hero{min-height:86vh;animation:fade .8s}.hero h1{text-shadow:0 4px 30px #000b;font-size:clamp(38px,7vw,76px)}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chips span{background:#ffffff1f;border:1px solid #ffffff2a;border-radius:99px;padding:2px 12px;font-size:13px;backdrop-filter:blur(6px)}
.row h2::before{content:"";display:inline-block;width:4px;height:18px;background:var(--acc);border-radius:2px;margin-right:10px;vertical-align:-2px}
.card img{animation:fade .5s}
.card:hover{transform:scale(1.06) translateY(-4px);box-shadow:0 14px 32px #000b,0 0 0 2px #f2b13490}
#toast{position:fixed;bottom:24px;right:24px;background:var(--acc);color:#1a1200;padding:10px 20px;border-radius:8px;font-weight:600;z-index:100;display:none;box-shadow:0 4px 16px #0008}
@media(max-width:640px){nav button{padding:8px 8px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){
 nav{position:fixed;inset:auto 0 0;z-index:30;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
 nav button{padding:8px 16px}
 header{gap:12px}#q{flex:1;width:auto}
 main{padding-bottom:90px}.hero{min-height:70vh}
 .panel .in{padding:18px}.layer{padding:0}.panel{border-radius:0;max-height:100vh;height:100%}
}
</style>
</head>
<body>
<header id="hd"><span class="logo" onclick="navTo('home')">StreamVault</span>
<nav>
  <button class="on" data-v="home">Home</button>
  <button data-v="browse">Browse</button>
  <button data-v="free">Free</button>
  <button data-v="list">My List</button>
  <button data-v="lib">Library</button>
</nav>
<input id="q" type="search" placeholder="Search movies, shows, anime" aria-label="Search"></header>
<div id="hero"></div><main id="app"></main>
<footer>StreamVault v2.2 · Powered by TMDB & Internet Archive.</footer>

<!-- Details Modal -->
<div class="layer" id="md"><div class="panel" id="mp" tabindex="-1"></div></div>

<!-- Player Modal -->
<div class="layer" id="pl">
  <button class="x" id="px" aria-label="Close player">×</button>
  <div class="player-wrap">
    <div class="player" id="pv"></div>
    <div class="player-bar" id="pbar">
      <div class="player-group">
        <!-- Server Select -->
        <select id="srcSelect">
          <option value="vidsrcpro">Server 1 (VidSrc Pro)</option>
          <option value="vidsrccc">Server 2 (VidSrc CC)</option>
          <option value="vidsrcin">Server 3 (VidSrc In)</option>
          <option value="autoembed">Server 4 (AutoEmbed)</option>
          <option value="2embed">Server 5 (2Embed)</option>
          <option value="vidlink">Server 6 (VidLink)</option>
        </select>

        <!-- AI Subtitles / CC Language Selector -->
        <select id="subSelect" title="AI / Closed Subtitles">
          <option value="">🌐 Subtitles: Off</option>
          <option value="en">English (AI/CC)</option>
          <option value="es">Spanish (Español)</option>
          <option value="fr">French (Français)</option>
          <option value="de">German (Deutsch)</option>
          <option value="ar">Arabic (العربية)</option>
          <option value="hi">Hindi (हिन्दी)</option>
          <option value="ja">Japanese (日本語)</option>
          <option value="ko">Korean (한국어)</option>
          <option value="zh">Chinese (中文)</option>
          <option value="pt">Portuguese (Português)</option>
        </select>
        
        <!-- Reload Button -->
        <button class="icon-btn" id="pReload" title="Reload Video">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          Reload
        </button>
      </div>

      <span id="pTitle" style="font-size:14px;color:var(--mute)"></span>

      <!-- TV Episode Buttons -->
      <div class="player-group" id="tvBtns" style="display:none">
        <button class="icon-btn" id="pPrev">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          Prev
        </button>
        <button class="icon-btn" id="pNext">
          Next
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),IMG='https://image.tmdb.org/t/p/';
const api=(path,p={})=>fetch('/api/tmdb?'+new URLSearchParams({path,...p})).then(r=>{if(!r.ok)throw 0;return r.json()});
const store={get:(k,d)=>{try{return JSON.parse(localStorage[k])}catch{return d}},set:(k,v)=>localStorage[k]=JSON.stringify(v)};
const REG=(navigator.language.split('-')[1]||'US').toUpperCase();
const ROWS=[
  ['Trending this week','/trending/all/week'],
  ['Free with ads','/discover/movie',{watch_region:REG,with_watch_monetization_types:'free|ads',sort_by:'popularity.desc'},'movie'],
  ['Popular movies','/movie/popular',{},'movie'],
  ['Anime series','/discover/tv',{with_genres:16,with_original_language:'ja',sort_by:'popularity.desc'},'tv'],
  ['Popular TV shows','/tv/popular',{},'tv'],
  ['Top rated movies','/movie/top_rated',{},'movie'],
  ['Top rated TV','/tv/top_rated',{},'tv'],
  ['Action','/discover/movie',{with_genres:28,sort_by:'popularity.desc'},'movie'],
  ['Comedy','/discover/movie',{with_genres:35,sort_by:'popularity.desc'},'movie'],
  ['Sci-fi','/discover/movie',{with_genres:878,sort_by:'popularity.desc'},'movie'],
  ['Horror','/discover/movie',{with_genres:27,sort_by:'popularity.desc'},'movie'],
  ['Animation','/discover/movie',{with_genres:16,sort_by:'popularity.desc'},'movie']
];
const type=i=>i.media_type||(i.title?'movie':'tv'),name=i=>i.title||i.name,year=i=>(i.release_date||i.first_air_date||'').slice(0,4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){
  const t=$('#toast');t.innerText=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

function card(i,def){
 if(!i.poster_path)return'';
 const b=document.createElement('button');b.className='card';b.dataset.id=i.id;b.dataset.t=def||type(i);
 b.innerHTML=`<img loading="lazy" decoding="async" alt="${esc(name(i))}" src="${IMG}w342${i.poster_path}"><span class="t">${esc(name(i))}</span>`;
 b.onclick=()=>openInfo(i.id,def||type(i));return b}

async function home(){
 $('#app').innerHTML='';$('#hero').style.display='';
 const wrap=$('#app');
 const top=document.createElement('section');top.className='row';top.style.order=1;
 top.innerHTML='<h2>Top 10 movies today</h2><div class="track"></div>';wrap.append(top);
 api('/trending/movie/day').then(d=>{const t=top.querySelector('.track');d.results.slice(0,10).forEach((i,n)=>{const c=card(i,'movie');if(!c)return;
  const w=document.createElement('div');w.className='tp';w.innerHTML=`<span class="rank">${n+1}</span>`;w.append(c);t.append(w)})}).catch(()=>top.remove());
 ROWS.forEach(async([title,path,params,def],n)=>{
  const sec=document.createElement('section');sec.className='row';sec.style.order=n*2;
  sec.innerHTML=`<h2>${title}</h2><div class="track">${'<div class="card sk"></div>'.repeat(8)}</div>`;wrap.append(sec);
  try{const d=await api(path,params),t=sec.querySelector('.track');t.innerHTML='';
   d.results.forEach(i=>{const c=card(i,def);c&&t.append(c)});if(!t.children.length)return sec.remove();
   if(n===0)heroes(d.results.filter(i=>i.backdrop_path).slice(0,6))}catch{sec.remove()}});
 const cw=store.get('cw',[]);
 if(cw.length){const s=document.createElement('section');s.className='row';s.style.order=-1;
  s.innerHTML='<h2>Continue watching</h2><div class="track"></div>';
  cw.forEach(x=>{const b=document.createElement('button');b.className='card';
   b.innerHTML=`<span class="t" style="opacity:1">${esc(x.title)} ${x.s?`S${x.s} E${x.e}`:''}</span>`;
   b.style.background='var(--line)';b.onclick=()=>playStream(x.id,x.t,x.s||1,x.e||1,x.title);
   s.querySelector('.track').append(b)});wrap.append(s)}}

let hTimer;
function heroes(list){let n=0;const show=()=>hero(list[n++%list.length]);show();clearInterval(hTimer);
 hTimer=setInterval(()=>{if($('#hero').style.display!=='none'&&!$('.layer.open'))show()},9000)}
function hero(i){if(!i)return;const h=$('#hero');
 const t=type(i);
 h.innerHTML=`<section class="hero" style="background-image:url(${IMG}w1280${i.backdrop_path})"><div><div class="chips"><span>★ ${(i.vote_average||0).toFixed(1)}</span><span>${year(i)}</span><span>${t==='tv'?'Series':'Movie'}</span></div><h1>${esc(name(i))}</h1><p>${esc(i.overview)}</p>
 <button class="btn" id="hp">Watch Now</button><button class="btn alt" id="ht">Watch trailer</button><button class="btn alt" id="hi">More info</button></div></section>`;
 $('#hp').onclick=()=>playStream(i.id,t,1,1,name(i));
 $('#ht').onclick=()=>trailer(i.id,t);
 $('#hi').onclick=()=>openInfo(i.id,t)}

async function openInfo(id,t){
 const d=await api(`/${t}/${id}`,{append_to_response:'videos,credits'}).catch(()=>null);if(!d)return;
 const list=store.get('mylist',[]),saved=list.some(x=>x.id===id&&x.t===t);
 const cast=(d.credits?.cast||[]).slice(0,6).map(c=>c.name).join(', ');
 const rt=d.runtime?d.runtime+' min':d.number_of_seasons?d.number_of_seasons+' seasons':'';
 $('#mp').innerHTML=`<button class="x" id="mx" aria-label="Close">×</button>
 <div class="bd" style="background-image:linear-gradient(0deg,var(--surf),transparent 60%),url(${d.backdrop_path?IMG+'w780'+d.backdrop_path:''})"></div>
 <div class="in"><h2>${esc(name(d))}</h2>
 <p class="meta">${year(d)} · ${rt} · ★ ${(d.vote_average||0).toFixed(1)} · ${(d.genres||[]).map(g=>esc(g.name)).join(', ')}</p>
 <p style="margin-bottom:14px">${esc(d.overview)}</p><p class="meta">${cast?'Cast: '+esc(cast):''}</p>
 ${t==='movie'?`<button class="btn" id="mw">Watch Now</button>`:''}
 <button class="btn ${t==='movie'?'alt':''}" id="mt">Watch trailer</button>
 <button class="btn alt" id="ms">${saved?'Remove from My List':'+ My List'}</button>
 ${t==='tv'?`<div style="margin-top:18px">
   <div class="ep-controls">
     <select id="sn">${(d.seasons||[]).filter(s=>s.season_number>0).map(s=>`<option value="${s.season_number}">Season ${s.season_number}</option>`).join('')}</select>
     <input type="text" id="epSearch" placeholder="🔍 Search episodes..." style="flex:1">
   </div>
   <div id="eps"></div>
 </div>`:''}
 </div><h3 class="sub">More like this</h3><div class="track" id="sim"></div>`;
 
 $('#md').classList.add('open');
 $('#mp').scrollTop=0;
 $('#mp').focus();
 
 if(t==='movie'){
   $('#mw').onclick=()=>playStream(id,'movie',1,1,name(d));
 }
 if(t==='tv'){
   loadEps(id,$('#sn'),name(d));
   $('#epSearch').oninput=e=>{
     const q=e.target.value.toLowerCase();
     document.querySelectorAll('.ep').forEach(ep=>{
       ep.style.display=ep.innerText.toLowerCase().includes(q)?'flex':'none';
     });
   };
 }
 api(`/${t}/${id}/similar`).then(r=>r.results.forEach(i=>{const c=card(i,t);c&&$('#sim').append(c)})).catch(()=>{});
 $('#mx').onclick=()=>$('#md').classList.remove('open');
 $('#mt').onclick=()=>trailer(id,t,d);
 $('#ms').onclick=e=>{
  let l=store.get('mylist',[]);
  if(saved){
    l=l.filter(x=>!(x.id===id&&x.t===t));
    toast('Removed from My List');
  } else {
    l=[...l,{id,t,poster_path:d.poster_path,title:d.title||d.name,name:d.name}];
    toast('Added to My List');
  }
  store.set('mylist',l);openInfo(id,t);
 }}

// Click outside details modal backdrop to close
$('#md').onclick = e => {
  if (e.target === $('#md')) $('#md').classList.remove('open');
};

// Click outside player modal backdrop to close
$('#pl').onclick = e => {
  if (e.target === $('#pl')) closePlayer();
};

async function loadEps(id,sel,showName=''){
 if(!sel||!sel.value)return;sel.onchange=()=>loadEps(id,sel,showName);
 const box=$('#eps');box.innerHTML='<p class="meta">Loading…</p>';
 const s=await api(`/tv/${id}/season/${sel.value}`).catch(()=>null);
 if(!s||!s.episodes){box.innerHTML='<p class="meta">Episodes unavailable.</p>';return}
 box.innerHTML=s.episodes.map(e=>`<div class="ep" onclick="playStream('${id}','tv','${sel.value}','${e.episode_number}','${esc(showName)}')">${e.still_path?`<img loading="lazy" alt="" src="${IMG}w300${e.still_path}">`:'<span></span>'}<div><b>${e.episode_number}. ${esc(e.name)} ▶</b><small>${e.runtime?e.runtime+' min':''}</small><p>${esc(e.overview)}</p></div></div>`).join('')}

let curPlaying = null;

function getEmbedUrl(provider, id, t, s, e, subLang) {
  let subParam = subLang ? `&sub=${subLang}` : '';
  let subParamPath = subLang ? `?sub=${subLang}` : '';
  
  if (provider === 'vidsrcpro') {
    return t === 'movie' ? `https://vidsrc.pro/embed/movie/${id}${subParamPath}` : `https://vidsrc.pro/embed/tv/${id}/${s}/${e}${subParamPath}`;
  } else if (provider === 'vidsrccc') {
    return t === 'movie' ? `https://vidsrc.cc/v2/embed/movie/${id}` : `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`;
  } else if (provider === 'vidsrcin') {
    return t === 'movie' ? `https://vidsrc.in/embed/movie/${id}` : `https://vidsrc.in/embed/tv/${id}/${s}/${e}`;
  } else if (provider === 'autoembed') {
    return t === 'movie' ? `https://player.autoembed.cc/embed/movie/${id}` : `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`;
  } else if (provider === '2embed') {
    return t === 'movie' ? `https://www.2embed.cc/embed/${id}` : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`;
  } else if (provider === 'vidlink') {
    return t === 'movie' ? `https://vidlink.pro/movie/${id}` : `https://vidlink.pro/tv/${id}/${s}/${e}`;
  }
  return `https://vidsrc.pro/embed/movie/${id}`;
}

function renderIframe() {
 if (!curPlaying) return;
 const {id, t, s, e} = curPlaying;
 const provider = $('#srcSelect').value;
 const subLang = $('#subSelect').value;
 const url = getEmbedUrl(provider, id, t, s, e, subLang);
 
 $('#pv').innerHTML = `<iframe id="mainIframe" src="${url}" allow="fullscreen; autoplay; picture-in-picture; encrypted-media; gyroscope; accelerometer" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>`;
}

function playStream(id,t,s=1,e=1,title=''){
 const sNum=parseInt(s,10),eNum=parseInt(e,10);
 curPlaying = {id,t,s:sNum,e:eNum,title};
 
 renderIframe();
 
 $('#pTitle').innerText = t === 'tv' ? `${title} - S${sNum} E${eNum}` : title;
 $('#tvBtns').style.display = t === 'tv' ? 'inline-flex' : 'none';
 
 if(t==='tv'){
   $('#pPrev').onclick=()=>playStream(id,t,sNum,Math.max(1,eNum-1),title);
   $('#pNext').onclick=()=>playStream(id,t,sNum,eNum+1,title);
 }
 $('#pl').classList.add('open');

 let cw=store.get('cw',[]);
 cw=[{id,t,s:sNum,e:eNum,title},...cw.filter(x=>x.id!==id)].slice(0,10);
 store.set('cw',cw);
}

$('#srcSelect').onchange = renderIframe;
$('#subSelect').onchange = renderIframe;
$('#pReload').onclick = renderIframe;

async function trailer(id,t,d){
 d=d||await api(`/${t}/${id}`,{append_to_response:'videos'});
 const v=(d.videos?.results||[]).filter(v=>v.site==='YouTube').sort((a,b)=>(b.type==='Trailer')-(a.type==='Trailer'))[0];
 if(!v)return alert('No trailer is available for this title.');
 $('#tvBtns').style.display='none';
 $('#pv').innerHTML=`<iframe id="mainIframe" src="https://www.youtube-nocookie.com/embed/${v.key}?autoplay=1&cc_load_policy=1&hl=en&rel=0" allow="fullscreen; autoplay; picture-in-picture; encrypted-media" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>`;
 $('#pl').classList.add('open')}

function closePlayer(){$('#pl').classList.remove('open');$('#pv').innerHTML=''}
$('#px').onclick=closePlayer;
addEventListener('keydown',e=>{
 if(e.key==='Escape'){closePlayer();$('#md').classList.remove('open')}
 if(e.target.id==='q'||e.target.id==='epSearch')return;
 if(curPlaying && curPlaying.t==='tv'){
   if(e.key==='N' || e.key==='n') $('#pNext').click();
   if(e.key==='P' || e.key==='p') $('#pPrev').click();
 }
});

function showGrid(items,msg){$('#hero').style.display='none';const a=$('#app');a.innerHTML='';
 if(!items.length){a.innerHTML=`<p class="empty">${msg}</p>`;return}
 const g=document.createElement('div');g.className='grid';items.forEach(i=>{const c=card(i,i.t);c&&g.append(c)});a.append(g)}

const GEN={movie:[['Action',28],['Adventure',12],['Animation',16],['Comedy',35],['Crime',80],['Documentary',99],['Drama',18],['Family',10751],['Fantasy',14],['Horror',27],['Mystery',9648],['Romance',10749],['Sci-Fi',878],['Thriller',53]],
tv:[['Action & Adventure',10759],['Anime','anime'],['Animation',16],['Comedy',35],['Crime',80],['Documentary',99],['Drama',18],['Family',10751],['Mystery',9648],['Sci-Fi & Fantasy',10765]]};

function browse(){
 $('#hero').style.display='none';
 $('#app').innerHTML=`<div class="filters"><select id="bt"><option value="movie">Movies</option><option value="tv">TV shows</option></select><select id="bg"></select><select id="bs"><option value="popularity.desc">Most popular</option><option value="vote_average.desc">Top rated</option><option value="new">Newest</option></select></div><div class="grid" id="bgrid" style="padding-top:14px"></div><p style="text-align:center;padding:20px"><button class="btn alt" id="bm">Load more</button></p>`;
 let page=1;
 const fill=()=>{$('#bg').innerHTML='<option value="">All genres</option>'+GEN[$('#bt'].value].map(([n,v])=>`<option value="${v}">${n}</option>`).join('')};
 const load=async reset=>{
  if(reset){page=1;$('#bgrid').innerHTML=''}
  const t=$('#bt').value,g=$('#bg').value,s=$('#bs').value;
  const p={page,sort_by:s==='new'?(t==='tv'?'first_air_date.desc':'primary_release_date.desc'):s,'vote_count.gte':s==='vote_average.desc'?300:s==='new'?20:0};
  if(s==='new')p[t==='tv'?'first_air_date.lte':'primary_release_date.lte']=new Date().toISOString().slice(0,10);
  if(g==='anime'){p.with_genres=16;p.with_original_language='ja'}else if(g)p.with_genres=g;
  const d=await api(`/discover/${t}`,p).catch(()=>({results:[]}));
  d.results.forEach(i=>{const c=card(i,t);c&&$('#bgrid').append(c)});page++};
 fill();load(true);
 $('#bt').onchange=()=>{fill();load(true)};$('#bg').onchange=$('#bs').onchange=()=>load(true);$('#bm').onclick=()=>load();
}

function free(){
 $('#hero').style.display='none';
 $('#app').innerHTML='<p class="meta" style="padding:100px 4vw 0;text-align:center">Full-length public-domain films from the Internet Archive.</p><div class="grid" id="fg" style="padding-top:14px"></div><p style="text-align:center;padding:20px"><button class="btn alt" id="fm">Load more</button></p>';
 let page=1;
 const load=async()=>{
  const d=await fetch('/api/free?page='+page++).then(r=>r.json()).catch(()=>[]);
  d.forEach(f=>{const b=document.createElement('button');b.className='card';
   b.innerHTML=`<img loading="lazy" alt="${esc(f.title)}" src="https://archive.org/services/img/${encodeURIComponent(f.id)}"><span class="t">${esc(f.title)}</span>`;
   b.onclick=()=>{$('#tvBtns').style.display='none';$('#pv').innerHTML=`<iframe id="mainIframe" src="https://archive.org/embed/${encodeURIComponent(f.id)}" allowfullscreen="true" allow="fullscreen"></iframe>`;$('#pl').classList.add('open')};
   $('#fg').append(b)})};
 load();$('#fm').onclick=load}

function myList(){
 const list=store.get('mylist',[]);
 showGrid(list,'Your list is empty. Add titles using the "+ My List" button.');
}

async function library(){
 $('#hero').style.display='none';const a=$('#app');a.innerHTML='<p class="empty">Scanning your library…</p>';
 const items=await fetch('/api/library').then(r=>r.json()).catch(()=>[]);
 if(!items.length){a.innerHTML='<p class="empty">Your library is empty. Add video files (.mp4, .webm) to your local media folder.</p>';return}
 const g=document.createElement('div');g.className='grid';a.innerHTML='';a.append(g);
 items.forEach(x=>{
   const b=document.createElement('button');b.className='card';
   b.innerHTML=`<span class="t" style="opacity:1">${esc(x.title||x.name)}</span>`;
   b.style.background='var(--line)';b.onclick=()=>playLib(x);
   g.append(b);
 });
}

function navTo(v){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='home')home();
 else if(v==='browse')browse();
 else if(v==='free')free();
 else if(v==='list')myList();
 else if(v==='lib')library();
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navTo(b.dataset.v));

let qTimer;
$('#q').oninput=e=>{
 clearTimeout(qTimer);
 const q=e.target.value.trim();
 if(!q){navTo('home');return}
 qTimer=setTimeout(async()=>{
   const d=await api('/search/multi',{query:q}).catch(()=>({results:[]}));
   showGrid(d.results.filter(i=>i.poster_path),'No results found for "'+esc(q)+'"');
 },300);
};

window.onscroll=()=>$('#hd').classList.toggle('solid',window.scrollY>20);

// Initialize home page
home();
</script>
</body>
</html>
