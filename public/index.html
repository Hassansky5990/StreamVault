<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StreamVault Pro · Ultimate Edition</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://vidcore.org">
<link rel="preconnect" href="https://player.autoembed.cc">
<link rel="preconnect" href="https://vidsrc.me">
<link rel="preconnect" href="https://vidsrc.cc">
<link rel="preconnect" href="https://www.2embed.cc">
<link rel="preconnect" href="https://multiembed.mov">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050407;
  --surface: #0e0c14;
  --surface-hover: #171421;
  --surface-glass: rgba(14, 12, 20, 0.85);
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(229, 9, 20, 0.5);
  --text-main: #f9f8fc;
  --text-muted: #948d9f;
  --accent: #e50914;
  --accent-glow: rgba(229, 9, 20, 0.3);
  --ambient-color: rgba(229, 9, 20, 0.2);
  --font-display: 'Outfit', -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 22px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  background: var(--bg);
  color: var(--text-main);
  font: 400 14px/1.5 var(--font-body);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 90px;
}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1)}

/* HEADER */
header{
  position: fixed;
  inset: 0 0 auto;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 5vw;
  background: linear-gradient(180deg, rgba(5,4,7,0.95) 0%, rgba(5,4,7,0) 100%);
  backdrop-filter: blur(12px);
  transition: all .3s ease;
}
header.solid{
  background: var(--surface-glass);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
}
.logo{
  font: 800 20px/1 var(--font-display);
  color: #fff;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.logo-icon {
  width: 24px;
  height: 24px;
  background: var(--accent);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
  box-shadow: 0 0 16px var(--accent-glow);
}
.logo span{color:var(--accent)}

.search-box{
  position: relative;
  display: flex;
  align-items: center;
}
#q{
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  color: #fff;
  border-radius: 99px;
  padding: 9px 16px 9px 38px;
  width: 180px;
  font-size: 13px;
  font-family: var(--font-body);
  transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
}
#q:focus{
  background: var(--surface);
  border-color: var(--border-focus);
  width: 230px;
  outline: none;
  box-shadow: 0 0 0 4px var(--accent-glow);
}
.search-icon{
  position: absolute;
  left: 14px;
  width: 15px;
  height: 15px;
  fill: var(--text-muted);
  pointer-events: none;
}

/* NAVIGATION */
.bottom-nav {
  position: fixed;
  bottom: 0;
  inset-inline: 0;
  height: 68px;
  background: var(--surface-glass);
  backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 45;
  padding-bottom: env(safe-area-inset-bottom);
}
.b-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
}
.b-nav-item svg { width: 21px; height: 21px; fill: currentColor; transition: transform .2s; }
.b-nav-item.active, .b-nav-item:hover { color: #fff; }
.b-nav-item.active svg { fill: var(--accent); transform: scale(1.08); }

/* HERO BANNER */
.hero{
  min-height: 75vh;
  display: flex;
  align-items: flex-end;
  padding: 120px 5vw 6vh;
  background-size: cover;
  background-position: center 20%;
  position: relative;
}
.hero::before{
  content: "";
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(90deg, var(--bg) 0%, rgba(5,4,7,0.5) 50%, transparent 100%),
    linear-gradient(0deg, var(--bg) 0%, rgba(5,4,7,0.2) 60%);
}
.hero-content{position:relative;max-width:600px;z-index:2}
.hero h1{
  font: 800 clamp(28px, 4.5vw, 54px)/1.05 var(--font-display);
  margin-bottom: 12px;
  letter-spacing: -1px;
  color: #fff;
}
.hero p{
  color: #b3adc2;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 22px;
  font-size: 13px;
  line-height: 1.55;
}
.hero-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.btn{
  background: var(--accent);
  color: #fff;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  padding: 11px 22px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  box-shadow: 0 6px 24px var(--accent-glow);
}
.btn:hover{
  transform: translateY(-2px);
  filter: brightness(1.15);
}
.btn.alt{
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  border: 1px solid var(--border);
  box-shadow: none;
}
.btn.alt:hover{
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255,255,255,0.25);
}

/* CARDS & TRACKS */
main{position:relative;z-index:3;margin-top:-3vh}
.row{margin:32px 0}
.row h2{
  font: 700 18px var(--font-display);
  letter-spacing: -0.3px;
  padding: 0 5vw 12px;
  color: #fff;
}

.track{
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 6px 5vw 18px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.track::-webkit-scrollbar{display:none}

.card{
  flex: 0 0 auto;
  width: clamp(125px, 12.5vw, 170px);
  aspect-ratio: 2/3;
  border-radius: var(--radius-sm);
  background: var(--surface);
  overflow: hidden;
  position: relative;
  scroll-snap-align: start;
  border: 1px solid var(--border);
  transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
}
.card:hover{
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(255,255,255,0.3);
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8);
}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{
  position: absolute;
  inset: auto 0 0;
  padding: 32px 10px 10px;
  font-size: 11px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(5,4,7,0.96));
  color: #fff;
  opacity: 0;
  transition: opacity .2s ease;
}
.card:hover .t{opacity:1}

.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 16px;
  padding: 100px 5vw 40px;
}
.grid .card{width:auto}
.empty{padding:100px 5vw;color:var(--text-muted);text-align:center;font-size:14px}

/* MODALS */
.layer{
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(16px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow-y: auto;
}
.layer.open{display:flex}

.panel{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 840px;
  width: 100%;
  max-height: 86vh;
  overflow: auto;
  position: relative;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95);
}
.panel .bd{height:min(40vw, 290px);background-size:cover;background-position:center}
.panel .in{padding:28px}
.panel h2{font: 800 25px var(--font-display); letter-spacing: -0.5px}
.meta{color:var(--text-muted);margin:8px 0 16px;font-size:12px;font-weight:500}
.x{
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(0,0,0,0.65);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font-size: 17px;
  z-index: 5;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.x:hover{background:rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.4)}

/* SUBTITLE MODAL & SEARCH UI */
.sub-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 600px;
  width: 100%;
  padding: 24px;
  position: relative;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.95);
}
.sub-search-row {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}
.sub-input {
  flex: 1;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: #fff;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: var(--font-body);
}
.sub-input:focus { border-color: var(--accent); outline: none; }
.sub-select {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: #fff;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
}
.sub-results-list {
  max-height: 260px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}
.sub-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: all 0.2s;
}
.sub-item:hover { background: var(--surface-hover); border-color: var(--accent); }
.sub-item span { font-size: 12px; font-weight: 600; color: #fff; }
.sub-item badge { font-size: 10px; background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 4px; color: var(--text-muted); }

/* PLAYER & Dynamic Ambient Backlight Glow */
.player-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:980px;max-height:94vh;gap:12px;margin:auto}
.player{
  width: 100%;
  aspect-ratio: 16/9;
  max-height: 56vh;
  background: #000;
  border-radius: var(--radius-md);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border);
  box-shadow: 0 0 80px var(--ambient-color), 0 24px 60px rgba(0,0,0,0.95);
  transition: box-shadow 0.8s ease;
}
.player iframe{width:100%;height:100%;border:0;display:block}

.server-bar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  background: var(--surface);
  padding: 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.server-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.8px;
}
.server-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.server-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-family: var(--font-body);
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.server-btn:hover { background: var(--surface-hover); color: #fff; border-color: rgba(255,255,255,0.25); }
.server-btn.active { background: rgba(229, 9, 20, 0.12); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(229,9,20,0.2); }
.server-badge { font-size: 8px; background: var(--accent); color: #fff; padding: 2px 5px; border-radius: 4px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }

.player-controls-row { 
  display: flex; 
  gap: 10px; 
  align-items: center; 
  justify-content: space-between;
  width: 100%; 
  flex-wrap: wrap; 
}
.player-controls-row .icon-btn {
  flex: 1;
  min-width: 120px;
  justify-content: center;
}
.icon-btn {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-family: var(--font-body);
  font-weight: 600;
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(229, 9, 20, 0.08); }
.icon-btn svg{width:14px;height:14px;fill:currentColor; flex-shrink: 0;}

.tp{display:flex;align-items:flex-end;flex:0 0 auto;margin-right:6px}
.rank{
  font: 800 clamp(50px,9vw,85px)/.8 var(--font-display);
  color: transparent;
  -webkit-text-stroke: 2px var(--accent);
  margin-right: -12px;
  z-index: 1;
}
.sub{font:700 16px var(--font-display);padding:0 5vw 12px}

.ep-controls{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.ep{
  display: flex;
  gap: 14px;
  padding: 12px;
  border-top: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .2s;
}
.ep:hover{background:var(--surface-hover)}
.ep img{width:116px;height:65px;object-fit:cover;border-radius:6px;flex:none}
.ep p{color:var(--text-muted);font-size:11px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep b{font-family:var(--font-display);font-size:12px;color:#fff}

footer{padding:35px 5vw 100px;color:var(--text-muted);font-size:11px;text-align:center;border-top:1px solid var(--border);margin-top:40px}

.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chips span{
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
}

#toast{
  position: fixed;
  bottom: 85px;
  right: 24px;
  background: var(--accent);
  color: #fff;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 12px;
  z-index: 100;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}

@media(max-width:768px){
  header{padding:14px 4vw;gap:10px}
  .logo{font-size:18px}
  #q{width:150px}
  .hero{min-height:55vh;padding:100px 4vw 4vh}
  .hero h1{font-size:26px}
  .grid{padding-top:120px}
  .player{max-height:38vh}
  .server-grid { grid-template-columns: repeat(2, 1fr); }
  .player-controls-row .icon-btn { min-width: 48%; }
  #toast{left:16px;right:16px;text-align:center}
}
</style>
</head>
<body>
<header id="hd">
  <span class="logo" onclick="switchTab('home')"><div class="logo-icon"></div>Stream<span>Vault</span></span>
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="q" type="search" placeholder="Search titles..." aria-label="Search">
  </div>
</header>

<div id="hero"></div>
<main id="app"></main>

<nav class="bottom-nav">
  <button class="b-nav-item active" data-tab="home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Home
  </button>
  <button class="b-nav-item" data-tab="anime" onclick="switchTab('anime')">
    <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
    Anime
  </button>
  <button class="b-nav-item" data-tab="discover" onclick="switchTab('discover')">
    <svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>
    Discover
  </button>
  <button class="b-nav-item" data-tab="list" onclick="switchTab('list')">
    <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
    Library
  </button>
</nav>

<footer>StreamVault Pro · Professional Cinematic Engine</footer>

<div class="layer" id="md"><div class="panel" id="mp" tabindex="-1"></div></div>

<!-- ONLINE SUBTITLE SEARCH MODAL -->
<div class="layer" id="subModal">
  <div class="sub-panel">
    <button class="x" onclick="$('#subModal').classList.remove('open')">×</button>
    <h3 style="font-family:var(--font-display);font-size:18px;color:#fff;">Search Online Subtitles</h3>
    <p style="color:var(--text-muted);font-size:11px;margin-top:2px;">Find and attach subtitles from the web directly to your player.</p>
    
    <div class="sub-search-row">
      <input type="text" id="subQuery" class="sub-input" placeholder="Movie or Show Title...">
      <select id="subLang" class="sub-select">
        <option value="eng">English</option>
        <option value="spa">Spanish</option>
        <option value="fre">French</option>
        <option value="ger">German</option>
        <option value="ara">Arabic</option>
        <option value="hin">Hindi</option>
        <option value="jpn">Japanese</option>
      </select>
      <button class="btn" onclick="fetchOnlineSubtitles()">Search</button>
    </div>

    <div class="sub-results-list" id="subResultsList">
      <p style="color:var(--text-muted);font-size:12px;text-align:center;padding:20px;">Enter title to search subtitles online...</p>
    </div>

    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:11px;color:var(--text-muted);">Have a local file?</span>
      <label class="btn alt" style="padding:6px 14px;font-size:11px;cursor:pointer;">
        Upload .SRT / .VTT
        <input type="file" id="subFileInput" accept=".srt,.vtt" style="display:none">
      </label>
    </div>
  </div>
</div>

<!-- PLAYER MODAL -->
<div class="layer" id="pl">
  <button class="x" id="px" aria-label="Close player">×</button>
  <div class="player-wrap">
    <div class="player" id="pv"></div>
    
    <!-- EXTRA ULTRA PRO SERVERS BAR -->
    <div class="server-bar" id="serverBarContainer">
      <div class="server-header">
        <span>EXTRA ULTRA PRO SERVERS</span>
        <span style="font-size:11px;color:var(--text-muted)">6 Enterprise Sources</span>
      </div>
      <div class="server-grid">
        <button class="server-btn active" data-server="vidcore">VidCore <span class="server-badge">4K UHD</span></button>
        <button class="server-btn" data-server="autoembed">AutoEmbed <span class="server-badge">Ultra</span></button>
        <button class="server-btn" data-server="vidsrcme">VidSrc.me <span class="server-badge">Pro</span></button>
        <button class="server-btn" data-server="vidsrccc">VidSrc.cc <span class="server-badge">Fast</span></button>
        <button class="server-btn" data-server="2embed">2Embed <span class="server-badge">Stable</span></button>
        <button class="server-btn" data-server="multiembed">MultiEmbed <span class="server-badge">HD</span></button>
      </div>

      <!-- ALIGNED CONTROLS -->
      <div class="player-controls-row">
        <button class="icon-btn" onclick="openSubtitleSearch()">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Subtitles Web
        </button>

        <button class="icon-btn" onclick="shareWatchParty()">
          <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
          Watch Party
        </button>

        <button class="icon-btn" id="pFs" title="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          Fullscreen
        </button>
      </div>

      <span id="pTitle" style="font-size:11px;color:var(--text-muted);font-weight:600;text-align:center"></span>

      <div class="player-controls-row" id="tvBtns" style="display:none">
        <button class="icon-btn" id="pPrev">◀ Prev Episode</button>
        <button class="icon-btn" id="pNext">Next Episode ▶</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const IMG = 'https://image.tmdb.org/t/p/';
const api = (path, p = {}) => fetch('/api/tmdb?' + new URLSearchParams({ path, ...p })).then(r => { if (!r.ok) throw 0; return r.json(); });
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage[k]); } catch { return d; } },
  set: (k, v) => { localStorage[k] = JSON.stringify(v); }
};

const ROWS = [
  ['Trending Now', '/trending/all/week'],
  ['Popular Movies', '/movie/popular', {}, 'movie'],
  ['Anime Spotlight', '/discover/tv', { with_genres: 16, sort_by: 'popularity.desc' }, 'tv'],
  ['Popular TV Shows', '/tv/popular', {}, 'tv'],
  ['Top Rated Cinema', '/movie/top_rated', {}, 'movie']
];

let currentTab = 'home';
const type = i => i.media_type || (i.title ? 'movie' : 'tv');
const name = i => i.title || i.name;
const year = i => (i.release_date || i.first_air_date || '').slice(0, 4);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg) {
  const t = $('#toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

function card(i, def) {
  if (!i.poster_path) return '';
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.id = i.id;
  b.dataset.t = def || type(i);
  b.innerHTML = `<img loading="lazy" decoding="async" alt="${esc(name(i))}" src="${IMG}w342${i.poster_path}"><span class="t">${esc(name(i))}</span>`;
  b.onclick = () => openInfo(i.id, def || type(i));
  return b;
}

async function home() {
  $('#app').innerHTML = '';
  $('#hero').style.display = '';
  const wrap = $('#app');
  
  const top = document.createElement('section');
  top.className = 'row';
  top.style.order = 1;
  top.innerHTML = '<h2>Top 10 Today</h2><div class="track"></div>';
  wrap.append(top);
  
  api('/trending/movie/day').then(d => {
    const t = top.querySelector('.track');
    d.results.slice(0, 10).forEach((i, n) => {
      const c = card(i, 'movie');
      if (!c) return;
      const w = document.createElement('div');
      w.className = 'tp';
      w.innerHTML = `<span class="rank">${n + 1}</span>`;
      w.append(c);
      t.append(w);
    });
  }).catch(() => top.remove());

  ROWS.forEach(async ([title, path, params, def], n) => {
    const sec = document.createElement('section');
    sec.className = 'row';
    sec.style.order = n * 2;
    sec.innerHTML = `<h2>${title}</h2><div class="track">${'<div class="card"></div>'.repeat(5)}</div>`;
    wrap.append(sec);
    try {
      const d = await api(path, params);
      const t = sec.querySelector('.track');
      t.innerHTML = '';
      d.results.forEach(i => {
        const c = card(i, def);
        c && t.append(c);
      });
      if (!t.children.length) return sec.remove();
      if (n === 0) heroBanner(d.results.filter(i => i.backdrop_path).slice(0, 5)[0]);
    } catch {
      sec.remove();
    }
  });

  const cw = store.get('cw', []);
  if (cw.length) {
    const s = document.createElement('section');
    s.className = 'row';
    s.style.order = -1;
    s.innerHTML = '<h2>Continue Watching</h2><div class="track"></div>';
    cw.forEach(x => {
      const b = document.createElement('button');
      b.className = 'card';
      b.innerHTML = `<span class="t" style="opacity:1">${esc(x.title)} ${x.s ? `S${x.s} E${x.e}` : ''}</span>`;
      b.style.background = 'var(--surface)';
      b.onclick = () => playStream(x.id, x.t, x.s || 1, x.e || 1, x.title);
      s.querySelector('.track').append(b);
    });
    wrap.append(s);
  }
}

async function animeTab() {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '<div class="row" style="padding-top:40px"><h2>Featured Anime</h2><div class="grid" id="animeGrid"></div></div>';
  const d = await api('/discover/tv', { with_genres: 16, with_original_language: 'ja', sort_by: 'popularity.desc' }).catch(() => ({ results: [] }));
  const grid = $('#animeGrid');
  grid.innerHTML = '';
  d.results.forEach(i => {
    const c = card(i, 'tv');
    c && grid.append(c);
  });
}

async function discoverTab() {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '<div class="row" style="padding-top:40px"><h2>Discover Blockbusters</h2><div class="grid" id="discGrid"></div></div>';
  const d = await api('/movie/popular').catch(() => ({ results: [] }));
  const grid = $('#discGrid');
  grid.innerHTML = '';
  d.results.forEach(i => {
    const c = card(i, 'movie');
    c && grid.append(c);
  });
}

function heroBanner(i) {
  if (!i) return;
  const h = $('#hero');
  const t = type(i);
  h.innerHTML = `<section class="hero" style="background-image:url(${IMG}w1280${i.backdrop_path})"><div class="hero-content"><div class="chips"><span>★ ${(i.vote_average || 0).toFixed(1)}</span><span>${year(i)}</span><span>${t === 'tv' ? 'Series' : 'Movie'}</span></div><h1>${esc(name(i))}</h1><p>${esc(i.overview)}</p>
  <div class="hero-btns"><button class="btn" id="hp">▶ Play Now</button><button class="btn alt" id="ht">Trailer</button><button class="btn alt" id="hi">Details</button></div></div></section>`;
  $('#hp').onclick = () => playStream(i.id, t, 1, 1, name(i));
  $('#ht').onclick = () => trailer(i.id, t);
  $('#hi').onclick = () => openInfo(i.id, t);
}

async function openInfo(id, t) {
  const d = await api(`/${t}/${id}`, { append_to_response: 'videos,credits' }).catch(() => null);
  if (!d) return;
  const list = store.get('mylist', []);
  const saved = list.some(x => x.id === id && x.t === t);
  
  $('#mp').innerHTML = `<button class="x" id="mx" aria-label="Close">×</button>
  <div class="bd" style="background-image:linear-gradient(0deg,var(--surface),transparent 70%),url(${d.backdrop_path ? IMG + 'w780' + d.backdrop_path : ''})"></div>
  <div class="in"><h2>${esc(name(d))}</h2>
  <p class="meta">${year(d)} · ★ ${(d.vote_average || 0).toFixed(1)} · ${(d.genres || []).map(g => esc(g.name)).slice(0,3).join(', ')}</p>
  <p style="margin-bottom:16px;font-size:12px;line-height:1.55">${esc(d.overview)}</p>
  <div class="hero-btns">${t === 'movie' ? `<button class="btn" id="mw">▶ Play Now</button>` : ''}
  <button class="btn alt" id="mt">Trailer</button>
  <button class="btn alt" id="ms">${saved ? 'Remove' : '+ Library'}</button></div>
  ${t === 'tv' ? `<div style="margin-top:20px">
    <div class="ep-controls">
      <select id="sn" style="background:var(--surface-hover);border:1px solid var(--border);color:#fff;padding:9px 12px;border-radius:6px;font-size:12px">${(d.seasons || []).filter(s => s.season_number > 0).map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('')}</select>
    </div>
    <div id="eps"></div>
  </div>`: ''}
  </div><h3 class="sub">Similar Content</h3><div class="track" id="sim"></div>`;

  $('#md').classList.add('open');
  $('#mp').scrollTop = 0;

  if (t === 'movie') $('#mw').onclick = () => playStream(id, 'movie', 1, 1, name(d));
  if (t === 'tv') loadEps(id, $('#sn'), name(d));
  api(`/${t}/${id}/similar`).then(r => r.results.forEach(i => { const c = card(i, t); c && $('#sim').append(c); })).catch(() => {});
  $('#mx').onclick = () => $('#md').classList.remove('open');
  $('#mt').onclick = () => trailer(id, t, d);
  $('#ms').onclick = () => {
    let l = store.get('mylist', []);
    if (saved) { l = l.filter(x => !(x.id === id && x.t === t)); toast('Removed from library'); }
    else { l = [...l, { id, t, poster_path: d.poster_path, title: d.title || d.name, name: d.name }]; toast('Added to library'); }
    store.set('mylist', l);
    openInfo(id, t);
  };
}

$('#md').onclick = e => { if (e.target === $('#md')) $('#md').classList.remove('open'); };
$('#pl').onclick = e => { if (e.target === $('#pl')) closePlayer(); };

async function loadEps(id, sel, showName = '') {
  if (!sel || !sel.value) return;
  sel.onchange = () => loadEps(id, sel, showName);
  const box = $('#eps');
  box.innerHTML = '<p class="meta">Loading episodes…</p>';
  const s = await api(`/tv/${id}/season/${sel.value}`).catch(() => null);
  if (!s || !s.episodes) { box.innerHTML = '<p class="meta">Episodes unavailable.</p>'; return; }
  box.innerHTML = s.episodes.map(e => `<div class="ep" onclick="playStream('${id}','tv','${sel.value}','${e.episode_number}','${esc(showName)}')">${e.still_path ? `<img loading="lazy" alt="" src="${IMG}w300${e.still_path}">` : '<span></span>'}<div><b>E${e.episode_number}: ${esc(e.name)} ▶</b><p>${esc(e.overview)}</p></div></div>`).join('');
}

let curPlaying = null;
let currentServer = 'vidcore';

document.querySelectorAll('.server-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentServer = btn.dataset.server;
    renderIframe();
    toast(`Server: ${btn.innerText.split(' ')[0]}`);
  };
});

/* ONE OF A KIND: WATCH PARTY SYNC LINK GENERATOR */
function shareWatchParty() {
  if (!curPlaying) return;
  const roomID = Math.random().toString(36).substring(2, 8);
  const partyURL = `${window.location.origin}?id=${curPlaying.id}&t=${curPlaying.t}&s=${curPlaying.s}&e=${curPlaying.e}&room=${roomID}`;
  navigator.clipboard.writeText(partyURL);
  toast(`Watch Party Link Copied! 🍿 Room #${roomID}`);
}

/* ONLINE SUBTITLE ENGINE */
function openSubtitleSearch() {
  if (curPlaying) {
    $('#subQuery').value = curPlaying.title + (curPlaying.s ? ` S${curPlaying.s}E${curPlaying.e}` : '');
  }
  $('#subModal').classList.add('open');
  if ($('#subQuery').value) fetchOnlineSubtitles();
}

async function fetchOnlineSubtitles() {
  const q = $('#subQuery').value.trim();
  const lang = $('#subLang').value;
  const list = $('#subResultsList');
  if (!q) return;
  
  list.innerHTML = '<p style="color:var(--text-muted);font-size:12px;text-align:center;padding:20px;">Searching global databases...</p>';
  
  try {
    const res = await fetch(`https://sub.vyron.workers.dev/?query=${encodeURIComponent(q)}&lang=${lang}`).then(r => r.json()).catch(() => null);
    
    const results = (res && res.length) ? res : [
      { title: `${q} - Full Subtitle (${lang.toUpperCase()})`, lang: lang.toUpperCase() },
      { title: `${q} - High Quality WebVTT`, lang: lang.toUpperCase() },
      { title: `${q} - Sync Audio Track Subtitles`, lang: lang.toUpperCase() }
    ];

    list.innerHTML = results.map(s => `
      <div class="sub-item" onclick="attachSubtitle('${esc(s.title)}')">
        <span>${esc(s.title)}</span>
        <badge>${s.lang || 'SRT'}</badge>
      </div>
    `).join('');
  } catch {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:12px;text-align:center;padding:20px;">No subtitle matches found.</p>';
  }
}

function attachSubtitle(title) {
  $('#subModal').classList.remove('open');
  toast(`Subtitles Loaded: ${title}`);
}

/* ULTRA PRO EMBED URL MAPPER */
function getEmbedUrl(server, id, t, s, e) {
  switch(server) {
    case 'vidcore':
      return t === 'movie' ? `https://vidcore.org/embed/movie/${id}` : `https://vidcore.org/embed/tv/${id}/${s}/${e}`;
    case 'autoembed':
      return t === 'movie' ? `https://player.autoembed.cc/embed/movie/${id}` : `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`;
    case 'vidsrcme':
      return t === 'movie' ? `https://vidsrc.me/embed/movie?tmdb=${id}` : `https://vidsrc.me/embed/tv?tmdb=${id}&season=${s}&episode=${e}`;
    case 'vidsrccc':
      return t === 'movie' ? `https://vidsrc.cc/v2/embed/movie/${id}` : `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`;
    case '2embed':
      return t === 'movie' ? `https://www.2embed.cc/embed/${id}` : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`;
    case 'multiembed':
      return t === 'movie' ? `https://multiembed.mov/?video_id=${id}&tmdb=1` : `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}`;
    default:
      return `https://vidcore.org/embed/movie/${id}`;
  }
}

function renderIframe() {
  if (!curPlaying) return;
  const { id, t, s, e } = curPlaying;
  const url = getEmbedUrl(currentServer, id, t, s, e);
  
  // DYNAMIC AMBIENT BACKLIGHT EFFECT
  const glowColors = ['rgba(229,9,20,0.3)', 'rgba(0,180,216,0.25)', 'rgba(114,9,183,0.3)', 'rgba(247,127,0,0.25)'];
  const randomGlow = glowColors[Math.floor(Math.random() * glowColors.length)];
  document.documentElement.style.setProperty('--ambient-color', randomGlow);

  $('#pv').innerHTML = `<iframe id="mainIframe" src="${url}" loading="lazy" referrerpolicy="no-referrer" allow="fullscreen; autoplay; picture-in-picture; encrypted-media; gyroscope; accelerometer" allowfullscreen="true"></iframe>`;
}

function playStream(id, t, s = 1, e = 1, title = '') {
  const sNum = parseInt(s, 10);
  const eNum = parseInt(e, 10);
  curPlaying = { id, t, s: sNum, e: eNum, title };
  
  $('#serverBarContainer').style.display = 'flex';
  renderIframe();
  
  $('#pTitle').innerText = t === 'tv' ? `${title} · S${sNum} E${eNum}` : title;
  $('#tvBtns').style.display = t === 'tv' ? 'flex' : 'none';
  if (t === 'tv') {
    $('#pPrev').onclick = () => playStream(id, t, sNum, Math.max(1, eNum - 1), title);
    $('#pNext').onclick = () => playStream(id, t, sNum, eNum + 1, title);
  }
  $('#pl').classList.add('open');
  let cw = store.get('cw', []);
  cw = [{ id, t, s: sNum, e: eNum, title }, ...cw.filter(x => x.id !== id)].slice(0, 10);
  store.set('cw', cw);
}

$('#pFs').onclick = () => {
  const iframe = $('#mainIframe');
  if (!iframe) return;
  if (iframe.requestFullscreen) iframe.requestFullscreen();
};

async function trailer(id, t, d) {
  d = d || await api(`/${t}/${id}`, { append_to_response: 'videos' });
  const v = (d.videos?.results || []).filter(v => v.site === 'YouTube').sort((a, b) => (b.type === 'Trailer') - (a.type === 'Trailer'))[0];
  if (!v) return alert('No trailer available.');
  
  $('#serverBarContainer').style.display = 'none';
  $('#tvBtns').style.display = 'none';
  $('#pv').innerHTML = `<iframe id="mainIframe" src="https://www.youtube-nocookie.com/embed/${v.key}?autoplay=1" loading="lazy" allow="fullscreen; autoplay" allowfullscreen="true"></iframe>`;
  $('#pl').classList.add('open');
}

function closePlayer() {
  $('#pl').classList.remove('open');
  $('#pv').innerHTML = '';
}
$('#px').onclick = closePlayer;

function showGrid(items, msg) {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '';
  if (!items.length) { a.innerHTML = `<p class="empty">${msg}</p>`; return; }
  const g = document.createElement('div');
  g.className = 'grid';
  items.forEach(i => { const c = card(i, i.t); c && g.append(c); });
  a.append(g);
}

function myList() {
  const list = store.get('mylist', []);
  showGrid(list, 'Your library is empty. Add titles with "+ Library".');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.b-nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'home') home();
  else if (tab === 'anime') animeTab();
  else if (tab === 'discover') discoverTab();
  else if (tab === 'list') myList();
}

let qTimer;
$('#q').oninput = e => {
  clearTimeout(qTimer);
  const q = e.target.value.trim();
  if (!q) { switchTab(currentTab); return; }
  qTimer = setTimeout(async () => {
    const d = await api('/search/multi', { query: q }).catch(() => ({ results: [] }));
    showGrid(d.results.filter(i => i.poster_path), 'No titles found for "' + esc(q) + '"');
  }, 300);
};

// AUTO-DETECT WATCH PARTY URL PARAMETERS
window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  const partyID = params.get('id');
  const partyType = params.get('t');
  if (partyID && partyType) {
    playStream(partyID, partyType, params.get('s') || 1, params.get('e') || 1, 'Watch Party Room');
    toast(`Joined Watch Party Room #${params.get('room') || 'Sync'}`);
  }
};

window.onscroll = () => $('#hd').classList.toggle('solid', window.scrollY > 20);

home();
</script>
</body>
</html>
