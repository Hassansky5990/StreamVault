<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StreamVault // Sci-Fi Cinema Hub</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05040a;
  --panel: rgba(15, 12, 28, 0.75);
  --panel-solid: #0d0a1a;
  --line: rgba(0, 240, 255, 0.15);
  --line-active: rgba(0, 240, 255, 0.6);
  --text: #f0f6ff;
  --mute: #8a81a8;
  --neon-cyan: #00f0ff;
  --neon-purple: #9d4edd;
  --neon-gold: #ffbe0b;
  --cyan-glow: rgba(0, 240, 255, 0.3);
  --purple-glow: rgba(157, 78, 221, 0.4);
  --font-hud: 'Orbitron', system-ui, sans-serif;
  --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background: radial-gradient(circle at 50% -20%, #1a0b36 0%, var(--bg) 80%);
  color: var(--text);
  font: 400 14px/1.6 var(--font-sans);
  overflow-x: hidden;
  min-height: 100vh;
}

/* FUTURISTIC SCANLINE & GLOW EFFECTS */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
  background-size: 100% 3px, 6px 100%;
  pointer-events: none;
  z-index: 99;
  opacity: 0.6;
}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:all 0.25s cubic-bezier(0.16, 1, 0.3, 1)}

/* HEADER & NAVIGATION */
header{
  position: fixed;
  inset: 0 0 auto;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 5vw;
  background: rgba(5, 4, 10, 0.4);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  transition: all .3s;
}
header.solid{
  background: rgba(5, 4, 10, 0.92);
  border-bottom-color: var(--line-active);
  box-shadow: 0 4px 30px rgba(0, 240, 255, 0.1);
}
.logo{
  font: 900 20px/1 var(--font-hud);
  color: var(--neon-cyan);
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 0 12px var(--cyan-glow);
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo::before{
  content: "◆";
  font-size: 12px;
  color: var(--neon-gold);
}

nav{display:flex;gap:12px;align-items:center}
nav button{
  color: var(--mute);
  padding: 6px 12px;
  font-family: var(--font-hud);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-radius: 6px;
  border: 1px solid transparent;
}
nav button.on, nav button:hover{
  color: var(--neon-cyan);
  background: rgba(0, 240, 255, 0.08);
  border-color: var(--line-active);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
}

#q{
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 16px;
  width: 220px;
  font-size: 12px;
  font-family: var(--font-sans);
  transition: all .3s;
}
#q:focus{
  border-color: var(--neon-cyan);
  box-shadow: 0 0 15px var(--cyan-glow);
  outline: none;
}

/* HERO SECTION */
.hero{
  min-height: 72vh;
  display: flex;
  align-items: flex-end;
  padding: 110px 5vw 6vh;
  background-size: cover;
  background-position: center top;
  position: relative;
}
.hero::before{
  content: "";
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(90deg, var(--bg) 15%, rgba(5,4,10,0.6) 60%, transparent 100%),
    linear-gradient(0deg, var(--bg) 5%, transparent 60%);
}
.hero>div{position:relative;max-width:600px;z-index:2}
.hero h1{
  font: 800 clamp(28px, 5vw, 54px)/1.05 var(--font-hud);
  margin-bottom: 12px;
  letter-spacing: -0.5px;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 30%, var(--neon-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 12px rgba(0,240,255,0.3));
}
.hero p{
  color: var(--mute);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 22px;
  font-size: 13px;
}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}

.btn{
  background: linear-gradient(135deg, var(--neon-cyan), #00a8ff);
  color: #030814;
  font-family: var(--font-hud);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 12px 24px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  box-shadow: 0 0 20px var(--cyan-glow);
}
.btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
}
.btn.alt{
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  box-shadow: none;
}
.btn.alt:hover{
  border-color: var(--neon-purple);
  box-shadow: 0 0 20px var(--purple-glow);
  color: #ffffff;
}

/* CONTENT ROWS & CYBER CARDS */
main{padding-bottom:80px;position:relative;z-index:3;margin-top:-3vh}
.row{margin:28px 0}
.row h2{
  font: 700 16px var(--font-hud);
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 0 5vw 12px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}
.row h2::before{
  content: "";
  width: 4px;
  height: 16px;
  background: var(--neon-cyan);
  box-shadow: 0 0 10px var(--neon-cyan);
}

.track{
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 8px 5vw 20px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.track::-webkit-scrollbar{display:none}

.card{
  flex: 0 0 auto;
  width: clamp(125px, 14vw, 180px);
  aspect-ratio: 2/3;
  border-radius: 10px;
  background: var(--panel);
  overflow: hidden;
  position: relative;
  scroll-snap-align: start;
  border: 1px solid var(--line);
  transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
}
.card:hover{
  transform: translateY(-6px) scale(1.03);
  border-color: var(--neon-cyan);
  box-shadow: 0 10px 30px rgba(0, 240, 255, 0.25);
}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{
  position: absolute;
  inset: auto 0 0;
  padding: 24px 8px 8px;
  font-size: 11px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(5,4,10,0.95));
  color: var(--text);
  opacity: 0;
  transition: opacity .2s;
}
.card:hover .t{opacity:1}

.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
  padding: 120px 5vw 0;
}
.grid .card{width:auto}
.empty{padding:120px 5vw;color:var(--mute);text-align:center;font-family:var(--font-hud)}

/* MODALS & PLAYER CONTAINER */
.layer{
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(3, 2, 8, 0.94);
  backdrop-filter: blur(16px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}
.layer.open{display:flex}

.panel{
  background: var(--panel-solid);
  border: 1px solid var(--line-active);
  border-radius: 14px;
  max-width: 860px;
  width: 100%;
  max-height: 88vh;
  overflow: auto;
  position: relative;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 240, 255, 0.15);
}
.panel .bd{height:min(42vw, 300px);background-size:cover;background-position:center}
.panel .in{padding:24px 28px}
.panel h2{font: 800 24px var(--font-hud); letter-spacing: 0.5px}
.meta{color:var(--mute);margin:6px 0 14px;font-size:12px;font-family:var(--font-hud)}
.x{
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.7);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  font-size: 18px;
  z-index: 5;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
}
.x:hover{border-color:var(--neon-cyan);color:var(--neon-cyan)}

/* PLAYER & CONTROL BAR */
.player-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:1000px;max-height:94vh;gap:8px;margin:auto}
.player{
  width: 100%;
  aspect-ratio: 16/9;
  max-height: 56vh;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--line-active);
  box-shadow: 0 16px 40px rgba(0,0,0,0.9), 0 0 20px rgba(0,240,255,0.1);
}
.player iframe{width:100%;height:100%;border:0;display:block}

.player-bar{
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  background: var(--panel-solid);
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
}
.player-row{display:flex;gap:8px;width:100%;align-items:center;flex-wrap:wrap}

.icon-btn, select{
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-family: var(--font-hud);
  font-weight: 700;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.icon-btn:hover, select:focus{
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  box-shadow: 0 0 12px var(--cyan-glow);
}
.icon-btn svg{width:14px;height:14px;fill:currentColor}
select{flex:1;outline:none}
input[type="file"]{display:none}

.tp{display:flex;align-items:flex-end;flex:0 0 auto;margin-right:6px}
.rank{
  font: 800 clamp(50px,9vw,90px)/.8 var(--font-hud);
  color: transparent;
  -webkit-text-stroke: 2px var(--neon-cyan);
  margin-right: -12px;
  z-index: 1;
  filter: drop-shadow(0 0 8px var(--cyan-glow));
}
.sub{font:700 15px var(--font-hud);padding:0 5vw 8px}

.ep-controls{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.ep{
  display: flex;
  gap: 12px;
  padding: 10px;
  border-top: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  transition: background .2s;
}
.ep:hover{background:rgba(0,240,255,0.05)}
.ep img{width:110px;height:62px;object-fit:cover;border-radius:6px;flex:none}
.ep p{color:var(--mute);font-size:11px;margin-top:2px}
.ep b{font-family:var(--font-hud);font-size:12px}

footer{padding:30px 5vw;color:var(--mute);font-size:11px;font-family:var(--font-hud);text-align:center;border-top:1px solid var(--line);margin-top:40px}

.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chips span{
  background: rgba(0, 240, 255, 0.08);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 10px;
  font-family: var(--font-hud);
  color: var(--neon-cyan);
}

#toast{
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--neon-cyan);
  color: #030814;
  padding: 10px 20px;
  border-radius: 6px;
  font-family: var(--font-hud);
  font-size: 11px;
  font-weight: 800;
  z-index: 100;
  display: none;
  box-shadow: 0 0 20px var(--cyan-glow);
}

/* MOBILE RESPONSIVE UI ADJUSTMENTS */
@media(max-width:640px){
  header{padding:10px 4vw;gap:10px;flex-wrap:wrap}
  .logo{font-size:18px}
  #q{order:3;width:100%;min-width:100%;margin-top:2px}
  nav{order:2;gap:8px;overflow-x:auto;width:auto}
  nav button{font-size:10px;padding:4px 8px}
  .hero{min-height:55vh;padding:100px 4vw 4vh}
  .hero h1{font-size:26px}
  .grid{padding-top:130px}
  .player{max-height:42vh}
  .player-bar{padding:8px}
  .icon-btn, select{font-size:10px;padding:6px 8px;flex:1;justify-content:center}
  .layer{padding:8px}
  #toast{left:20px;right:20px;max-width:none;text-align:center}
}
</style>
</head>
<body>
<header id="hd">
  <span class="logo" onclick="navTo('home')">StreamVault</span>
  <nav>
    <button class="on" data-v="home">Home</button>
    <button data-v="browse">Browse</button>
    <button data-v="free">Free</button>
    <button data-v="list">My List</button>
  </nav>
  <input id="q" type="search" placeholder="Search title..." aria-label="Search">
</header>

<div id="hero"></div>
<main id="app"></main>

<footer>STREAMVAULT // NEXT-GEN STREAMING ARCHITECTURE</footer>

<!-- Info Modal -->
<div class="layer" id="md"><div class="panel" id="mp" tabindex="-1"></div></div>

<!-- Player Modal -->
<div class="layer" id="pl">
  <button class="x" id="px" aria-label="Close player">×</button>
  <div class="player-wrap">
    <div class="player" id="pv"></div>
    <div class="player-bar" id="pbar">
      <div class="player-row">
        <select id="srcSelect">
          <option value="vidsrcpro">Server 1 (VidSrc Pro)</option>
          <option value="autoembed">Server 2 (AutoEmbed)</option>
          <option value="vidrift">Server 3 (VidRift)</option>
          <option value="lumen">Server 4 (Lumen Engine)</option>
          <option value="2embed">Server 5 (2Embed)</option>
          <option value="smashy">Server 6 (SmashyStream)</option>
        </select>
        <button class="icon-btn" id="nextServerBtn" style="flex:0 0 auto">🔄 Cycle Server</button>
      </div>

      <div class="player-row">
        <label class="icon-btn" style="cursor:pointer;">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Load Subtitles
          <input type="file" id="subFileInput" accept=".srt,.vtt">
        </label>
        
        <button class="icon-btn" id="autoNextToggle">
          ⚡ Auto-Next: <span id="autoNextStatus">ON</span>
        </button>

        <button class="icon-btn" id="pFs" style="flex:0 0 auto" title="Toggle Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>

      <span id="pTitle" style="font-size:11px;color:var(--mute);font-family:var(--font-hud);text-align:center;margin-top:2px"></span>

      <div class="player-row" id="tvBtns" style="display:none;justify-content:center;margin-top:2px">
        <button class="icon-btn" id="pPrev">◀ Prev Episode</button>
        <button class="icon-btn" id="pNext">Next Episode ▶</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const IMG = 'https://image.tmdb.org/t/p/';
const api = (path, p = {}) => fetch('/api/tmdb?' + new URLSearchParams({ path, ...p })).then(r => { if (!r.ok) throw 0; return r.json(); });
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage[k]); } catch { return d; } },
  set: (k, v) => { localStorage[k] = JSON.stringify(v); }
};

const ROWS = [
  ['Trending Now', '/trending/all/week'],
  ['Popular Movies', '/movie/popular', {}, 'movie'],
  ['Anime Vault', '/discover/tv', { with_genres: 16, with_original_language: 'ja', sort_by: 'popularity.desc' }, 'tv'],
  ['Popular TV Shows', '/tv/popular', {}, 'tv'],
  ['Top Rated Cinema', '/movie/top_rated', {}, 'movie'],
  ['Top Rated Series', '/tv/top_rated', {}, 'tv']
];

const type = i => i.media_type || (i.title ? 'movie' : 'tv');
const name = i => i.title || i.name;
const year = i => (i.release_date || i.first_air_date || '').slice(0, 4);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg) {
  const t = $('#toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function card(i, def) {
  if (!i.poster_path) return '';
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.id = i.id;
  b.dataset.t = def || type(i);
  b.innerHTML = `<img loading="lazy" decoding="async" alt="${esc(name(i))}" src="${IMG}w342${i.poster_path}"><span class="t">${esc(name(i))}</span>`;
  b.onclick = () => openInfo(i.id, def || type(i));
  return b;
}

async function home() {
  $('#app').innerHTML = '';
  $('#hero').style.display = '';
  const wrap = $('#app');
  const top = document.createElement('section');
  top.className = 'row';
  top.style.order = 1;
  top.innerHTML = '<h2>Top 10 Worldwide</h2><div class="track"></div>';
  wrap.append(top);
  
  api('/trending/movie/day').then(d => {
    const t = top.querySelector('.track');
    d.results.slice(0, 10).forEach((i, n) => {
      const c = card(i, 'movie');
      if (!c) return;
      const w = document.createElement('div');
      w.className = 'tp';
      w.innerHTML = `<span class="rank">${n + 1}</span>`;
      w.append(c);
      t.append(w);
    });
  }).catch(() => top.remove());

  ROWS.forEach(async ([title, path, params, def], n) => {
    const sec = document.createElement('section');
    sec.className = 'row';
    sec.style.order = n * 2;
    sec.innerHTML = `<h2>${title}</h2><div class="track">${'<div class="card"></div>'.repeat(6)}</div>`;
    wrap.append(sec);
    try {
      const d = await api(path, params);
      const t = sec.querySelector('.track');
      t.innerHTML = '';
      d.results.forEach(i => {
        const c = card(i, def);
        c && t.append(c);
      });
      if (!t.children.length) return sec.remove();
      if (n === 0) heroes(d.results.filter(i => i.backdrop_path).slice(0, 5));
    } catch {
      sec.remove();
    }
  });

  const cw = store.get('cw', []);
  if (cw.length) {
    const s = document.createElement('section');
    s.className = 'row';
    s.style.order = -1;
    s.innerHTML = '<h2>Resume Playback</h2><div class="track"></div>';
    cw.forEach(x => {
      const b = document.createElement('button');
      b.className = 'card';
      b.innerHTML = `<span class="t" style="opacity:1">${esc(x.title)} ${x.s ? `S${x.s} E${x.e}` : ''}</span>`;
      b.style.background = 'var(--panel)';
      b.onclick = () => playStream(x.id, x.t, x.s || 1, x.e || 1, x.title);
      s.querySelector('.track').append(b);
    });
    wrap.append(s);
  }
}

let hTimer;
function heroes(list) {
  let n = 0;
  const show = () => hero(list[n++ % list.length]);
  show();
  clearInterval(hTimer);
  hTimer = setInterval(() => {
    if ($('#hero').style.display !== 'none' && !$('.layer.open')) show();
  }, 9000);
}

function hero(i) {
  if (!i) return;
  const h = $('#hero');
  const t = type(i);
  h.innerHTML = `<section class="hero" style="background-image:url(${IMG}w1280${i.backdrop_path})"><div><div class="chips"><span>★ ${(i.vote_average || 0).toFixed(1)}</span><span>${year(i)}</span><span>${t === 'tv' ? 'SERIES' : 'MOVIE'}</span></div><h1>${esc(name(i))}</h1><p>${esc(i.overview)}</p>
  <div class="hero-btns"><button class="btn" id="hp">▶ Stream Now</button><button class="btn alt" id="ht">Trailer</button><button class="btn alt" id="hi">Overview</button></div></div></section>`;
  $('#hp').onclick = () => playStream(i.id, t, 1, 1, name(i));
  $('#ht').onclick = () => trailer(i.id, t);
  $('#hi').onclick = () => openInfo(i.id, t);
}

async function openInfo(id, t) {
  const d = await api(`/${t}/${id}`, { append_to_response: 'videos,credits' }).catch(() => null);
  if (!d) return;
  const list = store.get('mylist', []);
  const saved = list.some(x => x.id === id && x.t === t);
  
  $('#mp').innerHTML = `<button class="x" id="mx" aria-label="Close">×</button>
  <div class="bd" style="background-image:linear-gradient(0deg,var(--panel-solid),transparent 70%),url(${d.backdrop_path ? IMG + 'w780' + d.backdrop_path : ''})"></div>
  <div class="in"><h2>${esc(name(d))}</h2>
  <p class="meta">${year(d)} · ★ ${(d.vote_average || 0).toFixed(1)} · ${(d.genres || []).map(g => esc(g.name)).slice(0,3).join(', ')}</p>
  <p style="margin-bottom:16px;font-size:13px">${esc(d.overview)}</p>
  <div class="hero-btns">${t === 'movie' ? `<button class="btn" id="mw">▶ Stream Now</button>` : ''}
  <button class="btn alt" id="mt">Trailer</button>
  <button class="btn alt" id="ms">${saved ? 'Remove' : '+ My List'}</button></div>
  ${t === 'tv' ? `<div style="margin-top:16px">
    <div class="ep-controls">
      <select id="sn">${(d.seasons || []).filter(s => s.season_number > 0).map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('')}</select>
      <input type="text" id="epSearch" placeholder="Filter episodes..." style="flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:6px;font-size:12px">
    </div>
    <div id="eps"></div>
  </div>`: ''}
  </div><h3 class="sub">Similar Transmissions</h3><div class="track" id="sim"></div>`;

  $('#md').classList.add('open');
  $('#mp').scrollTop = 0;

  if (t === 'movie') {
    $('#mw').onclick = () => playStream(id, 'movie', 1, 1, name(d));
  }
  if (t === 'tv') {
    loadEps(id, $('#sn'), name(d));
  }
  api(`/${t}/${id}/similar`).then(r => r.results.forEach(i => { const c = card(i, t); c && $('#sim').append(c); })).catch(() => {});
  $('#mx').onclick = () => $('#md').classList.remove('open');
  $('#mt').onclick = () => trailer(id, t, d);
  $('#ms').onclick = () => {
    let l = store.get('mylist', []);
    if (saved) { l = l.filter(x => !(x.id === id && x.t === t)); toast('Removed from list'); }
    else { l = [...l, { id, t, poster_path: d.poster_path, title: d.title || d.name, name: d.name }]; toast('Added to list'); }
    store.set('mylist', l);
    openInfo(id, t);
  };
}

$('#md').onclick = e => { if (e.target === $('#md')) $('#md').classList.remove('open'); };
$('#pl').onclick = e => { if (e.target === $('#pl')) closePlayer(); };

async function loadEps(id, sel, showName = '') {
  if (!sel || !sel.value) return;
  sel.onchange = () => loadEps(id, sel, showName);
  const box = $('#eps');
  box.innerHTML = '<p class="meta">Loading episodes…</p>';
  const s = await api(`/tv/${id}/season/${sel.value}`).catch(() => null);
  if (!s || !s.episodes) { box.innerHTML = '<p class="meta">Episodes unavailable.</p>'; return; }
  box.innerHTML = s.episodes.map(e => `<div class="ep" onclick="playStream('${id}','tv','${sel.value}','${e.episode_number}','${esc(showName)}')">${e.still_path ? `<img loading="lazy" alt="" src="${IMG}w300${e.still_path}">` : '<span></span>'}<div><b>E${e.episode_number}: ${esc(e.name)} ▶</b><p>${esc(e.overview)}</p></div></div>`).join('');
}

let curPlaying = null;
let autoNextEnabled = true;

$('#autoNextToggle').onclick = () => {
  autoNextEnabled = !autoNextEnabled;
  $('#autoNextStatus').innerText = autoNextEnabled ? 'ON' : 'OFF';
};

// MULTI-SERVER STREAM ROUTER
function getEmbedUrl(provider, id, t, s, e) {
  switch(provider) {
    case 'vidsrcpro': return t === 'movie' ? `https://vidsrc.pro/embed/movie/${id}` : `https://vidsrc.pro/embed/tv/${id}/${s}/${e}`;
    case 'autoembed': return t === 'movie' ? `https://player.autoembed.cc/embed/movie/${id}` : `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`;
    case 'vidrift': return t === 'movie' ? `https://vidrift.net/embed/movie/${id}` : `https://vidrift.net/embed/tv/${id}/${s}/${e}`;
    case 'lumen': return t === 'movie' ? `https://embed.lumen.to/movie/${id}` : `https://embed.lumen.to/tv/${id}/${s}/${e}`;
    case '2embed': return t === 'movie' ? `https://www.2embed.cc/embed/${id}` : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`;
    case 'smashy': return t === 'movie' ? `https://embed.smashystream.com/playere.php?tmdb=${id}` : `https://embed.smashystream.com/playere.php?tmdb=${id}&s=${s}&e=${e}`;
    default: return `https://vidsrc.pro/embed/movie/${id}`;
  }
}

function renderIframe() {
  if (!curPlaying) return;
  const { id, t, s, e } = curPlaying;
  const provider = $('#srcSelect').value;
  const url = getEmbedUrl(provider, id, t, s, e);
  
  /* Strip referrer to prevent adblock/Vercel domain blocks */
  $('#pv').innerHTML = `<iframe id="mainIframe" src="${url}" referrerpolicy="no-referrer" allow="fullscreen; autoplay; picture-in-picture; encrypted-media; gyroscope; accelerometer" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>`;
}

$('#nextServerBtn').onclick = () => {
  const sel = $('#srcSelect');
  sel.selectedIndex = (sel.selectedIndex + 1) % sel.options.length;
  toast(`Switched to ${sel.options[sel.selectedIndex].text}`);
  renderIframe();
};

function playStream(id, t, s = 1, e = 1, title = '') {
  const sNum = parseInt(s, 10);
  const eNum = parseInt(e, 10);
  curPlaying = { id, t, s: sNum, e: eNum, title };
  renderIframe();
  $('#pTitle').innerText = t === 'tv' ? `${title} // S${sNum} E${eNum}` : title;
  $('#tvBtns').style.display = t === 'tv' ? 'flex' : 'none';
  if (t === 'tv') {
    $('#pPrev').onclick = () => playStream(id, t, sNum, Math.max(1, eNum - 1), title);
    $('#pNext').onclick = () => playStream(id, t, sNum, eNum + 1, title);
  }
  $('#pl').classList.add('open');
  let cw = store.get('cw', []);
  cw = [{ id, t, s: sNum, e: eNum, title }, ...cw.filter(x => x.id !== id)].slice(0, 10);
  store.set('cw', cw);
}

$('#srcSelect').onchange = renderIframe;

$('#pFs').onclick = () => {
  const iframe = $('#mainIframe');
  if (!iframe) return;
  if (iframe.requestFullscreen) iframe.requestFullscreen();
};

async function trailer(id, t, d) {
  d = d || await api(`/${t}/${id}`, { append_to_response: 'videos' });
  const v = (d.videos?.results || []).filter(v => v.site === 'YouTube').sort((a, b) => (b.type === 'Trailer') - (a.type === 'Trailer'))[0];
  if (!v) return alert('No trailer available.');
  $('#tvBtns').style.display = 'none';
  $('#pv').innerHTML = `<iframe id="mainIframe" src="https://www.youtube-nocookie.com/embed/${v.key}?autoplay=1" allow="fullscreen; autoplay" allowfullscreen="true"></iframe>`;
  $('#pl').classList.add('open');
}

function closePlayer() {
  $('#pl').classList.remove('open');
  $('#pv').innerHTML = '';
}
$('#px').onclick = closePlayer;

function showGrid(items, msg) {
  $('#hero').style.display = 'none';
  const a = $('#app');
  a.innerHTML = '';
  if (!items.length) { a.innerHTML = `<p class="empty">${msg}</p>`; return; }
  const g = document.createElement('div');
  g.className = 'grid';
  items.forEach(i => { const c = card(i, i.t); c && g.append(c); });
  a.append(g);
}

function myList() {
  const list = store.get('mylist', []);
  showGrid(list, 'Your library is empty. Add titles via "+ My List".');
}

function navTo(v) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'home') home();
  else if (v === 'list') myList();
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => navTo(b.dataset.v));

let qTimer;
$('#q').oninput = e => {
  clearTimeout(qTimer);
  const q = e.target.value.trim();
  if (!q) { navTo('home'); return; }
  qTimer = setTimeout(async () => {
    const d = await api('/search/multi', { query: q }).catch(() => ({ results: [] }));
    showGrid(d.results.filter(i => i.poster_path), 'No transmissions found matching "' + esc(q) + '"');
  }, 300);
};

window.onscroll = () => $('#hd').classList.toggle('solid', window.scrollY > 20);

home();
</script>
</body>
</html>
